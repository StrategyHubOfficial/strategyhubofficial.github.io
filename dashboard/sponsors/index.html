layout: default
title: Supporters

<style>
.tier-section {
            margin-bottom: 3rem;
        }
        .tier-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .tier-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .badge-supporter {
            background: #2d5016;
            color: #4ade80;
        }
        .badge-contributor {
            background: #1e3a8a;
            color: #60a5fa;
        }
        .badge-patron {
            background: linear-gradient(135deg, #f7931a 0%, #ffb84d 100%);
            color: #000;
        }
        .supporter-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .supporter-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bitcoin-orange) 0%, var(--bitcoin-orange-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--bg-darker);
            flex-shrink: 0;
        }
        .supporter-info {
            flex: 1;
        }
        .supporter-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .pricing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        .pricing-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: var(--transition);
        }
        .pricing-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .pricing-card.featured {
            border-color: var(--bitcoin-orange);
            background: linear-gradient(135deg, rgba(247, 147, 26, 0.1) 0%, rgba(247, 147, 26, 0.05) 100%);
        }
        .pricing-tier {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .pricing-amount {
            font-size: 3rem;
            font-weight: 700;
            color: var(--bitcoin-orange);
            margin: 1rem 0;
        }
        .pricing-amount span {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }
        .pricing-features {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
            text-align: left;
        }
        .pricing-features li {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .pricing-features li::before {
            content: "✓ ";
            color: var(--bitcoin-orange);
            font-weight: 700;
            margin-right: 0.5rem;
        }
        .current-sponsorship {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid rgba(0, 184, 148, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .current-sponsorship h3 {
            color: var(--success);
            margin-bottom: 1rem;
        }
</style>
