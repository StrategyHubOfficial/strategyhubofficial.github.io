---
layout: default
title: Supporters
---

<style>
.tier-section {
            margin-bottom: 3rem;
        }
        .tier-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .tier-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .badge-supporter {
            background: #2d5016;
            color: #4ade80;
        }
        .badge-contributor {
            background: #1e3a8a;
            color: #60a5fa;
        }
        .badge-patron {
            background: linear-gradient(135deg, #f7931a 0%, #ffb84d 100%);
            color: #000;
        }
        .supporter-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }
        .supporter-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            background: var(--bg-card-hover);
        }
        .supporters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .supporter-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bitcoin-orange) 0%, var(--bitcoin-orange-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--bg-darker);
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }
        .supporter-info {
            width: 100%;
        }
        .supporter-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .pricing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        .pricing-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: var(--transition);
        }
        .pricing-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .pricing-card.featured {
            border-color: var(--bitcoin-orange);
            background: linear-gradient(135deg, rgba(247, 147, 26, 0.1) 0%, rgba(247, 147, 26, 0.05) 100%);
        }
        .pricing-tier {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .pricing-amount {
            font-size: 3rem;
            font-weight: 700;
            color: var(--bitcoin-orange);
            margin: 1rem 0;
        }
        .pricing-amount span {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }
        .pricing-features {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
            text-align: left;
        }
        .pricing-features li {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .pricing-features li::before {
            content: "✓ ";
            color: var(--bitcoin-orange);
            font-weight: 700;
            margin-right: 0.5rem;
        }
        .current-sponsorship {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid rgba(0, 184, 148, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .current-sponsorship h3 {
            color: var(--success);
            margin-bottom: 1rem;
        }
</style>

<div class="container">
        <h1>Support StrategyHub</h1>
        <p style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 1.1rem;">
            Support Bitcoin infrastructure development. Become a supporter and get a badge on your profile.
        </p>

        <div id="current-sponsorship" style="display: none;"></div>

        <div style="max-width: 500px; margin: 0 auto;">
            <div class="pricing-card" style="text-align: center;">
                <div class="pricing-tier">Supporter</div>
                <div class="pricing-amount">25,000<span> sats/month</span></div>
                <ul class="pricing-features" style="text-align: left; margin: 2rem 0;">
                    <li>Supporter badge on your profile</li>
                    <li>Name on supporters page</li>
                </ul>
                <button class="btn" onclick="purchaseSponsorship()">Become a Supporter</button>
            </div>
        </div>

        <h2 style="margin: 4rem 0 2rem 0;">Our Supporters</h2>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading supporters...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="supporters-content" style="display: none;">
            <div id="supporters-list" class="supporters-grid"></div>
        </div>
    </div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        async function loadSupporters() {
            try {
                const response = await api.get('/api/members');
                if (!response.success) {
                    throw new Error(response.error || 'Failed to load supporters');
                }

                const members = response.data || [];
                const supporters = members.filter(m => 
                    m.sponsorship && 
                    m.sponsorship.status === 'active'
                );

                // Render all supporters
                renderTier('supporters-list', supporters);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('supporters-content').style.display = 'block';
            } catch (error) {
                console.error('Error loading supporters:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = error.message || 'Failed to load supporters';
                document.getElementById('error').style.display = 'block';
                if (typeof toast !== 'undefined') {
                    toast.error('Failed to load supporters');
                }
            }
        }

        function renderTier(containerId, supporters) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (supporters.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); padding: 2rem; text-align: center;">No supporters yet. Be the first!</p>';
                return;
            }

            container.innerHTML = supporters.map(supporter => {
                const initials = supporter.name?.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || '?';
                const tier = supporter.sponsorship?.tier || 'supporter';
                
                return `
                    <div class="supporter-card">
                        <div class="supporter-avatar">${initials}</div>
                        <div class="supporter-info">
                            <div class="supporter-name">${supporter.name || 'Unknown'}</div>
                            ${supporter.company ? `<div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">${supporter.company}</div>` : ''}
                            ${supporter.bio ? `<div style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem; line-height: 1.5;">${supporter.bio}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.purchaseSponsorship = async function() {
            try {
                if (!auth.isAuthenticated()) {
                    toast.error('Please log in to become a supporter');
                    window.location.href = '/dashboard/login.html';
                    return;
                }

                const response = await api.post('/api/sponsorships', {});
                if (!response.success) {
                    throw new Error(response.error || 'Failed to create sponsorship');
                }

                if (response.data.paymentUrl) {
                    window.location.href = response.data.paymentUrl;
                } else {
                    toast.success('Sponsorship created successfully');
                    await loadSupporters();
                }
            } catch (error) {
                console.error('Error purchasing sponsorship:', error);
                toast.error(error.message || 'Failed to purchase sponsorship');
            }
        };

        // Initialize
        await auth.requireAuth();
        await loadSupporters();
    })();
</script>
