<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StrategyHub</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/form-validation.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }

        .login-card h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            text-align: center;
        }

        .login-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--bitcoin-orange);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, var(--bitcoin-orange) 0%, var(--bitcoin-orange-light) 100%);
            color: var(--bg-darker);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            filter: brightness(1.1);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(214, 48, 49, 0.1);
            border: 1px solid rgba(214, 48, 49, 0.3);
            color: #d63031;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--bitcoin-orange);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-text">StrategyHub</div>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>
            
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="error-message" style="background: rgba(0, 184, 148, 0.1); border-color: rgba(0, 184, 148, 0.3); color: #00b894; display: none;"></div>
            
            <form id="login-form" data-validate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com" 
                        required 
                        autocomplete="email"
                        data-validate="required|email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                        data-validate="required"
                    >
                </div>
                
                <button type="submit" class="btn-login" id="login-btn">
                    Sign In
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/dashboard/forgot-password.html" style="color: var(--bitcoin-orange); text-decoration: none; font-size: 0.9rem;">Forgot password?</a>
            </div>
            
            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color); text-align: center;">
                <p style="margin-bottom: 1rem; color: var(--text-secondary);">Or sign in with</p>
                <button id="github-login-btn" class="btn-login" style="background: #24292e; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Sign in with GitHub
                </button>
            </div>
            
            <div style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">Don't have an account?</p>
                <a href="https://strategy.com/hub" class="btn-secondary" style="display: inline-block; text-decoration: none; padding: 0.75rem 1.5rem;">Apply to Join</a>
            </div>
        </div>
    </div>

    <script>
        // Check for token in URL (from OAuth callback) - do this first
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('hub_token', token);
            window.location.href = '/dashboard';
            return;
        }

        // Check for registration success
        if (urlParams.get('registered') === 'true') {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = 'Registration successful! Please log in with your new account.';
            successDiv.style.display = 'block';
        }

        // Check if already logged in
        (async () => {
            if (auth.isAuthenticated()) {
                const isValid = await auth.checkAuth();
                if (isValid) {
                    window.location.href = '/dashboard/';
                    return;
                }
            }
        })();

        // Handle login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('error-message');
            
            // Clear previous errors
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            
            try {
                const result = await auth.login(email, password);
                
                if (result.success) {
                    // Don't show toast here - just redirect (toast might be shown elsewhere)
                    setTimeout(() => {
                        window.location.href = '/dashboard/';
                    }, 100);
                } else {
                    // Show error
                    const errorMsg = result.error || 'Login failed. Please check your credentials.';
                    errorDiv.textContent = errorMsg;
                    errorDiv.classList.add('show');
                    // Only show toast if it's not already shown in the error div
                    if (typeof toast !== 'undefined') {
                        toast.error(errorMsg);
                    }
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (error) {
                const errorMsg = error.message || 'An error occurred. Please try again.';
                errorDiv.textContent = errorMsg;
                errorDiv.classList.add('show');
                // Only show toast if it's not already shown in the error div
                if (typeof toast !== 'undefined') {
                    toast.error(errorMsg);
                }
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // GitHub OAuth login
        document.getElementById('github-login-btn').addEventListener('click', async () => {
            try {
                const response = await api.get('/api/auth/github');
                if (response.success) {
                    window.location.href = response.data.authUrl;
                } else {
                    const errorDiv = document.getElementById('error-message');
                    errorDiv.textContent = 'Failed to initiate GitHub login. Please try again.';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('GitHub OAuth error:', error);
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = 'Error initiating GitHub login. Please try again.';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
