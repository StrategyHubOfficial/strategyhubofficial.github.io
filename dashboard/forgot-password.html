---
layout: default
title: Forgot Password
---

<style>
.forgot-container {
    max-width: 500px;
    margin: 4rem auto;
    padding: 2rem;
}

.forgot-form {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 2rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text-primary);
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.875rem;
    background: var(--bg-darker);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 1rem;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: var(--bitcoin-orange);
    box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.1);
}

.help-text {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.btn {
    flex: 1;
}
</style>

<div class="forgot-container">
    <div class="forgot-form">
        <h1>Forgot Password</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Enter your email address and we'll send you a link to reset your password.</p>
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" style="display: none; background: rgba(0, 184, 148, 0.1); border: 1px solid rgba(0, 184, 148, 0.3); color: #00b894; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;"></div>
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Send Reset Link</button>
                <a href="/dashboard/login.html" class="btn" style="background: var(--bg-darker); text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
    (async function() {
        if (typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        // Form submission
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            try {
                const response = await api.post('/api/auth/forgot-password', {
                    email: email
                });

                if (response.success) {
                    document.getElementById('forgot-form').style.display = 'none';
                    document.getElementById('success').textContent = 'If an account with that email exists, a password reset link has been sent. Please check your email.';
                    document.getElementById('success').style.display = 'block';
                } else {
                    toast.error(response.error || 'Failed to send reset link');
                }
            } catch (error) {
                console.error('Error sending reset link:', error);
                toast.error('Error sending reset link');
            }
        });
    })();
</script>
