<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - StrategyHub Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <style>
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .event-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .event-card:hover {
            border-color: #f7931a;
            transform: translateY(-2px);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .event-title {
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
        }
        .event-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #2d5016;
            color: #4ade80;
        }
        .event-type.workshop { background: #1e3a8a; color: #60a5fa; }
        .event-type.talk { background: #7c2d12; color: #fb923c; }
        .event-type.networking { background: #78350f; color: #fbbf24; }
        .event-details {
            color: #ccc;
            margin: 1rem 0;
        }
        .event-details strong {
            color: #f7931a;
        }
        .rsvp-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }
        .rsvp-count {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .calendar-view {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .calendar-day {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.5rem;
            min-height: 80px;
            font-size: 0.85rem;
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }
        .calendar-day.today {
            border-color: #f7931a;
        }
        .calendar-day-number {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .calendar-event {
            background: #f7931a;
            color: #000;
            padding: 0.25rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            cursor: pointer;
        }
        .subscriptions-panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .subscriptions-panel h3 {
            margin-top: 0;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid"><a class="navbar-brand" href="/dashboard">StrategyHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto">
            <li><a href="/dashboard">Dashboard</a></li>
            <li class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="studioDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Studio</a>
                <ul class="dropdown-menu" aria-labelledby="studioDropdown">
                    <li><a class="dropdown-item" href="/dashboard/studio">Book Studio</a></li>
                    <li><a class="dropdown-item" href="/dashboard/resources">Equipment</a></li>
                </ul></div></div>
            </li>
            <li class="dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="usersDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Users</a>
                <ul class="dropdown-menu" aria-labelledby="usersDropdown">
                    <li><a class="dropdown-item" href="/dashboard/members">Members</a></li>
                    <li><a class="dropdown-item" href="/dashboard/sponsors">Supporters</a></li>
                </ul></div></div>
            </li>
            <li><a href="/dashboard/projects" class="nav-link">Projects</a></li>
            <li><a href="/dashboard/events" class="nav-link active">Events</a></li>
            <li><a href="#" id="logout-link" class="nav-link">Logout</a></li>
        </ul></div></div>
    </nav>
    <script>
        document.getElementById('mobile-menu-toggle')?.addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });
    </script>

    <div class="container">
        <div class="events-header">
            <h1>Events & Calendar</h1>
            <button class="btn" onclick="showCreateEvent()">Create Event</button>
        </div>

        <div id="subscriptions-panel" class="subscriptions-panel">
            <h3>Notification Preferences</h3>
            <p style="color: #888; margin-bottom: 1rem;">Choose which event types you want to receive notifications for:</p>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-meetup" value="meetup">
                    <span>Meetups</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-workshop" value="workshop">
                    <span>Workshops</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-talk" value="talk">
                    <span>Talks</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-networking" value="networking">
                    <span>Networking</span>
                </label>
            </div>
            <div style="margin-top: 1rem;">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-new">
                    <span>Notify me when new events are created</span>
                </label>
            </div>
            <div style="margin-top: 1rem;">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-reminder">
                    <span>Send reminders before events</span>
                </label>
            </div>
            <button class="btn btn-small" onclick="saveSubscriptions()" style="margin-top: 1rem;">Save Preferences</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading events...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="events-content" style="display: none;">
            <div class="tabs" style="margin-bottom: 2rem;">
                <button class="tab-btn active" data-view="list">List View</button>
                <button class="tab-btn" data-view="calendar">Calendar View</button>
            </div>

            <div id="events-list"></div>
            <div id="calendar-view" class="calendar-view" style="display: none;"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/protected-route.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script>
        let events = [];
        let currentView = 'list';
        let subscriptions = null;

        async function loadEvents() {
            try {
                const response = await api.get('/api/events');
                if (response.success) {
                    events = response.data || [];
                    renderEvents();
                } else {
                    toast.error('Failed to load events');
                    document.getElementById('error').textContent = 'Failed to load events';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading events:', error);
                toast.error('Error loading events');
                document.getElementById('error').textContent = 'Error loading events';
                document.getElementById('error').style.display = 'block';
            }
        }

        async function loadSubscriptions() {
            try {
                const response = await api.get('/api/subscriptions/events');
                if (response.success) {
                    subscriptions = response.data;
                    updateSubscriptionUI();
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
            }
        }

        function updateSubscriptionUI() {
            if (!subscriptions) return;
            
            document.getElementById('notify-meetup').checked = subscriptions.eventTypes.includes('meetup');
            document.getElementById('notify-workshop').checked = subscriptions.eventTypes.includes('workshop');
            document.getElementById('notify-talk').checked = subscriptions.eventTypes.includes('talk');
            document.getElementById('notify-networking').checked = subscriptions.eventTypes.includes('networking');
            document.getElementById('notify-new').checked = subscriptions.notifyOnNewEvent;
            document.getElementById('notify-reminder').checked = subscriptions.notifyBeforeEvent;
        }

        async function saveSubscriptions() {
            const eventTypes = [];
            if (document.getElementById('notify-meetup').checked) eventTypes.push('meetup');
            if (document.getElementById('notify-workshop').checked) eventTypes.push('workshop');
            if (document.getElementById('notify-talk').checked) eventTypes.push('talk');
            if (document.getElementById('notify-networking').checked) eventTypes.push('networking');

            try {
                const response = await api.put('/api/subscriptions/events', {
                    eventTypes,
                    notifyOnNewEvent: document.getElementById('notify-new').checked,
                    notifyBeforeEvent: document.getElementById('notify-reminder').checked
                });

                if (response.success) {
                    toast.success('Preferences saved!');
                    subscriptions = response.data;
                } else {
                    toast.error('Failed to save preferences');
                }
            } catch (error) {
                console.error('Error saving subscriptions:', error);
                toast.error('Error saving preferences');
            }
        }

        async function rsvpToEvent(eventId) {
            try {
                const response = await api.post(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP confirmed!');
                    await loadEvents();
                } else {
                    toast.error('Failed to RSVP: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error RSVPing:', error);
                toast.error('Error RSVPing to event');
            }
        }

        async function cancelRSVP(eventId) {
            try {
                const response = await api.delete(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP cancelled');
                    await loadEvents();
                } else {
                    toast.error('Failed to cancel RSVP');
                }
            } catch (error) {
                console.error('Error canceling RSVP:', error);
                toast.error('Error canceling RSVP');
            }
        }

        function renderEvents() {
            const container = document.getElementById('events-list');
            if (events.length === 0) {
                container.innerHTML = '<p>No events scheduled.</p>';
                return;
            }

            container.innerHTML = events.map(event => {
                const eventDate = new Date(event.startTime);
                const currentUser = auth.getCurrentUser();
                const isRSVPd = currentUser && event.rsvps && event.rsvps.includes(currentUser.id);
                const rsvpCount = event.rsvps ? event.rsvps.length : 0;
                const maxAttendees = event.maxAttendees || 'Unlimited';

                return `
                    <div class="event-card">
                        <div class="event-header">
                            <h2 class="event-title">${event.title}</h2>
                            <span class="event-type ${event.type}">${event.type}</span>
                        </div>
                        <div class="event-details">
                            <p><strong>When:</strong> ${eventDate.toLocaleString()}</p>
                            <p><strong>Where:</strong> ${event.location}</p>
                            ${event.description ? `<p>${event.description}</p>` : ''}
                        </div>
                        <div class="rsvp-section">
                            <div class="rsvp-count">${rsvpCount} / ${maxAttendees} attending</div>
                            ${!isRSVPd 
                                ? `<button class="btn btn-small" onclick="rsvpToEvent('${event.id}')">RSVP</button>`
                                : `<button class="btn-secondary btn-small" onclick="cancelRSVP('${event.id}')">Cancel RSVP</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.view;
                
                if (currentView === 'calendar') {
                    document.getElementById('events-list').style.display = 'none';
                    document.getElementById('calendar-view').style.display = 'grid';
                    renderCalendar();
                } else {
                    document.getElementById('events-list').style.display = 'block';
                    document.getElementById('calendar-view').style.display = 'none';
                }
            });
        });

        function renderCalendar() {
            // Simple calendar implementation
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());

            const container = document.getElementById('calendar-view');
            container.innerHTML = '';

            // Day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const header = document.createElement('div');
                header.textContent = day;
                header.style.fontWeight = '600';
                header.style.textAlign = 'center';
                container.appendChild(header);
            });

            // Calendar days
            const currentDate = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                if (currentDate.getMonth() !== month) {
                    dayDiv.classList.add('other-month');
                }
                
                if (currentDate.toDateString() === now.toDateString()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<div class="calendar-day-number">${currentDate.getDate()}</div>`;
                
                // Add events for this day
                const dayEvents = events.filter(e => {
                    const eventDate = new Date(e.startTime);
                    return eventDate.toDateString() === currentDate.toDateString();
                });

                dayEvents.forEach(event => {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'calendar-event';
                    eventDiv.textContent = event.title;
                    eventDiv.onclick = () => {
                        document.getElementById('events-list').style.display = 'block';
                        document.getElementById('calendar-view').style.display = 'none';
                        document.querySelectorAll('.tab-btn')[0].click();
                        document.getElementById('events-list').scrollIntoView();
                    };
                    dayDiv.appendChild(eventDiv);
                });

                container.appendChild(dayDiv);
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        function showCreateEvent() {
            // Simple create event form
            const title = prompt('Event Title:');
            if (!title) return;
            
            const description = prompt('Description:');
            const location = prompt('Location:');
            const startTime = prompt('Start Time (YYYY-MM-DDTHH:MM):');
            const endTime = prompt('End Time (YYYY-MM-DDTHH:MM):');
            const type = prompt('Type (meetup/workshop/talk/networking):') || 'meetup';

            if (!startTime || !endTime || !location) {
                toast.error('All fields are required');
                return;
            }

            createEvent({ title, description, location, startTime, endTime, type });
        }

        async function createEvent(data) {
            try {
                const response = await api.post('/api/events', data);
                if (response.success) {
                    toast.success('Event created!');
                    await loadEvents();
                } else {
                    toast.error('Failed to create event: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating event:', error);
                toast.error('Error creating event');
            }
        }

        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('events-content').style.display = 'block';
            await loadEvents();
            await loadSubscriptions();
        })();

        document.getElementById('logout-link').addEventListener('click', async (e) => {
            e.preventDefault();
            await auth.logout();
        });
    </script>
</body>
</html>
