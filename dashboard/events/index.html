---
layout: default
title: Events
---

<style>
.events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .event-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .event-card:hover {
            border-color: #f7931a;
            transform: translateY(-2px);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .event-title {
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
        }
        .event-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #2d5016;
            color: #4ade80;
        }
        .event-type.workshop { background: #1e3a8a; color: #60a5fa; }
        .event-type.talk { background: #7c2d12; color: #fb923c; }
        .event-type.networking { background: #78350f; color: #fbbf24; }
        .event-details {
            color: #ccc;
            margin: 1rem 0;
        }
        .event-details strong {
            color: #f7931a;
        }
        .rsvp-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }
        .rsvp-count {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .calendar-view {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .calendar-day {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.5rem;
            min-height: 80px;
            font-size: 0.85rem;
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }
        .calendar-day.today {
            border-color: #f7931a;
        }
        .calendar-day-number {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .calendar-event {
            background: #f7931a;
            color: #000;
            padding: 0.25rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            cursor: pointer;
        }
        .subscriptions-panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .subscriptions-panel h3 {
            margin-top: 0;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
</style>

<div class="container">
        <div class="events-header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1>Events & Calendar</h1>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="select-all-events" onchange="toggleSelectAllEvents()">
                    <span style="font-size: 0.9rem;">Select All</span>
                </label>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="search-bar" style="max-width: 400px;">
                    <input type="text" id="search-input" placeholder="Search events by title, description, or location...">
                </div>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="subscriptionsDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notification Preferences">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="margin-right: 0.5rem;">
                            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.292-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.292c.415.764-.42 1.6-1.185 1.184l-.292-.159a1.873 1.873 0 0 0-2.692 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.693-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.292A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
                        </svg>
                        Notification Preferences
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="subscriptionsDropdown" style="min-width: 320px; padding: 1.5rem;">
                        <li>
                            <h6 class="dropdown-header" style="margin-bottom: 1rem;">Notification Preferences</h6>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <p style="margin-bottom: 1rem; font-size: 0.9rem;">Choose which event types you want to receive notifications for:</p>
                        </li>
                        <li style="padding: 0 0.5rem;">
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-meetup" value="meetup">
                                    <span>Meetups</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-workshop" value="workshop">
                                    <span>Workshops</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-talk" value="talk">
                                    <span>Talks</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-networking" value="networking">
                                    <span>Networking</span>
                                </label>
                            </div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <label class="checkbox-item">
                                <input type="checkbox" id="notify-new">
                                <span>Notify me when new events are created</span>
                            </label>
                        </li>
                        <li style="padding: 0 0.5rem;">
                            <label class="checkbox-item">
                                <input type="checkbox" id="notify-reminder">
                                <span>Send reminders before events</span>
                            </label>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <button class="btn btn-primary btn-sm w-100" onclick="saveSubscriptions()">Save Preferences</button>
                        </li>
                    </ul>
                </div>
                <button class="btn" onclick="showCreateEvent()">Create Event</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading events...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="events-content" style="display: none;">
            <div class="tabs" style="margin-bottom: 2rem;">
                <button class="tab-btn active" data-view="list">List View</button>
                <button class="tab-btn" data-view="calendar">Calendar View</button>
            </div>

            <!-- Bulk Actions Toolbar -->
            <div id="bulk-actions-toolbar" style="display: none; margin-bottom: 1rem; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <span id="selected-events-count" style="color: var(--text-primary); font-weight: 600;"></span>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="bulkApproveEvents()">Approve Selected</button>
                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="bulkRejectEvents()">Reject Selected</button>
                    <button class="btn btn-secondary btn-small" onclick="clearEventSelection()">Clear Selection</button>
                </div>
            </div>
            <div id="events-list"></div>
            <div id="calendar-view" class="calendar-view" style="display: none;"></div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="create-event-modal" class="create-project-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Create New Event</h2>
                <button onclick="closeCreateEventModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <form id="create-event-form">
                <div class="form-group">
                    <label>Event Title *</label>
                    <input type="text" id="event-title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="event-description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" id="event-location" required>
                </div>
                <div class="form-group">
                    <label>Start Time *</label>
                    <input type="datetime-local" id="event-start-time" required>
                </div>
                <div class="form-group">
                    <label>End Time *</label>
                    <input type="datetime-local" id="event-end-time" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="event-type">
                        <option value="meetup">Meetup</option>
                        <option value="workshop">Workshop</option>
                        <option value="talk">Talk</option>
                        <option value="networking">Networking</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn">Create Event</button>
                    <button type="button" class="btn-secondary" onclick="closeCreateEventModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Reject Modal -->
    <div id="confirm-reject-event-modal" class="create-project-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; max-width: 500px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Confirm Rejection</h2>
                <button onclick="closeConfirmRejectEventModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <p>Are you sure you want to reject this event?</p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #7f1d1d; color: #f87171;" onclick="confirmRejectEvent()">Reject</button>
                <button type="button" class="btn-secondary" onclick="closeConfirmRejectEventModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Confirm Bulk Action Modal -->
    <div id="confirm-bulk-event-modal" class="create-project-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem; max-width: 500px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="confirm-bulk-event-title">Confirm Action</h2>
                <button onclick="closeConfirmBulkEventModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <p id="confirm-bulk-event-message"></p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" id="confirm-bulk-event-button" onclick="executeBulkEventAction()">Confirm</button>
                <button type="button" class="btn-secondary" onclick="closeConfirmBulkEventModal()">Cancel</button>
            </div>
        </div>
    </div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }
        let events = [];
        let filteredEvents = [];
        let currentView = 'list';
        let subscriptions = null;
        let searchQuery = '';
        let searchTimeout = null;

        async function loadEvents() {
            try {
                // Admins can see pending events, regular users only see approved
                const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                const url = isAdmin ? '/api/events?includePending=true' : '/api/events';
                const response = await api.get(url);
                if (response.success) {
                    events = response.data || [];
                    filteredEvents = events;
                    applyFilters();
                } else {
                    toast.error('Failed to load events');
                    document.getElementById('error').textContent = 'Failed to load events';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading events:', error);
                toast.error('Error loading events');
                document.getElementById('error').textContent = 'Error loading events';
                document.getElementById('error').style.display = 'block';
            }
        }

        async function loadSubscriptions() {
            try {
                const response = await api.get('/api/subscriptions/events');
                if (response.success) {
                    subscriptions = response.data;
                    updateSubscriptionUI();
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
            }
        }

        function updateSubscriptionUI() {
            if (!subscriptions) return;
            
            document.getElementById('notify-meetup').checked = subscriptions.eventTypes.includes('meetup');
            document.getElementById('notify-workshop').checked = subscriptions.eventTypes.includes('workshop');
            document.getElementById('notify-talk').checked = subscriptions.eventTypes.includes('talk');
            document.getElementById('notify-networking').checked = subscriptions.eventTypes.includes('networking');
            document.getElementById('notify-new').checked = subscriptions.notifyOnNewEvent;
            document.getElementById('notify-reminder').checked = subscriptions.notifyBeforeEvent;
        }

        async function saveSubscriptions() {
            const eventTypes = [];
            if (document.getElementById('notify-meetup').checked) eventTypes.push('meetup');
            if (document.getElementById('notify-workshop').checked) eventTypes.push('workshop');
            if (document.getElementById('notify-talk').checked) eventTypes.push('talk');
            if (document.getElementById('notify-networking').checked) eventTypes.push('networking');

            try {
                const response = await api.put('/api/subscriptions/events', {
                    eventTypes,
                    notifyOnNewEvent: document.getElementById('notify-new').checked,
                    notifyBeforeEvent: document.getElementById('notify-reminder').checked
                });

                if (response.success) {
                    toast.success('Preferences saved!');
                    subscriptions = response.data;
                } else {
                    toast.error('Failed to save preferences');
                }
            } catch (error) {
                console.error('Error saving subscriptions:', error);
                toast.error('Error saving preferences');
            }
        }

        async function rsvpToEvent(eventId) {
            try {
                const response = await api.post(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP confirmed!');
                    await loadEvents();
                } else {
                    toast.error('Failed to RSVP: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error RSVPing:', error);
                toast.error('Error RSVPing to event');
            }
        }

        async function cancelRSVP(eventId) {
            try {
                const response = await api.delete(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP cancelled');
                    await loadEvents();
                } else {
                    toast.error('Failed to cancel RSVP');
                }
            } catch (error) {
                console.error('Error canceling RSVP:', error);
                toast.error('Error canceling RSVP');
            }
        }
        
        // Expose to global scope for onclick handlers
        window.rsvpToEvent = rsvpToEvent;
        window.cancelRSVP = cancelRSVP;

        function renderEvents() {
            const eventsToRender = filteredEvents;
            const container = document.getElementById('events-list');
            if (events.length === 0) {
                container.innerHTML = '<p>No events scheduled.</p>';
                return;
            }

            container.innerHTML = events.map(event => {
                const eventDate = new Date(event.startTime);
                const currentUser = auth.getCurrentUser();
                const isRSVPd = currentUser && event.rsvps && event.rsvps.includes(currentUser.id);
                const rsvpCount = event.rsvps ? event.rsvps.length : 0;
                const maxAttendees = event.maxAttendees || 'Unlimited';
                const isOrganizer = currentUser && event.organizer === currentUser.id;

                const approvalStatus = event.approvalStatus || 'approved';
                const approvalBadge = approvalStatus === 'pending' 
                    ? '<span class="event-type" style="background: #78350f; color: #fbbf24; margin-left: 0.5rem;">Pending Approval</span>'
                    : approvalStatus === 'rejected'
                    ? '<span class="event-type" style="background: #7f1d1d; color: #f87171; margin-left: 0.5rem;">Rejected</span>'
                    : '';
                const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');

                return `
                    <div class="event-card">
                        <div class="event-header">
                            <div style="display: flex; align-items: start; gap: 0.75rem; flex: 1;">
                                ${isAdmin ? `
                                    <input type="checkbox" class="event-checkbox" data-event-id="${event.id}" onchange="updateBulkActionsToolbar()" style="margin-top: 0.25rem; cursor: pointer;">
                                ` : ''}
                                <div>
                                    <h2 class="event-title">${event.title}</h2>
                                <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
                                    <span class="event-type ${event.type}">${event.type}</span>
                                    ${approvalBadge}
                                </div>
                            </div>
                            ${isAdmin && approvalStatus === 'pending' ? `
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="approveEvent('${event.id}')">Approve</button>
                                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="rejectEvent('${event.id}')">Reject</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="event-details">
                            <p><strong>When:</strong> ${eventDate.toLocaleString()}</p>
                            <p><strong>Where:</strong> ${event.location}</p>
                            ${event.description ? `<p>${event.description}</p>` : ''}
                        </div>
                        <div class="rsvp-section">
                            <div class="rsvp-count">${rsvpCount} / ${maxAttendees} attending</div>
                            ${event.guests && event.guests.length > 0 ? `
                                <div style="margin: 0.5rem 0; font-size: 0.85rem; color: #888;">
                                    <strong>Guests:</strong> ${event.guests.map(g => g.name).join(', ')}
                                </div>
                            ` : ''}
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                                ${!isRSVPd 
                                    ? `<button class="btn btn-small" onclick="rsvpToEvent('${event.id}')">RSVP</button>`
                                    : `<button class="btn-secondary btn-small" onclick="cancelRSVP('${event.id}')">Cancel RSVP</button>`
                                }
                                ${(isOrganizer || isAdmin) ? `
                                    <button class="btn btn-small" style="background: #1e3a8a; color: #60a5fa;" onclick="showEditEventModal('${event.id}')">Edit</button>
                                    <button class="btn btn-small" style="background: #78350f; color: #fbbf24;" onclick="showManageGuestsModal('${event.id}')">Manage Guests</button>
                                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="deleteEvent('${event.id}')">Delete</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.view;
                
                if (currentView === 'calendar') {
                    document.getElementById('events-list').style.display = 'none';
                    document.getElementById('calendar-view').style.display = 'grid';
                    renderCalendar();
                } else {
                    document.getElementById('events-list').style.display = 'block';
                    document.getElementById('calendar-view').style.display = 'none';
                }
            });
        });

        function renderCalendar() {
            // Simple calendar implementation
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());

            const container = document.getElementById('calendar-view');
            container.innerHTML = '';

            // Day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const header = document.createElement('div');
                header.textContent = day;
                header.style.fontWeight = '600';
                header.style.textAlign = 'center';
                container.appendChild(header);
            });

            // Calendar days
            const currentDate = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                if (currentDate.getMonth() !== month) {
                    dayDiv.classList.add('other-month');
                }
                
                if (currentDate.toDateString() === now.toDateString()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<div class="calendar-day-number">${currentDate.getDate()}</div>`;
                
                // Add events for this day
                const dayEvents = filteredEvents.filter(e => {
                    const eventDate = new Date(e.startTime);
                    return eventDate.toDateString() === currentDate.toDateString();
                });

                dayEvents.forEach(event => {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'calendar-event';
                    eventDiv.textContent = event.title;
                    eventDiv.onclick = () => {
                        document.getElementById('events-list').style.display = 'block';
                        document.getElementById('calendar-view').style.display = 'none';
                        document.querySelectorAll('.tab-btn')[0].click();
                        document.getElementById('events-list').scrollIntoView();
                    };
                    dayDiv.appendChild(eventDiv);
                });

                container.appendChild(dayDiv);
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        let currentRejectEventId = null;
        let currentBulkEventAction = null;
        let currentBulkEventActionType = null;

        function showCreateEvent() {
            document.getElementById('create-event-modal').style.display = 'flex';
            document.getElementById('create-event-form').reset();
        }

        function closeCreateEventModal() {
            document.getElementById('create-event-modal').style.display = 'none';
        }
        
        let currentEditEventId = null;
        let currentManageGuestsEventId = null;

        async function showEditEventModal(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            
            currentEditEventId = eventId;
            document.getElementById('edit-event-title').value = event.title;
            document.getElementById('edit-event-description').value = event.description || '';
            document.getElementById('edit-event-location').value = event.location;
            
            // Convert ISO datetime to local datetime-local format
            const startDate = new Date(event.startTime);
            const endDate = new Date(event.endTime);
            document.getElementById('edit-event-start-time').value = startDate.toISOString().slice(0, 16);
            document.getElementById('edit-event-end-time').value = endDate.toISOString().slice(0, 16);
            
            document.getElementById('edit-event-type').value = event.type || 'meetup';
            document.getElementById('edit-event-max-attendees').value = event.maxAttendees || '';
            
            document.getElementById('edit-event-modal').style.display = 'flex';
        }

        function closeEditEventModal() {
            document.getElementById('edit-event-modal').style.display = 'none';
            currentEditEventId = null;
        }

        async function showManageGuestsModal(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            
            currentManageGuestsEventId = eventId;
            renderGuestsList(event.guests || []);
            document.getElementById('manage-guests-modal').style.display = 'flex';
        }

        function closeManageGuestsModal() {
            document.getElementById('manage-guests-modal').style.display = 'none';
            currentManageGuestsEventId = null;
            document.getElementById('add-guest-form').reset();
        }

        function renderGuestsList(guests) {
            const container = document.getElementById('guests-list');
            if (guests.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No guests invited yet.</p>';
                return;
            }
            
            container.innerHTML = `
                <h3 style="margin-bottom: 1rem;">Invited Guests (${guests.length})</h3>
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    ${guests.map(guest => `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: var(--bg-secondary); border-radius: 8px;">
                            <div>
                                <div style="font-weight: 600; color: var(--text-primary);">${guest.name}</div>
                                <div style="font-size: 0.85rem; color: var(--text-secondary);">${guest.email}</div>
                            </div>
                            <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="removeGuest('${guest.email}')">Remove</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function removeGuest(guestEmail) {
            if (!currentManageGuestsEventId) return;
            try {
                const response = await api.removeEventGuest(currentManageGuestsEventId, guestEmail);
                if (response.success) {
                    toast.success('Guest removed');
                    await loadEvents();
                    const event = events.find(e => e.id === currentManageGuestsEventId);
                    if (event) {
                        renderGuestsList(event.guests || []);
                    }
                } else {
                    toast.error('Failed to remove guest');
                }
            } catch (error) {
                console.error('Error removing guest:', error);
                toast.error('Error removing guest');
            }
        }

        async function deleteEvent(eventId) {
            if (!confirm('Are you sure you want to delete this event? All attendees and guests will be notified.')) {
                return;
            }
            try {
                const response = await api.deleteEvent(eventId);
                if (response.success) {
                    toast.success('Event deleted');
                    await loadEvents();
                } else {
                    toast.error('Failed to delete event');
                }
            } catch (error) {
                console.error('Error deleting event:', error);
                toast.error('Error deleting event');
            }
        }

        // Expose to global scope for onclick handlers
        window.showCreateEvent = showCreateEvent;
        window.closeCreateEventModal = closeCreateEventModal;
        window.showEditEventModal = showEditEventModal;
        window.closeEditEventModal = closeEditEventModal;
        window.showManageGuestsModal = showManageGuestsModal;
        window.closeManageGuestsModal = closeManageGuestsModal;
        window.removeGuest = removeGuest;
        window.deleteEvent = deleteEvent;

        async function createEvent(data) {
            try {
                const response = await api.post('/api/events', data);
                if (response.success) {
                    const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                    if (isAdmin) {
                        toast.success('Event created!');
                    } else {
                        toast.success('Event submitted for approval!');
                    }
                    await loadEvents();
                } else {
                    toast.error('Failed to create event: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating event:', error);
                toast.error('Error creating event');
            }
        }

        async function approveEvent(id) {
            try {
                const response = await api.approveEvent(id);
                if (response.success) {
                    toast.success('Event approved!');
                    await loadEvents();
                } else {
                    toast.error('Failed to approve event');
                }
            } catch (error) {
                console.error('Error approving event:', error);
                toast.error('Error approving event');
            }
        }

        function rejectEvent(id) {
            currentRejectEventId = id;
            document.getElementById('confirm-reject-event-modal').style.display = 'flex';
        }

        function closeConfirmRejectEventModal() {
            document.getElementById('confirm-reject-event-modal').style.display = 'none';
            currentRejectEventId = null;
        }

        async function confirmRejectEvent() {
            if (!currentRejectEventId) return;
            const id = currentRejectEventId;
            closeConfirmRejectEventModal();
            try {
                const response = await api.rejectEvent(id);
                if (response.success) {
                    toast.success('Event rejected');
                    await loadEvents();
                } else {
                    toast.error('Failed to reject event');
                }
            } catch (error) {
                console.error('Error rejecting event:', error);
                toast.error('Error rejecting event');
            }
        }

        // Expose to global scope for onclick handlers
        window.approveEvent = approveEvent;
        window.rejectEvent = rejectEvent;
        window.closeConfirmRejectEventModal = closeConfirmRejectEventModal;
        window.closeConfirmBulkEventModal = closeConfirmBulkEventModal;

        // Bulk operations
        function getSelectedEventIds() {
            return Array.from(document.querySelectorAll('.event-checkbox:checked')).map(cb => cb.dataset.eventId);
        }

        function updateBulkActionsToolbar() {
            const selected = getSelectedEventIds();
            const toolbar = document.getElementById('bulk-actions-toolbar');
            const countSpan = document.getElementById('selected-events-count');
            
            if (selected.length > 0) {
                toolbar.style.display = 'flex';
                countSpan.textContent = `${selected.length} event${selected.length !== 1 ? 's' : ''} selected`;
            } else {
                toolbar.style.display = 'none';
            }
        }

        function toggleSelectAllEvents() {
            const selectAll = document.getElementById('select-all-events');
            const checkboxes = document.querySelectorAll('.event-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateBulkActionsToolbar();
        }

        function clearEventSelection() {
            document.getElementById('select-all-events').checked = false;
            document.querySelectorAll('.event-checkbox').forEach(cb => cb.checked = false);
            updateBulkActionsToolbar();
        }

        function bulkApproveEvents() {
            const selected = getSelectedEventIds();
            if (selected.length === 0) {
                toast.error('Please select at least one event');
                return;
            }
            currentBulkEventAction = selected;
            currentBulkEventActionType = 'approve';
            document.getElementById('confirm-bulk-event-title').textContent = 'Confirm Approval';
            document.getElementById('confirm-bulk-event-message').textContent = `Approve ${selected.length} event${selected.length !== 1 ? 's' : ''}?`;
            const btn = document.getElementById('confirm-bulk-event-button');
            btn.textContent = 'Approve';
            btn.style.background = '#2d5016';
            btn.style.color = '#4ade80';
            document.getElementById('confirm-bulk-event-modal').style.display = 'flex';
        }

        function bulkRejectEvents() {
            const selected = getSelectedEventIds();
            if (selected.length === 0) {
                toast.error('Please select at least one event');
                return;
            }
            currentBulkEventAction = selected;
            currentBulkEventActionType = 'reject';
            document.getElementById('confirm-bulk-event-title').textContent = 'Confirm Rejection';
            document.getElementById('confirm-bulk-event-message').textContent = `Reject ${selected.length} event${selected.length !== 1 ? 's' : ''}?`;
            const btn = document.getElementById('confirm-bulk-event-button');
            btn.textContent = 'Reject';
            btn.style.background = '#7f1d1d';
            btn.style.color = '#f87171';
            document.getElementById('confirm-bulk-event-modal').style.display = 'flex';
        }

        function closeConfirmBulkEventModal() {
            document.getElementById('confirm-bulk-event-modal').style.display = 'none';
            currentBulkEventAction = null;
            currentBulkEventActionType = null;
        }

        async function executeBulkEventAction() {
            if (!currentBulkEventAction || !currentBulkEventActionType) return;
            const selected = currentBulkEventAction;
            const action = currentBulkEventActionType;
            closeConfirmBulkEventModal();
            try {
                const response = await api.bulkEvents(selected, action);
                if (response.success) {
                    toast.success(response.data.message || `${action === 'approve' ? 'Approved' : 'Rejected'} ${selected.length} event${selected.length !== 1 ? 's' : ''}`);
                    clearEventSelection();
                    await loadEvents();
                } else {
                    toast.error(response.error || `Failed to ${action} events`);
                }
            } catch (error) {
                console.error(`Error ${action}ing events:`, error);
                toast.error(`Error ${action}ing events`);
            }
        }

        window.updateBulkActionsToolbar = updateBulkActionsToolbar;
        window.toggleSelectAllEvents = toggleSelectAllEvents;
        window.clearEventSelection = clearEventSelection;
        window.bulkApproveEvents = bulkApproveEvents;
        window.bulkRejectEvents = bulkRejectEvents;

        // Create event form handler
        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('event-title').value;
            const description = document.getElementById('event-description').value;
            const location = document.getElementById('event-location').value;
            const startTime = document.getElementById('event-start-time').value;
            const endTime = document.getElementById('event-end-time').value;
            const type = document.getElementById('event-type').value || 'meetup';

            if (!title || !location || !startTime || !endTime) {
                toast.error('Title, location, start time, and end time are required');
                return;
            }

            closeCreateEventModal();
            await createEvent({ title, description, location, startTime, endTime, type });
        });

        document.getElementById('edit-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentEditEventId) return;
            try {
                const data = {
                    title: document.getElementById('edit-event-title').value,
                    description: document.getElementById('edit-event-description').value,
                    location: document.getElementById('edit-event-location').value,
                    startTime: new Date(document.getElementById('edit-event-start-time').value).toISOString(),
                    endTime: new Date(document.getElementById('edit-event-end-time').value).toISOString(),
                    type: document.getElementById('edit-event-type').value,
                    maxAttendees: document.getElementById('edit-event-max-attendees').value ? parseInt(document.getElementById('edit-event-max-attendees').value) : undefined
                };
                const response = await api.updateEvent(currentEditEventId, data);
                if (response.success) {
                    toast.success('Event updated! All attendees and guests have been notified.');
                    await loadEvents();
                    closeEditEventModal();
                } else {
                    toast.error('Failed to update event: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating event:', error);
                toast.error('Error updating event');
            }
        });

        document.getElementById('add-guest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentManageGuestsEventId) return;
            try {
                const guest = {
                    name: document.getElementById('guest-name').value,
                    email: document.getElementById('guest-email').value
                };
                const response = await api.addEventGuest(currentManageGuestsEventId, guest);
                if (response.success) {
                    toast.success('Guest added and invitation sent!');
                    document.getElementById('add-guest-form').reset();
                    await loadEvents();
                    const event = events.find(e => e.id === currentManageGuestsEventId);
                    if (event) {
                        renderGuestsList(event.guests || []);
                    }
                } else {
                    toast.error('Failed to add guest: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error adding guest:', error);
                toast.error('Error adding guest');
            }
        });

        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('events-content').style.display = 'block';
            await loadEvents();
            await loadSubscriptions();
        })();
    })();</script>
