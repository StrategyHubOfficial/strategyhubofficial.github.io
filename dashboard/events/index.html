---
layout: default
title: Events
styles: |
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .flatpickr-calendar {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
        }
        .flatpickr-months {
            background: var(--bg-darker) !important;
        }
        .flatpickr-month {
            color: var(--text-primary) !important;
        }
        .flatpickr-current-month {
            color: var(--text-primary) !important;
        }
        .flatpickr-month .flatpickr-current-month {
            color: var(--text-primary) !important;
        }
        .flatpickr-prev-month,
        .flatpickr-next-month {
            color: var(--text-primary) !important;
            fill: var(--text-primary) !important;
        }
        .flatpickr-prev-month:hover,
        .flatpickr-next-month:hover {
            color: var(--bitcoin-orange) !important;
            fill: var(--bitcoin-orange) !important;
        }
        .flatpickr-month .flatpickr-current-month select {
            background: var(--bg-darker) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
        }
        .flatpickr-month .flatpickr-current-month select option {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
        }
        .flatpickr-weekdays {
            background: var(--bg-darker) !important;
        }
        .flatpickr-weekday {
            color: var(--text-secondary) !important;
        }
        .flatpickr-day {
            color: var(--text-primary) !important;
        }
        .flatpickr-day:hover {
            background: rgba(247, 147, 26, 0.2) !important;
            border-color: var(--bitcoin-orange) !important;
        }
        .flatpickr-day.selected {
            background: var(--bitcoin-orange) !important;
            border-color: var(--bitcoin-orange) !important;
            color: var(--bg-darker) !important;
        }
        .flatpickr-day.today {
            border-color: var(--bitcoin-orange) !important;
        }
        .flatpickr-time {
            background: var(--bg-darker) !important;
            border-top: 1px solid var(--border-color) !important;
        }
        .flatpickr-time input {
            color: var(--text-primary) !important;
        }
        .flatpickr-time .flatpickr-time-separator {
            color: var(--text-primary) !important;
        }
    </style>
scripts: |
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
---

<style>
.events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .event-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .event-card:hover {
            border-color: #f7931a;
            transform: translateY(-2px);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .event-title {
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
        }
        .event-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #2d5016;
            color: #4ade80;
        }
        .event-type.workshop { background: #1e3a8a; color: #60a5fa; }
        .event-type.talk { background: #7c2d12; color: #fb923c; }
        .event-type.networking { background: #78350f; color: #fbbf24; }
        .event-details {
            color: #ccc;
            margin: 1rem 0;
        }
        .event-details strong {
            color: #f7931a;
        }
        .rsvp-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }
        .rsvp-count {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .calendar-view {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .calendar-day {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.5rem;
            min-height: 80px;
            font-size: 0.85rem;
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }
        .calendar-day.today {
            border-color: #f7931a;
        }
        .calendar-day-number {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .calendar-event {
            background: #f7931a;
            color: #000;
            padding: 0.25rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            cursor: pointer;
        }
        .subscriptions-panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .subscriptions-panel h3 {
            margin-top: 0;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
</style>

<div class="container">
        <div class="events-header">
            <h1>Events & Calendar</h1>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="subscriptionsDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notification Preferences">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="margin-right: 0.5rem;">
                            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.292-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.292c.415.764-.42 1.6-1.185 1.184l-.292-.159a1.873 1.873 0 0 0-2.692 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.693-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.292A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
                        </svg>
                        Notification Preferences
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="subscriptionsDropdown" style="min-width: 320px; padding: 1.5rem;">
                        <li>
                            <h6 class="dropdown-header" style="margin-bottom: 1rem;">Notification Preferences</h6>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <p style="margin-bottom: 1rem; font-size: 0.9rem;">Choose which event types you want to receive notifications for:</p>
                        </li>
                        <li style="padding: 0 0.5rem;">
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-meetup" value="meetup">
                                    <span>Meetups</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-workshop" value="workshop">
                                    <span>Workshops</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-talk" value="talk">
                                    <span>Talks</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="notify-networking" value="networking">
                                    <span>Networking</span>
                                </label>
                            </div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <label class="checkbox-item">
                                <input type="checkbox" id="notify-new">
                                <span>Notify me when new events are created</span>
                            </label>
                        </li>
                        <li style="padding: 0 0.5rem;">
                            <label class="checkbox-item">
                                <input type="checkbox" id="notify-reminder">
                                <span>Send reminders before events</span>
                            </label>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li style="padding: 0 0.5rem;">
                            <button class="btn btn-primary btn-sm w-100" onclick="saveSubscriptions()">Save Preferences</button>
                        </li>
                    </ul>
                </div>
                <button class="btn" onclick="showCreateEvent()">Create Event</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="skeleton skeleton-card" style="width: 100%; height: 180px; margin-bottom: 1rem;"></div>
            <div class="skeleton skeleton-card" style="width: 100%; height: 180px; margin-bottom: 1rem;"></div>
            <div class="skeleton skeleton-card" style="width: 100%; height: 180px;"></div>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="events-content" style="display: none;">
            <div class="tabs" style="margin-bottom: 2rem;">
                <button class="tab-btn active" data-view="list">List View</button>
                <button class="tab-btn" data-view="calendar">Calendar View</button>
            </div>

            <div id="events-list"></div>
            <div id="calendar-view" class="calendar-view" style="display: none;"></div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="create-event-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; align-items: center; justify-content: center; pointer-events: none;">
        <div class="modal-content" style="max-width: 600px; background: var(--bg-card); border-radius: 16px; padding: 2rem; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto; pointer-events: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0; color: var(--text-primary);">Create Event</h2>
                <button onclick="closeCreateEventModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <form id="create-event-form">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="event-title" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Title *</label>
                    <input type="text" id="event-title" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="event-description" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Description</label>
                    <textarea id="event-description" rows="4" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label for="event-start-time" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Start Time *</label>
                        <input type="datetime-local" id="event-start-time" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem;">
                    </div>
                    <div class="form-group">
                        <label for="event-end-time" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">End Time *</label>
                        <input type="datetime-local" id="event-end-time" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="form-group">
                        <label for="event-location" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Location *</label>
                        <input type="text" id="event-location" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem;">
                    </div>
                    <div class="form-group">
                        <label for="event-type" style="display: block; margin-bottom: 0.5rem; color: var(--text-primary); font-weight: 500;">Type *</label>
                        <select id="event-type" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary); font-size: 1rem;">
                            <option value="meetup">Meetup</option>
                            <option value="workshop">Workshop</option>
                            <option value="talk">Talk</option>
                            <option value="networking">Networking</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn" style="background: var(--bitcoin-orange); flex: 1;">Create Event</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCreateEventModal()" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }
        let events = [];
        let currentView = 'list';
        let subscriptions = null;

        async function loadEvents() {
            try {
                // Admins can see pending events, regular users only see approved
                const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                const url = isAdmin ? '/api/events?includePending=true' : '/api/events';
                const response = await api.get(url);
                if (response.success && response.data) {
                    // Handle paginated response structure: { data: [...], pagination: {...} }
                    if (Array.isArray(response.data)) {
                        events = response.data;
                    } else if (response.data.data && Array.isArray(response.data.data)) {
                        events = response.data.data;
                    } else {
                        console.warn('Unexpected events response structure:', response.data);
                        events = [];
                    }
                    renderEvents();
                } else {
                    toast.error('Failed to load events');
                    document.getElementById('error').textContent = 'Failed to load events';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading events:', error);
                toast.error('Error loading events');
                document.getElementById('error').textContent = 'Error loading events';
                document.getElementById('error').style.display = 'block';
            }
        }

        async function loadSubscriptions() {
            try {
                const response = await api.get('/api/subscriptions/events');
                if (response.success) {
                    subscriptions = response.data;
                    updateSubscriptionUI();
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
            }
        }

        function updateSubscriptionUI() {
            if (!subscriptions) return;
            
            document.getElementById('notify-meetup').checked = subscriptions.eventTypes.includes('meetup');
            document.getElementById('notify-workshop').checked = subscriptions.eventTypes.includes('workshop');
            document.getElementById('notify-talk').checked = subscriptions.eventTypes.includes('talk');
            document.getElementById('notify-networking').checked = subscriptions.eventTypes.includes('networking');
            document.getElementById('notify-new').checked = subscriptions.notifyOnNewEvent;
            document.getElementById('notify-reminder').checked = subscriptions.notifyBeforeEvent;
        }

        async function saveSubscriptions() {
            const eventTypes = [];
            if (document.getElementById('notify-meetup').checked) eventTypes.push('meetup');
            if (document.getElementById('notify-workshop').checked) eventTypes.push('workshop');
            if (document.getElementById('notify-talk').checked) eventTypes.push('talk');
            if (document.getElementById('notify-networking').checked) eventTypes.push('networking');

            try {
                const response = await api.put('/api/subscriptions/events', {
                    eventTypes,
                    notifyOnNewEvent: document.getElementById('notify-new').checked,
                    notifyBeforeEvent: document.getElementById('notify-reminder').checked
                });

                if (response.success) {
                    toast.success('Preferences saved!');
                    subscriptions = response.data;
                } else {
                    toast.error('Failed to save preferences');
                }
            } catch (error) {
                console.error('Error saving subscriptions:', error);
                toast.error('Error saving preferences');
            }
        }

        async function rsvpToEvent(eventId) {
            try {
                const response = await api.post(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP confirmed!');
                    await loadEvents();
                } else {
                    toast.error('Failed to RSVP: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error RSVPing:', error);
                toast.error('Error RSVPing to event');
            }
        }

        async function cancelRSVP(eventId) {
            try {
                const response = await api.delete(`/api/events/${eventId}/rsvp`);
                if (response.success) {
                    toast.success('RSVP cancelled');
                    await loadEvents();
                } else {
                    toast.error('Failed to cancel RSVP');
                }
            } catch (error) {
                console.error('Error canceling RSVP:', error);
                toast.error('Error canceling RSVP');
            }
        }
        
        // Expose to global scope for onclick handlers
        window.rsvpToEvent = rsvpToEvent;
        window.cancelRSVP = cancelRSVP;

        function renderEvents() {
            const container = document.getElementById('events-list');
            if (events.length === 0) {
                container.innerHTML = '<p>No events scheduled.</p>';
                return;
            }

            container.innerHTML = events.map(event => {
                const eventDate = new Date(event.startTime);
                const currentUser = auth.getCurrentUser();
                const isRSVPd = currentUser && event.rsvps && event.rsvps.includes(currentUser.id);
                const rsvpCount = event.rsvps ? event.rsvps.length : 0;
                const maxAttendees = event.maxAttendees || 'Unlimited';

                const approvalStatus = event.approvalStatus || 'approved';
                const approvalBadge = approvalStatus === 'pending' 
                    ? '<span class="event-type" style="background: #78350f; color: #fbbf24; margin-left: 0.5rem;">Pending Approval</span>'
                    : approvalStatus === 'rejected'
                    ? '<span class="event-type" style="background: #7f1d1d; color: #f87171; margin-left: 0.5rem;">Rejected</span>'
                    : '';
                const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');

                return `
                    <div class="event-card">
                        <div class="event-header">
                            <div>
                                <h2 class="event-title">${event.title}</h2>
                                <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
                                    <span class="event-type ${event.type}">${event.type}</span>
                                    ${approvalBadge}
                                </div>
                            </div>
                            ${isAdmin && approvalStatus === 'pending' ? `
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="approveEvent('${event.id}')">Approve</button>
                                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="rejectEvent('${event.id}')">Reject</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="event-details">
                            <p><strong>When:</strong> ${eventDate.toLocaleString()}</p>
                            <p><strong>Where:</strong> ${event.location}</p>
                            ${event.description ? `<p>${event.description}</p>` : ''}
                        </div>
                        <div class="rsvp-section">
                            <div class="rsvp-count">${rsvpCount} / ${maxAttendees} attending</div>
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                                ${!isRSVPd 
                                    ? `<button class="btn btn-small" onclick="rsvpToEvent('${event.id}')">RSVP</button>`
                                    : `<button class="btn-secondary btn-small" onclick="cancelRSVP('${event.id}')">Cancel RSVP</button>`
                                }
                                <button class="btn-secondary btn-small" onclick="downloadEventICS('${event.id}')" title="Add to Calendar">
                                    📅 Add to Calendar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.view;
                
                if (currentView === 'calendar') {
                    document.getElementById('events-list').style.display = 'none';
                    document.getElementById('calendar-view').style.display = 'grid';
                    renderCalendar();
                } else {
                    document.getElementById('events-list').style.display = 'block';
                    document.getElementById('calendar-view').style.display = 'none';
                }
            });
        });

        function renderCalendar() {
            // Simple calendar implementation
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());

            const container = document.getElementById('calendar-view');
            container.innerHTML = '';

            // Day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const header = document.createElement('div');
                header.textContent = day;
                header.style.fontWeight = '600';
                header.style.textAlign = 'center';
                container.appendChild(header);
            });

            // Calendar days
            const currentDate = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                if (currentDate.getMonth() !== month) {
                    dayDiv.classList.add('other-month');
                }
                
                if (currentDate.toDateString() === now.toDateString()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `<div class="calendar-day-number">${currentDate.getDate()}</div>`;
                
                // Add events for this day
                const dayEvents = events.filter(e => {
                    const eventDate = new Date(e.startTime);
                    return eventDate.toDateString() === currentDate.toDateString();
                });

                dayEvents.forEach(event => {
                    const eventDiv = document.createElement('div');
                    eventDiv.className = 'calendar-event';
                    eventDiv.textContent = event.title;
                    eventDiv.onclick = () => {
                        document.getElementById('events-list').style.display = 'block';
                        document.getElementById('calendar-view').style.display = 'none';
                        document.querySelectorAll('.tab-btn')[0].click();
                        document.getElementById('events-list').scrollIntoView();
                    };
                    dayDiv.appendChild(eventDiv);
                });

                container.appendChild(dayDiv);
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        function showCreateEvent() {
            const modal = document.getElementById('create-event-modal');
            if (modal) {
                modal.style.display = 'flex';
                document.getElementById('create-event-form').reset();
                
                // Initialize datetime pickers when modal opens
                setTimeout(() => {
                    initEventDateTimePickers();
                }, 100);
            }
        }

        // Initialize datetime pickers for event creation
        function initEventDateTimePickers() {
            if (typeof flatpickr !== 'undefined') {
                // Check if pickers already exist and destroy them first
                const startTimeInput = document.getElementById('event-start-time');
                const endTimeInput = document.getElementById('event-end-time');
                
                if (startTimeInput._flatpickr) {
                    startTimeInput._flatpickr.destroy();
                }
                if (endTimeInput._flatpickr) {
                    endTimeInput._flatpickr.destroy();
                }

                // Initialize Flatpickr for start time
                flatpickr('#event-start-time', {
                    enableTime: true,
                    dateFormat: 'Y-m-d\\TH:i',
                    time_24hr: true,
                    minDate: 'today',
                    allowInput: true, // Allow manual input
                    clickOpens: true,
                    minuteIncrement: 15
                });

                // Initialize Flatpickr for end time
                flatpickr('#event-end-time', {
                    enableTime: true,
                    dateFormat: 'Y-m-d\\TH:i',
                    time_24hr: true,
                    minDate: 'today',
                    allowInput: true, // Allow manual input
                    clickOpens: true,
                    minuteIncrement: 15
                });
            }
        }

        function closeCreateEventModal() {
            const modal = document.getElementById('create-event-modal');
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        // Download ICS file for event
        async function downloadEventICS(eventId) {
            try {
                const token = auth.getToken();
                if (!token) {
                    toast.error('Please log in to download calendar file');
                    return;
                }

                const baseURL = (typeof api !== 'undefined' ? api.baseURL : null) || window.HUB_CONFIG?.apiBaseUrl || 'https://dashboard.securesovereigns.workers.dev';
                const response = await fetch(`${baseURL}/api/events/${eventId}/ics`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        toast.error('Authentication required. Please log in again.');
                        window.location.href = '/dashboard/login.html';
                        return;
                    }
                    throw new Error(`Failed to download: ${response.status}`);
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `event-${eventId}.ics`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (error) {
                console.error('Error downloading ICS:', error);
                toast.error('Failed to download calendar file');
            }
        }

        // Expose to global scope for onclick handlers
        window.showCreateEvent = showCreateEvent;
        window.closeCreateEventModal = closeCreateEventModal;
        window.downloadEventICS = downloadEventICS;

        async function createEvent(data) {
            try {
                const response = await api.post('/api/events', data);
                if (response.success) {
                    const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                    if (isAdmin) {
                        toast.success('Event created!');
                    } else {
                        toast.success('Event submitted for approval!');
                    }
                    closeCreateEventModal();
                    await loadEvents();
                } else {
                    toast.error('Failed to create event: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating event:', error);
                toast.error('Error creating event');
            }
        }

        // Handle create event form submission
        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('event-title').value.trim();
            const description = document.getElementById('event-description').value.trim();
            const location = document.getElementById('event-location').value.trim();
            const startTime = document.getElementById('event-start-time').value;
            const endTime = document.getElementById('event-end-time').value;
            const type = document.getElementById('event-type').value;

            if (!title || !location || !startTime || !endTime) {
                toast.error('Please fill in all required fields');
                return;
            }

            await createEvent({ title, description, location, startTime, endTime, type });
        });

        // Close modal on outside click
        document.getElementById('create-event-modal').addEventListener('click', (e) => {
            if (e.target.id === 'create-event-modal') {
                closeCreateEventModal();
            }
        });

        async function approveEvent(id) {
            try {
                const response = await api.approveEvent(id);
                if (response.success) {
                    toast.success('Event approved!');
                    await loadEvents();
                } else {
                    toast.error('Failed to approve event');
                }
            } catch (error) {
                console.error('Error approving event:', error);
                toast.error('Error approving event');
            }
        }

        async function rejectEvent(id) {
            if (!confirm('Are you sure you want to reject this event?')) {
                return;
            }
            try {
                const response = await api.rejectEvent(id);
                if (response.success) {
                    toast.success('Event rejected');
                    await loadEvents();
                } else {
                    toast.error('Failed to reject event');
                }
            } catch (error) {
                console.error('Error rejecting event:', error);
                toast.error('Error rejecting event');
            }
        }

        // Expose to global scope for onclick handlers
        window.approveEvent = approveEvent;
        window.rejectEvent = rejectEvent;


        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('events-content').style.display = 'block';
            await loadEvents();
            await loadSubscriptions();
        })();
    })();</script>
