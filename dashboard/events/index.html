---
layout: default
title: Events
---

<style>
.events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .event-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .event-card:hover {
            border-color: #f7931a;
            transform: translateY(-2px);
        }
        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .event-title {
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
        }
        .event-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #2d5016;
            color: #4ade80;
        }
        .event-type.workshop { background: #1e3a8a; color: #60a5fa; }
        .event-type.talk { background: #7c2d12; color: #fb923c; }
        .event-type.networking { background: #78350f; color: #fbbf24; }
        .event-details {
            color: #ccc;
            margin: 1rem 0;
        }
        .event-details strong {
            color: #f7931a;
        }
        .rsvp-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #333;
        }
        .rsvp-count {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .calendar-view {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            margin-top: 2rem;
        }
        .calendar-day {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.5rem;
            min-height: 80px;
            font-size: 0.85rem;
        }
        .calendar-day.other-month {
            opacity: 0.3;
        }
        .calendar-day.today {
            border-color: #f7931a;
        }
        .calendar-day-number {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .calendar-event {
            background: #f7931a;
            color: #000;
            padding: 0.25rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            cursor: pointer;
        }
        .subscriptions-panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .subscriptions-panel h3 {
            margin-top: 0;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
        }
</style>

<div class="container">
        <div class="events-header">
            <h1>Events & Calendar</h1>
            <button class="btn" onclick="showCreateEvent()">Create Event</button>
        </div>

        <div id="subscriptions-panel" class="subscriptions-panel">
            <h3>Notification Preferences</h3>
            <p style="color: #888; margin-bottom: 1rem;">Choose which event types you want to receive notifications for:</p>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-meetup" value="meetup">
                    <span>Meetups</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-workshop" value="workshop">
                    <span>Workshops</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-talk" value="talk">
                    <span>Talks</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-networking" value="networking">
                    <span>Networking</span>
                </label>
            </div>
            <div style="margin-top: 1rem;">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-new">
                    <span>Notify me when new events are created</span>
                </label>
            </div>
            <div style="margin-top: 1rem;">
                <label class="checkbox-item">
                    <input type="checkbox" id="notify-reminder">
                    <span>Send reminders before events</span>
                </label>
            </div>
            <button class="btn btn-small" onclick="saveSubscriptions()" style="margin-top: 1rem;">Save Preferences</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading events...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="events-content" style="display: none;">
            <div class="tabs" style="margin-bottom: 2rem;">
                <button class="tab-btn active" data-view="list">List View</button>
                <button class="tab-btn" data-view="calendar">Calendar View</button>
            </div>

            <div id="events-list"></div>
            <div id="calendar-view" class="calendar-view" style="display: none;"></div>
        </div>
    </div>
