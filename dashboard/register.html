<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StrategyHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/dashboard/assets/css/main.css">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-dark);
        }
        .register-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }
        .register-card h1 {
            color: var(--bitcoin-orange);
            margin-bottom: 0.5rem;
        }
        .register-card .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.875rem;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--bitcoin-orange);
            box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .skills-input {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .skill-tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .skill-tag button {
            background: none;
            border: none;
            color: var(--bitcoin-orange);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            line-height: 1;
        }
        .socials-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .help-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }
        .error-message {
            background: rgba(214, 48, 49, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .success-message {
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <h1>Complete Your Registration</h1>
            <p class="subtitle">Fill out your profile to join StrategyHub</p>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <form id="register-form">
                <input type="hidden" id="invite-token" name="token">
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" readonly style="opacity: 0.6; cursor: not-allowed;">
                    <div class="help-text">This email was used for your invitation</div>
                </div>

                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required minlength="8">
                    <div class="help-text">Must be at least 8 characters</div>
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirm Password *</label>
                    <input type="password" id="password-confirm" name="password-confirm" required>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="website">Website</label>
                        <input type="url" id="website" name="website" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" name="company" placeholder="Your company name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Social Links</label>
                    <div class="socials-group">
                        <div>
                            <label for="twitter" style="font-size: 0.9rem; margin-bottom: 0.25rem;">Twitter/X</label>
                            <input type="text" id="twitter" name="twitter" placeholder="@username">
                        </div>
                        <div>
                            <label for="github" style="font-size: 0.9rem; margin-bottom: 0.25rem;">GitHub</label>
                            <input type="text" id="github" name="github" placeholder="username">
                        </div>
                        <div>
                            <label for="linkedin" style="font-size: 0.9rem; margin-bottom: 0.25rem;">LinkedIn</label>
                            <input type="text" id="linkedin" name="linkedin" placeholder="username">
                        </div>
                        <div>
                            <label for="nostr" style="font-size: 0.9rem; margin-bottom: 0.25rem;">Nostr</label>
                            <input type="text" id="nostr" name="nostr" placeholder="npub...">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="skills">Skills</label>
                    <input type="text" id="skill-input" placeholder="Type a skill and press Enter">
                    <div class="skills-input" id="skills-container"></div>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Complete Registration</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/dashboard/assets/js/config.js"></script>
    <script src="/dashboard/assets/js/api.js"></script>
    <script src="/dashboard/assets/js/toast.js"></script>
    <script>
        const api = new HubAPI();
        let currentSkills = [];
        let inviteData = null;

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('error-message').textContent = 'No invite token provided. Please use the invite link from your email.';
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
        } else {
            document.getElementById('invite-token').value = token;
            verifyInvite(token);
        }

        async function verifyInvite(token) {
            try {
                const response = await fetch(`https://dashboard.securesovereigns.workers.dev/api/invites/verify/${token}`);
                const data = await response.json();

                if (data.success) {
                    inviteData = data.data;
                    document.getElementById('email').value = data.data.email;
                    
                    // Pre-fill data if available
                    if (data.data.prefillData) {
                        if (data.data.prefillData.name) {
                            document.getElementById('name').value = data.data.prefillData.name;
                        }
                        if (data.data.prefillData.website) {
                            document.getElementById('website').value = data.data.prefillData.website;
                        }
                        if (data.data.prefillData.company) {
                            document.getElementById('company').value = data.data.prefillData.company;
                        }
                    }
                } else {
                    showError(data.error || 'Invalid or expired invite');
                    document.getElementById('register-form').style.display = 'none';
                }
            } catch (error) {
                console.error('Error verifying invite:', error);
                showError('Error verifying invite. Please try again.');
                document.getElementById('register-form').style.display = 'none';
            }
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-message').style.display = 'block';
        }

        function showSuccess(message) {
            document.getElementById('success-message').textContent = message;
            document.getElementById('success-message').style.display = 'block';
        }

        function renderSkills() {
            const container = document.getElementById('skills-container');
            container.innerHTML = currentSkills.map(skill => `
                <span class="skill-tag">
                    ${skill}
                    <button type="button" onclick="removeSkill('${skill}')" aria-label="Remove skill">×</button>
                </span>
            `).join('');
        }

        window.removeSkill = function(skill) {
            currentSkills = currentSkills.filter(s => s !== skill);
            renderSkills();
        };

        // Add skill on Enter
        document.getElementById('skill-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const skill = e.target.value.trim();
                if (skill && !currentSkills.includes(skill)) {
                    currentSkills.push(skill);
                    renderSkills();
                    e.target.value = '';
                }
            }
        });

        // Form submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            if (password !== passwordConfirm) {
                showError('Passwords do not match');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            const formData = {
                token: document.getElementById('invite-token').value,
                password: password,
                name: document.getElementById('name').value.trim(),
                bio: document.getElementById('bio').value.trim(),
                website: document.getElementById('website').value.trim(),
                company: document.getElementById('company').value.trim(),
                socials: {
                    twitter: document.getElementById('twitter').value.trim(),
                    github: document.getElementById('github').value.trim(),
                    linkedin: document.getElementById('linkedin').value.trim(),
                    nostr: document.getElementById('nostr').value.trim()
                },
                skills: currentSkills,
                visibility: {
                    email: 'members',
                    bio: 'members',
                    skills: 'members',
                    website: 'members',
                    company: 'members',
                    socials: 'members'
                }
            };

            // Remove empty social fields
            Object.keys(formData.socials).forEach(key => {
                if (!formData.socials[key]) {
                    delete formData.socials[key];
                }
            });

            try {
                const response = await fetch('https://dashboard.securesovereigns.workers.dev/api/invites/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('Registration successful! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/dashboard/login.html?registered=true';
                    }, 2000);
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (error) {
                console.error('Error registering:', error);
                showError('Error completing registration. Please try again.');
            }
        });
    </script>
</body>
</html>
