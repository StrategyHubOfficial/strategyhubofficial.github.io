---
layout: default
title: Equipment
---

<style>
.equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .equipment-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .equipment-card:hover {
            border-color: #f7931a;
            transform: translateY(-4px);
        }
        .equipment-card h3 {
            margin: 0 0 0.5rem 0;
            color: #fff;
        }
        .equipment-card .category {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .equipment-card .status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .status.available { background: #2d5016; color: #4ade80; }
        .status.checked-out { background: #7c2d12; color: #fb923c; }
        .status.online { background: #1e3a8a; color: #60a5fa; }
        .status.offline { background: #7f1d1d; color: #f87171; }
        .status.maintenance { background: #78350f; color: #fbbf24; }
        .equipment-info {
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #ccc;
        }
        .equipment-info strong {
            color: #f7931a;
        }
        .equipment-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .checkout-modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .selected-items {
            margin: 1rem 0;
            padding: 1rem;
            background: #0a0a0a;
            border-radius: 8px;
        }
        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: #111;
            border-radius: 4px;
        }
        .remove-item {
            background: #7f1d1d;
            color: #f87171;
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }
</style>

<div class="container">
        <h1>Equipment & Infrastructure</h1>
        
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading equipment...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="equipment-content" style="display: none;">
            <div class="tabs" style="margin-bottom: 2rem;">
                <button class="tab-btn active" data-tab="all">All Equipment</button>
                <button class="tab-btn" data-tab="borrowable">Borrowable</button>
                <button class="tab-btn" data-tab="servers">Servers</button>
                <button class="tab-btn" data-tab="infrastructure">Infrastructure</button>
            </div>

            <div id="equipment-grid" class="equipment-grid"></div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="checkout-modal">
        <div class="modal-content">
            <h2>Request Equipment</h2>
            <div id="selected-items" class="selected-items">
                <p>No items selected</p>
            </div>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Checkout Date:</label>
                    <input type="datetime-local" id="checkout-date" required>
                </div>
                <div class="form-group">
                    <label>Return Date:</label>
                    <input type="datetime-local" id="return-date" required>
                </div>
                <div class="form-group">
                    <label>Notes (optional):</label>
                    <textarea id="checkout-notes" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn">Request Equipment</button>
                    <button type="button" class="btn-secondary" onclick="closeCheckoutModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
