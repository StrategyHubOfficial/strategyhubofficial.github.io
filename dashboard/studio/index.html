---
layout: default
title: Studio Booking
styles: |
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .flatpickr-calendar {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
        }
        .flatpickr-months {
            background: var(--bg-darker) !important;
            color: var(--text-primary) !important;
        }
        .flatpickr-weekdays {
            background: var(--bg-darker) !important;
        }
        .flatpickr-weekday {
            color: var(--text-secondary) !important;
        }
        .flatpickr-day {
            color: var(--text-primary) !important;
        }
        .flatpickr-day:hover {
            background: rgba(247, 147, 26, 0.2) !important;
            border-color: var(--bitcoin-orange) !important;
        }
        .flatpickr-day.selected {
            background: var(--bitcoin-orange) !important;
            border-color: var(--bitcoin-orange) !important;
            color: var(--bg-darker) !important;
        }
        .flatpickr-day.today {
            border-color: var(--bitcoin-orange) !important;
        }
        .flatpickr-time {
            background: var(--bg-darker) !important;
            border-top: 1px solid var(--border-color) !important;
        }
        .flatpickr-time input {
            color: var(--text-primary) !important;
            -webkit-text-fill-color: var(--text-primary) !important;
        }
        .flatpickr-time .flatpickr-time-separator {
            color: var(--text-primary) !important;
        }
        .flatpickr-time .numInputWrapper {
            background: var(--bg-darker) !important;
            border-radius: 4px;
        }
        .flatpickr-time .numInputWrapper:hover {

        }
        .flatpickr-time input.flatpickr-hour,
        .flatpickr-time input.flatpickr-minute,

            background: transparent !important;

        .flatpickr-time input:hover,

            background: transparent !important;

        }

            background: rgba(247, 147, 26, 0.28) !important;
        }
        .flatpickr-time .numInputWrapper span.arrowUp:after {
            border-bottom-color: var(--text-secondary) !important;
        }
        .flatpickr-time .numInputWrapper span.arrowDown:after {
            border-top-color: var(--text-secondary) !important;
        }
    </style>
scripts: |
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
---

<style>
.booking-form {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            margin: 2rem 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #fff;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f7931a;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .bookings-list {
            margin-top: 2rem;
        }
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }
        @media (max-width: 768px) {
            .bookings-grid {
                grid-template-columns: 1fr;
            }
        }
        .booking-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .booking-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.confirmed { background: #2d5016; color: #4ade80; }
        .status.pending { background: #78350f; color: #fbbf24; }
        .status.cancelled { background: #7f1d1d; color: #f87171; }
        .technical-assistance-badge {
            display: inline-block;
            background: #1e3a8a;
            color: #60a5fa;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        /* Native multi-select: explicit colors so options aren’t invisible on dark backgrounds */
        #equipment {
            width: 100%;
            min-height: 9rem;
            padding: 0.5rem;
            color: var(--text-primary);
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        #equipment option {
            color: var(--text-primary);
            background: var(--bg-card);
            padding: 0.35rem 0.5rem;
        }
</style>

<div class="container">
        <h1>Studio Booking</h1>
        
        <div class="booking-form">
            <h2>Book Studio Time</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label>Start Time:</label>
                    <input type="datetime-local" id="start-time" required>
                </div>
                <div class="form-group">
                    <label>End Time:</label>
                    <input type="datetime-local" id="end-time" required>
                </div>
                <div class="form-group">
                    <label>Equipment needed (optional):</label>
                    <small style="display: block; color: var(--text-secondary, #888); margin-bottom: 0.5rem;">Hold Ctrl/Cmd (or long-press on mobile) to select multiple.</small>
                    <select id="equipment" multiple size="5" aria-label="Equipment needed">
                        <option value="podtrak-p4">Podtrak P4 (audio recording)</option>
                        <option value="sony-a6400">Sony a6400 Camera (video recording)</option>
                        <option value="teleprompter">Teleprompter</option>
                        <option value="live-broadcast">Live Broadcast / Remote Meeting Setup</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="technical-assistance">
                        <span>I need technical assistance (10,000 sats/hour)</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>Notes (optional):</label>
                    <textarea id="notes" rows="3" placeholder="Any additional information..."></textarea>
                </div>
                <button type="submit" class="btn">Book Studio</button>
            </form>
        </div>

        <div class="bookings-list">
            <h2>My Bookings</h2>
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading bookings...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
            <div class="bookings-grid">
                <div>
                    <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Studio Bookings</h3>
                    <div id="bookings-container"></div>
                </div>
                <div>
                    <h3 style="margin-bottom: 1rem; color: var(--text-primary);">Event RSVPs</h3>
                    <div id="events-container"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    (async function initStudioBookingPage() {
        let depAttempts = 0;
        while ((typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') && depAttempts < 120) {
            await new Promise((r) => setTimeout(r, 50));
            depAttempts++;
        }
        if (typeof auth === 'undefined' || typeof api === 'undefined') {
            console.error('Studio booking: auth/api not loaded');
            return;
        }
        let editingBookingId = null;
        
        async function loadBookings() {
            try {
                const response = await api.get('/api/studio/bookings');
                if (response.success) {
                    const bookings = Array.isArray(response.data) ? response.data : (response.data?.all || response.data?.data || []);
                    renderBookings(bookings);
                } else {
                    toast.error('Failed to load bookings');
                    document.getElementById('error').textContent = 'Failed to load bookings';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                toast.error('Error loading bookings');
                document.getElementById('error').textContent = 'Error loading bookings';
                document.getElementById('error').style.display = 'block';
            }
        }

        /** Studio booking equipment options (stored by id on the booking; labels for display). */
        const STUDIO_BOOKING_EQUIPMENT = [
            { id: 'podtrak-p4', label: 'Podtrak P4 (audio recording)' },
            { id: 'sony-a6400', label: 'Sony a6400 Camera (video recording)' },
            { id: 'teleprompter', label: 'Teleprompter' },
            { id: 'live-broadcast', label: 'Live Broadcast / Remote Meeting Setup' }
        ];

        const studioEquipmentLabelById = Object.fromEntries(
            STUDIO_BOOKING_EQUIPMENT.map((e) => [e.id, e.label])
        );

        function formatBookingEquipment(ids) {
            if (!ids || !ids.length) return '';
            return ids.map((id) => studioEquipmentLabelById[id] || id).join(', ');
        }

        function loadEquipment() {
            const select = document.getElementById('equipment');
            if (!select) return;
            select.innerHTML = '';
            STUDIO_BOOKING_EQUIPMENT.forEach(({ id, label }) => {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = label;
                select.appendChild(option);
            });
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookings-container');
            if (bookings.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No studio bookings found.</p>';
                return;
            }

            container.innerHTML = bookings.map(booking => {
                const start = new Date(booking.startTime);
                const end = new Date(booking.endTime);
                const statusClass = booking.status;

                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>${start.toLocaleString()} - ${end.toLocaleString()}</h3>
                                ${booking.needsTechnicalAssistance 
                                    ? '<span class="technical-assistance-badge">Technical Assistance Requested</span>'
                                    : ''
                                }
                            </div>
                            <span class="booking-status status ${statusClass}">${booking.status}</span>
                        </div>
                        ${booking.equipment && booking.equipment.length > 0 
                            ? `<p><strong>Equipment:</strong> ${formatBookingEquipment(booking.equipment)}</p>`
                            : ''
                        }
                        ${booking.notes ? `<p>${booking.notes}</p>` : ''}
                        <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="btn btn-small" onclick="editBooking('${booking.id}')" style="background: var(--bitcoin-orange);">Edit</button>
                            <button class="btn-secondary btn-small" onclick="cancelBooking('${booking.id}')">Cancel</button>
                            <button class="btn-secondary btn-small" onclick="downloadBookingICS('${booking.id}')" title="Add to Calendar">
                                📅 Add to Calendar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadEvents() {
            try {
                const response = await api.get('/api/events');
                if (response.success && response.data) {
                    const currentUser = auth.getCurrentUser();
                    if (!currentUser) return;
                    
                    // Handle both array and object with data property
                    let events = [];
                    if (Array.isArray(response.data)) {
                        events = response.data;
                    } else if (response.data.data && Array.isArray(response.data.data)) {
                        events = response.data.data;
                    } else {
                        console.warn('Unexpected events response structure:', response.data);
                        events = [];
                    }
                    
                    // Filter to only events the user has RSVP'd to
                    const rsvpEvents = events.filter(event => 
                        event.rsvps && event.rsvps.includes(currentUser.id) && 
                        new Date(event.startTime) > new Date()
                    );
                    
                    renderEvents(rsvpEvents);
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('events-container');
            if (events.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No upcoming event RSVPs.</p>';
                return;
            }

            container.innerHTML = events.map(event => {
                const eventDate = new Date(event.startTime);
                const endDate = event.endTime ? new Date(event.endTime) : null;

                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>${event.title}</h3>
                            </div>
                            <span class="booking-status status confirmed">RSVP'd</span>
                        </div>
                        <p><strong>Date:</strong> ${eventDate.toLocaleString()}${endDate ? ` - ${endDate.toLocaleString()}` : ''}</p>
                        ${event.location ? `<p><strong>Location:</strong> ${event.location}</p>` : ''}
                        ${event.description ? `<p style="color: var(--text-secondary); margin-top: 0.5rem;">${event.description.substring(0, 100)}${event.description.length > 100 ? '...' : ''}</p>` : ''}
                        <div style="margin-top: 1rem;">
                            <a href="/dashboard/events#${event.id}" class="btn-secondary btn-small" style="text-decoration: none; display: inline-block;">View Event</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this booking?')) {
                return;
            }
            
            try {
                const response = await api.delete(`/api/studio/bookings/${id}`);
                if (response.success) {
                    toast.success('Booking cancelled successfully');
                    await loadBookings();
                } else {
                    toast.error('Failed to cancel booking');
                }
            } catch (error) {
                console.error('Error canceling booking:', error);
                toast.error('Error canceling booking');
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const equipment = Array.from(document.getElementById('equipment').selectedOptions).map(o => o.value).filter(v => v);
            const needsTechnicalAssistance = document.getElementById('technical-assistance').checked;
            const notes = document.getElementById('notes').value;

            try {
                if (editingBookingId) {
                    // Update existing booking
                    const response = await api.put(`/api/studio/bookings/${editingBookingId}`, {
                        startTime: new Date(startTime).toISOString(),
                        endTime: new Date(endTime).toISOString(),
                        equipment,
                        needsTechnicalAssistance,
                        notes
                    });

                    if (response.success) {
                        toast.success('Booking updated successfully!');
                        document.getElementById('booking-form').reset();
                        editingBookingId = null;
                        const submitBtn = document.querySelector('#booking-form button[type="submit"]');
                        if (submitBtn) {
                            submitBtn.textContent = 'Book Studio';
                        }
                        await loadBookings();
                    } else {
                        if (response.error === 'CONFLICT' || response.error?.includes('already booked') || response.error?.includes('Time slot')) {
                            toast.error('This time slot is already booked. Please choose a different time.');
                        } else {
                            toast.error('Failed to update booking: ' + (response.error || 'Unknown error'));
                        }
                    }
                } else {
                    // Create new booking
                    const response = await api.post('/api/studio/bookings', {
                        startTime: new Date(startTime).toISOString(),
                        endTime: new Date(endTime).toISOString(),
                        equipment,
                        needsTechnicalAssistance,
                        notes
                    });

                    if (response.success) {
                        toast.success('Studio booked successfully!');
                        document.getElementById('booking-form').reset();
                        await loadBookings();
                    } else {
                        // Check for conflict error
                        if (response.error === 'CONFLICT' || response.error?.includes('already booked') || response.error?.includes('Time slot')) {
                            toast.error('This time slot is already booked. Please choose a different time.');
                        } else {
                            const errorMsg = 'Failed to book studio: ' + (response.error || 'Unknown error');
                            toast.error(errorMsg);
                        }
                    }
                }
            } catch (error) {
                console.error('Error booking studio:', error);
                toast.error('Error booking studio');
            }
        });

        // Initialize datetime pickers
        function initDateTimePickers() {
            if (typeof flatpickr !== 'undefined') {
                // Initialize Flatpickr for start time
                flatpickr('#start-time', {
                    enableTime: true,
                    dateFormat: 'Y-m-d\\TH:i',
                    time_24hr: true,
                    minDate: 'today',
                    allowInput: true, // Allow manual input
                    clickOpens: true,
                    minuteIncrement: 15
                });

                // Initialize Flatpickr for end time
                flatpickr('#end-time', {
                    enableTime: true,
                    dateFormat: 'Y-m-d\\TH:i',
                    time_24hr: true,
                    minDate: 'today',
                    allowInput: true, // Allow manual input
                    clickOpens: true,
                    minuteIncrement: 15
                });
            }
        }

        // Initialize: fill equipment first (sync), then auth — don’t block the list on slow booking/event APIs
        (async () => {
            loadEquipment();
            const ok = await auth.requireAuth();
            if (!ok) return;
            document.getElementById('loading').style.display = 'none';
            await loadBookings();
            await loadEvents();

            setTimeout(() => {
                initDateTimePickers();
            }, 100);
        })();
    })();
</script>
