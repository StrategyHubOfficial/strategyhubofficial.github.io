---
layout: default
title: Studio Booking
---

<style>
.booking-form {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            margin: 2rem 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #fff;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f7931a;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .bookings-list {
            margin-top: 2rem;
        }
        .booking-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .booking-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.confirmed { background: #2d5016; color: #4ade80; }
        .status.pending { background: #78350f; color: #fbbf24; }
        .status.cancelled { background: #7f1d1d; color: #f87171; }
        .technical-assistance-badge {
            display: inline-block;
            background: #1e3a8a;
            color: #60a5fa;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
</style>

<div class="container">
        <h1>Studio Booking</h1>
        
        <div class="booking-form">
            <h2>Book Studio Time</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label>Start Time:</label>
                    <input type="datetime-local" id="start-time" required>
                </div>
                <div class="form-group">
                    <label>End Time:</label>
                    <input type="datetime-local" id="end-time" required>
                </div>
                <div class="form-group">
                    <label>Equipment Needed (optional):</label>
                    <select id="equipment" multiple>
                        <option value="">Select equipment...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="technical-assistance">
                        <span>I need technical assistance</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>Notes (optional):</label>
                    <textarea id="notes" rows="3" placeholder="Any additional information..."></textarea>
                </div>
                <button type="submit" class="btn">Book Studio</button>
            </form>
        </div>

        <div class="bookings-list">
            <h2>My Bookings</h2>
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading bookings...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
            <div id="bookings-container"></div>
        </div>
    </div>
