            border-radius: 12px;
            padding: 2rem;

            margin-bottom: 1.5rem;

        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;

                grid-template-columns: 1fr;

        .booking-card {

            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .booking-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.confirmed { background: #2d5016; color: #4ade80; }
        .status.pending { background: #78350f; color: #fbbf24; }
        .status.cancelled { background: #7f1d1d; color: #f87171; }

            background: #1e3a8a;

            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        /* Native multi-select: explicit colors so options aren’t invisible on dark backgrounds */
        #equipment {
            width: 100%;
            min-height: 9rem;
            padding: 0.5rem;
            color: var(--text-primary);
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

            color: var(--text-primary);
            background: var(--bg-card);
            padding: 0.35rem 0.5rem;
        }

            <form id="booking-form">

                    <label>Start Time:</label>
                    <input type="datetime-local" id="start-time" required>
                </div>
                <div class="form-group">

                    <input type="datetime-local" id="end-time" required>
                </div>
                <div class="form-group">
                    <label>Equipment needed (optional):</label>

                    <select id="equipment" multiple size="5" aria-label="Equipment needed"></select>
                </div>

                <div>

<script>
    (async function initStudioBookingPage() {
        let depAttempts = 0;
        while ((typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') && depAttempts < 120) {
            await new Promise((r) => setTimeout(r, 50));
            depAttempts++;
        }
        if (typeof auth === 'undefined' || typeof api === 'undefined') {
            console.error('Studio booking: auth/api not loaded');
            return;
        }
        let editingBookingId = null;
        let fpStart = null;
        let fpEnd = null;

        /**
         * Flatpickr uses "Y-m-d H:i" (space); datetime-local uses "T". Parse as local wall time, then ISO for API.
         */
        function parseLocalDateTimeToISO(raw) {
            if (raw === null || raw === undefined) {return null;}
            const trimmed = String(raw).trim();
            if (!trimmed) return null;
            const normalized = trimmed.includes('T') ? trimmed : trimmed.replace(/^(\d{4}-\d{2}-\d{2})\s+/, '$1T');
            const m = /^(\d{4})-(\d{2})-(\d{2})T(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(normalized);
            if (m) {
                const y = parseInt(m[1], 10);
                const mo = parseInt(m[2], 10) - 1;
                const d = parseInt(m[3], 10);
                const h = parseInt(m[4], 10);
                const mi = parseInt(m[5], 10);
                const sec = m[6] !== null && m[6] !== undefined ? parseInt(m[6], 10) : 0;
                const localDate = new Date(y, mo, d, h, mi, sec, 0);
                if (isNaN(localDate.getTime())) return null;
                return localDate.toISOString();
            }
            const fallback = new Date(trimmed);
            return isNaN(fallback.getTime()) ? null : fallback.toISOString();
        }

        async function assertSlotAvailable(startIso, endIso) {
            const params = new URLSearchParams({ start: startIso, end: endIso });
            const response = await api.get(`/api/studio/availability?${params.toString()}`);
            if (!response.success) {
                toast.error(response.error || 'Could not check studio availability.');
                return false;
            }
            if (response.data && response.data.available === false) {
                toast.error('That time overlaps another booking. Pick a different slot.');
                return false;
            }
            return true;
        }

        async function loadBookings() {
            try {
                const response = await api.get('/api/studio/bookings');
                if (response.success) {
                    const bookings = Array.isArray(response.data) ? response.data : (response.data?.all || response.data?.data || []);
                    renderBookings(bookings);
                } else {
                    toast.error('Failed to load bookings');
                    document.getElementById('error').textContent = 'Failed to load bookings';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                toast.error('Error loading bookings');
                document.getElementById('error').textContent = 'Error loading bookings';
                document.getElementById('error').style.display = 'block';
            }
        }

        /** id → display name from last /api/equipment load (for booking cards). */
        let equipmentById = {};

        function formatBookingEquipment(ids) {
            if (!ids || !ids.length) return '';
            return ids.map((id) => equipmentById[id] || id).join(', ');
        }

        async function loadEquipment() {
            const select = document.getElementById('equipment');
            const hint = document.getElementById('equipment-catalog-hint');
            if (!select) return;

            select.innerHTML = '';
            equipmentById = {};
            if (hint) {
                hint.style.display = 'none';
                hint.textContent = '';
            }

            try {
                const response = await api.get('/api/equipment');
                if (!response.success || !response.data) {
                    if (hint) {
                        hint.textContent = 'Could not load the equipment catalog. Try refreshing the page.';
                        hint.style.display = 'block';
                    }
                    return;
                }

                const equipment = response.data.all || response.data || [];
                if (!Array.isArray(equipment)) {
                    console.error('Equipment data is not an array:', equipment);
                    return;
                }

                equipment.forEach((item) => {
                    if (item && item.id) {
                        equipmentById[item.id] = item.name || item.id;
                    }
                });

                const studioDefaults = equipment.filter(
                    (item) => item.studioParent && (item.studioParent === 'default' || item.studioParent === 'studio')
                );
                const optionalEquipment = equipment.filter((item) => {
                    const cat = (item.category || '').toLowerCase();
                    return (item.type === 'borrowable' || cat === 'studio') && !item.studioParent;
                });

                if (studioDefaults.length > 0) {
                    const defaultGroup = document.createElement('optgroup');
                    defaultGroup.label = 'Included with studio (auto; shown for reference)';
                    studioDefaults.forEach((item) => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = `✓ ${item.name}`;
                        option.disabled = true;
                        defaultGroup.appendChild(option);
                    });
                    select.appendChild(defaultGroup);
                }

                if (optionalEquipment.length > 0) {
                    const optionalGroup = document.createElement('optgroup');
                    optionalGroup.label = 'Additional equipment (optional)';
                    optionalEquipment.forEach((item) => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = item.name;
                        optionalGroup.appendChild(option);
                    });
                    select.appendChild(optionalGroup);
                }

                const hasSelectable = optionalEquipment.length > 0;
                const hasDefaultsOnly = studioDefaults.length > 0 && !hasSelectable;
                if (!hasSelectable && !hasDefaultsOnly && equipment.length === 0) {
                    if (hint) {
                        hint.textContent =
                            'The equipment catalog is empty. Add items under Resources → Equipment (use type “borrowable” or category “Studio”, and optionally mark studio defaults).';
                        hint.style.display = 'block';
                    }
                } else if (!hasSelectable && hasDefaultsOnly) {
                    if (hint) {
                        hint.textContent =
                            'Only default studio gear is configured. Add optional borrowable or Studio-category items in Resources → Equipment to let members request extras.';
                        hint.style.display = 'block';
                    }
                } else if (!hasSelectable && equipment.length > 0) {
                    if (hint) {
                        hint.textContent =
                            'No optional studio equipment matches the filter (borrowable or category Studio, not marked as studio default). Adjust items in Resources → Equipment.';
                        hint.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading equipment:', error);
                if (hint) {
                    hint.textContent = 'Could not load the equipment catalog. Try refreshing the page.';
                    hint.style.display = 'block';
                }
            }
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookings-container');
            if (bookings.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No studio bookings found.</p>';
                return;
            }

            container.innerHTML = bookings.map(booking => {
                const start = new Date(booking.startTime);
                const end = new Date(booking.endTime);
                const statusClass = booking.status;

                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>${start.toLocaleString()} - ${end.toLocaleString()}</h3>
                                ${booking.needsTechnicalAssistance 
                                    ? '<span class="technical-assistance-badge">Technical Assistance Requested</span>'
                                    : ''
                                }
                            </div>
                            <span class="booking-status status ${statusClass}">${booking.status}</span>
                        </div>
                        ${booking.equipment && booking.equipment.length > 0 
                            ? `<p><strong>Equipment:</strong> ${formatBookingEquipment(booking.equipment)}</p>`
                            : ''
                        }
                        ${booking.notes ? `<p>${booking.notes}</p>` : ''}
                        <div style="margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="btn btn-small" onclick="editBooking('${booking.id}')" style="background: var(--bitcoin-orange);">Edit</button>
                            <button class="btn-secondary btn-small" onclick="cancelBooking('${booking.id}')">Cancel</button>
                            <button class="btn-secondary btn-small" onclick="downloadBookingICS('${booking.id}')" title="Add to Calendar">
                                📅 Add to Calendar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadEvents() {
            try {
                const response = await api.get('/api/events');
                if (response.success && response.data) {
                    const currentUser = auth.getCurrentUser();
                    if (!currentUser) return;
                    
                    // Handle both array and object with data property
                    let events = [];
                    if (Array.isArray(response.data)) {
                        events = response.data;
                    } else if (response.data.data && Array.isArray(response.data.data)) {
                        events = response.data.data;
                    } else {
                        console.warn('Unexpected events response structure:', response.data);
                        events = [];
                    }
                    
                    // Filter to only events the user has RSVP'd to
                    const rsvpEvents = events.filter(event => 
                        event.rsvps && event.rsvps.includes(currentUser.id) && 
                        new Date(event.startTime) > new Date()
                    );
                    
                    renderEvents(rsvpEvents);
                }
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('events-container');
            if (events.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No upcoming event RSVPs.</p>';
                return;
            }

            const esc = typeof window.escapeHtml === 'function' ? window.escapeHtml : (t) => String(t ?? '');
            const escAttr = typeof window.escapeAttr === 'function' ? window.escapeAttr : (t) => String(t ?? '');
            container.innerHTML = events.map(event => {
                const eventDate = new Date(event.startTime);
                const endDate = event.endTime ? new Date(event.endTime) : null;
                const eid = escAttr(event.id);
                const desc = event.description
                    ? esc(event.description.substring(0, 100)) + (event.description.length > 100 ? '...' : '')
                    : '';

                return `
                    <div class="booking-card">
                        <div class="booking-header">
                            <div>
                                <h3>${esc(event.title)}</h3>
                            </div>
                            <span class="booking-status status confirmed">RSVP'd</span>
                        </div>
                        <p><strong>Date:</strong> ${eventDate.toLocaleString()}${endDate ? ` - ${endDate.toLocaleString()}` : ''}</p>
                        ${event.location ? `<p><strong>Location:</strong> ${esc(event.location)}</p>` : ''}
                        ${desc ? `<p style="color: var(--text-secondary); margin-top: 0.5rem;">${desc}</p>` : ''}
                        <div style="margin-top: 1rem;">
                            <a href="/dashboard/events#${eid}" class="btn-secondary btn-small" style="text-decoration: none; display: inline-block;">View Event</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this booking?')) {
                return;
            }
            
            try {
                const response = await api.delete(`/api/studio/bookings/${id}`);
                if (response.success) {
                    toast.success('Booking cancelled successfully');
                    await loadBookings();
                } else {
                    toast.error('Failed to cancel booking');
                }
            } catch (error) {
                console.error('Error canceling booking:', error);
                toast.error('Error canceling booking');
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const startRaw = document.getElementById('start-time').value;
            const endRaw = document.getElementById('end-time').value;
            const startIso = parseLocalDateTimeToISO(startRaw);
            const endIso = parseLocalDateTimeToISO(endRaw);
            if (!startIso || !endIso) {
                toast.error('Invalid start or end date/time. Use the calendar picker or enter a valid date and time.');
                return;
            }
            if (new Date(startIso).getTime() >= new Date(endIso).getTime()) {
                toast.error('Start time must be before end time.');
                return;
            }

            const equipment = Array.from(document.getElementById('equipment').selectedOptions).map(o => o.value).filter(v => v);
            const needsTechnicalAssistance = document.getElementById('technical-assistance').checked;
            const notes = document.getElementById('notes').value;

            try {
                // Only for new bookings: availability counts every overlap, including this user’s
                // current booking when editing, so skip the pre-check on update (server excludes id).
                if (!editingBookingId) {
                    const slotOk = await assertSlotAvailable(startIso, endIso);
                    if (!slotOk) return;
                }

                if (editingBookingId) {
                    // Update existing booking (server excludes this id from overlap check)
                    const response = await api.put(`/api/studio/bookings/${editingBookingId}`, {
                        startTime: startIso,
                        endTime: endIso,
                        equipment,
                        needsTechnicalAssistance,
                        notes
                    });

                    if (response.success) {
                        toast.success('Booking updated successfully!');
                        document.getElementById('booking-form').reset();
                        editingBookingId = null;
                        const submitBtn = document.querySelector('#booking-form button[type="submit"]');
                        if (submitBtn) {
                            submitBtn.textContent = 'Book Studio';
                        }
                        await loadBookings();
                    } else {
                        if (response.error === 'CONFLICT' || response.error?.includes('already booked') || response.error?.includes('Time slot')) {
                            toast.error('This time slot is already booked. Please choose a different time.');
                        } else {
                            toast.error('Failed to update booking: ' + (response.error || 'Unknown error'));
                        }
                    }
                } else {
                    const response = await api.post('/api/studio/bookings', {
                        startTime: startIso,
                        endTime: endIso,
                        equipment,
                        needsTechnicalAssistance,
                        notes
                    });

                    if (response.success) {
                        toast.success('Studio booked successfully!');
                        document.getElementById('booking-form').reset();
                        await loadBookings();
                    } else {
                        // Check for conflict error
                        if (response.error === 'CONFLICT' || response.error?.includes('already booked') || response.error?.includes('Time slot')) {
                            toast.error('This time slot is already booked. Please choose a different time.');
                        } else {
                            const errorMsg = 'Failed to book studio: ' + (response.error || 'Unknown error');
                            toast.error(errorMsg);
                        }
                    }
                }
            } catch (error) {
                console.error('Error booking studio:', error);
                toast.error('Error booking studio');
            }
        });

        /**
         * Keep end time at or after start: minDate and default end when end is empty or invalid vs start.
         * @param {Date} start
         */
        function applyStartToEndConstraints(start) {
            if (!fpEnd || !start || isNaN(start.getTime())) return;
            fpEnd.set('minDate', start);
            const endSel = fpEnd.selectedDates[0];
            const endIso = parseLocalDateTimeToISO(document.getElementById('end-time').value);
            const endFromInput = endIso ? new Date(endIso) : null;
            let endEffective = endSel;
            if (!endEffective && endFromInput && !isNaN(endFromInput.getTime())) {
                endEffective = endFromInput;
            }
            const endEmpty = !endEffective || isNaN(endEffective.getTime());
            const endBeforeOrAtStart = !endEmpty && endEffective.getTime() <= start.getTime();
            if (endEmpty || endBeforeOrAtStart) {
                fpEnd.setDate(new Date(start.getTime() + 60 * 60 * 1000), false);
            }
        }

        function initDateTimePickers() {
            if (typeof flatpickr === 'undefined') return;

            fpStart = flatpickr('#start-time', {
                enableTime: true,
                dateFormat: 'Y-m-d H:i',
                time_24hr: true,
                minDate: 'today',
                allowInput: true,
                clickOpens: true,
                minuteIncrement: 15,
                onChange(selectedDates) {
                    if (!fpEnd || !selectedDates[0]) return;
                    applyStartToEndConstraints(selectedDates[0]);
                }
            });

            const startInput = document.getElementById('start-time');
            startInput.addEventListener('blur', () => {
                if (!fpEnd) return;
                const startIso = parseLocalDateTimeToISO(startInput.value);
                if (!startIso) return;
                const start = new Date(startIso);
                applyStartToEndConstraints(start);
            });

            fpEnd = flatpickr('#end-time', {
                enableTime: true,
                dateFormat: 'Y-m-d H:i',
                time_24hr: true,
                minDate: 'today',
                allowInput: true,
                clickOpens: true,
                minuteIncrement: 15,
                onReady() {
                    const s = fpStart && fpStart.selectedDates[0];
                    if (s) fpEnd.set('minDate', s);
                }
            });
        }

        (async () => {
            const ok = await auth.requireAuth();
            if (!ok) return;
            await loadEquipment();
            document.getElementById('loading').style.display = 'none';
            await Promise.all([loadBookings(), loadEvents()]);

            setTimeout(() => {
                initDateTimePickers();
            }, 100);
        })();
    })();
</script>
