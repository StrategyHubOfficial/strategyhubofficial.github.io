---
layout: default
title: Projects
---

<style>
.projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }
        .project-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .project-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .project-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.idea { background: #1e3a8a; color: #60a5fa; }
        .status.active { background: #2d5016; color: #4ade80; }
        .status.completed { background: #78350f; color: #fbbf24; }
        .status.archived { background: #7f1d1d; color: #f87171; }
        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .project-team {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .search-bar {
            position: relative;
            width: 100%;
        }
        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: var(--transition);
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--bitcoin-orange);
            box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.1);
        }
        .search-bar::before {
            content: '🔍';
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .team-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-member {
            display: inline-block;
            color: var(--bitcoin-orange);
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .project-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .create-project-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .create-project-modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
</style>

<div class="container">
        <div class="projects-header">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <h1>Projects</h1>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="select-all-projects" onchange="toggleSelectAllProjects()">
                    <span style="font-size: 0.9rem;">Select All</span>
                </label>
            </div>
            <button class="btn" onclick="showCreateProject()">Create Project</button>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <div class="search-bar" style="max-width: 500px;">
                <input type="text" id="search-input" placeholder="Search projects by name, description, tags, or skills...">
            </div>
        </div>

        <div class="filters" style="margin-bottom: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button class="btn btn-primary filter-btn active" data-filter="all">All Projects</button>
            <button class="btn btn-secondary filter-btn" data-filter="idea">Ideas</button>
            <button class="btn btn-secondary filter-btn" data-filter="active">Active</button>
            <button class="btn btn-secondary filter-btn" data-filter="completed">Completed</button>
            <button class="btn btn-secondary filter-btn" data-filter="archived">Archived</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading projects...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="projects-content" style="display: none;">
            <!-- Bulk Actions Toolbar -->
            <div id="bulk-actions-toolbar" style="display: none; margin-bottom: 1rem; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <span id="selected-count" style="color: var(--text-primary); font-weight: 600;"></span>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="bulkApproveProjects()">Approve Selected</button>
                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="bulkRejectProjects()">Reject Selected</button>
                    <button class="btn btn-secondary btn-small" onclick="clearSelection()">Clear Selection</button>
                </div>
            </div>
            <div id="projects-list"></div>
            <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: var(--text-secondary);">
                <p>No projects found.</p>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Create New Project</h2>
                <button onclick="closeCreateProject()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <form id="create-project-form">
                <div class="form-group">
                    <label>Project Name:</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="project-description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="project-status" required>
                        <option value="idea">Idea</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>GitHub Repository (optional):</label>
                    <input type="text" id="project-github" placeholder="owner/repo">
                </div>
                <div class="form-group">
                    <label>Tags (comma-separated):</label>
                    <input type="text" id="project-tags" placeholder="bitcoin, infrastructure, tooling">
                </div>
                <div class="form-group">
                    <label>Skills Needed (comma-separated):</label>
                    <input type="text" id="project-skills-needed" placeholder="rust, lightning, ui/ux, typescript">
                </div>
                <div class="form-group">
                    <label>Visibility:</label>
                    <select id="project-visibility" required>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="project-looking-for-collaboration">
                        <span>Looking for collaboration</span>
                    </label>
                </div>
                <div class="form-group" id="collaboration-note-group" style="display: none;">
                    <label>Collaboration Note (optional):</label>
                    <textarea id="project-collaboration-note" rows="3" placeholder="What kind of collaboration are you looking for?"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="project-show-in-portfolio">
                        <span>Show my project in the hub portfolio</span>
                    </label>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn">Create Project</button>
                    <button type="button" class="btn-secondary" onclick="closeCreateProject()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Project Details Modal -->
    <div id="view-project-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="view-project-title">Project Details</h2>
                <button onclick="closeViewProjectModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <div id="view-project-content"></div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn-secondary" onclick="closeViewProjectModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Confirm Rejection Modal -->
    <div id="confirm-reject-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Confirm Rejection</h2>
                <button onclick="closeConfirmRejectModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <p id="confirm-reject-message">Are you sure you want to reject this project?</p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #7f1d1d; color: #f87171;" onclick="confirmRejectProject()">Reject</button>
                <button type="button" class="btn-secondary" onclick="closeConfirmRejectModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Confirm Bulk Action Modal -->
    <div id="confirm-bulk-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="confirm-bulk-title">Confirm Action</h2>
                <button onclick="closeConfirmBulkModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <p id="confirm-bulk-message"></p>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" id="confirm-bulk-button" onclick="executeBulkAction()">Confirm</button>
                <button type="button" class="btn-secondary" onclick="closeConfirmBulkModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Donation Modal -->
    <div id="donation-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="donation-modal-title">Donate to Project</h2>
                <button onclick="closeDonationModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <form id="donation-form">
                <div class="form-group">
                    <label>Amount (sats) *</label>
                    <input type="number" id="donation-amount" min="1" required>
                </div>
                <div class="form-group">
                    <label>Your Name (optional, for supporter badge)</label>
                    <input type="text" id="donation-name" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label>Your Email (optional, for supporter badge)</label>
                    <input type="email" id="donation-email" placeholder="your@email.com">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn" style="background: var(--bitcoin-orange);">Donate</button>
                    <button type="button" class="btn-secondary" onclick="closeDonationModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lightning Invoice Modal -->
    <div id="invoice-modal" class="create-project-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Lightning Invoice</h2>
                <button onclick="closeInvoiceModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Invoice:</label>
                <textarea id="invoice-text" readonly style="width: 100%; padding: 0.75rem; background: var(--bg-darker); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: monospace; font-size: 0.9rem; min-height: 100px; resize: vertical;"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" onclick="copyInvoice()">Copy to Clipboard</button>
                <button type="button" class="btn-secondary" onclick="closeInvoiceModal()">Close</button>
            </div>
        </div>
    </div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }
        let allProjects = [];
        let filteredProjects = [];
        let currentFilter = 'all';

        async function loadProjects() {
            try {
                // Admins can see pending projects, regular users only see approved
                const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                const url = isAdmin ? '/api/projects?includePending=true' : '/api/projects';
                const response = await api.get(url);
                if (response.success) {
                    allProjects = response.data || [];
                    applyFilters();
                } else {
                    toast.error('Failed to load projects');
                    document.getElementById('error').textContent = 'Failed to load projects';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                toast.error('Error loading projects');
                document.getElementById('error').textContent = 'Error loading projects';
                document.getElementById('error').style.display = 'block';
            }
        }

        async function applyFilters() {
            // If search query exists, use search endpoint
            if (searchQuery.trim()) {
                try {
                    const response = await api.get(`/api/projects/search?q=${encodeURIComponent(searchQuery.trim())}`);
                    if (response.success) {
                        filteredProjects = (response.data?.data || []).filter(project => {
                            if (currentFilter !== 'all' && project.status !== currentFilter) {
                                return false;
                            }
                            return true;
                        });
                    } else {
                        filteredProjects = [];
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    filteredProjects = [];
                }
            } else {
                // Use local filtering
                filteredProjects = allProjects.filter(project => {
                    if (currentFilter !== 'all' && project.status !== currentFilter) {
                        return false;
                    }
                    return true;
                });
            }

            renderProjects();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            const noResults = document.getElementById('no-results');

            if (filteredProjects.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = filteredProjects.map(project => {
                const statusClass = project.status || 'idea';
                const tags = project.tags || [];
                const teamMembers = project.teamMembers || [];

                const approvalStatus = project.approvalStatus || 'approved';
                const approvalBadge = approvalStatus === 'pending' 
                    ? '<span class="project-status status pending" style="background: #78350f; color: #fbbf24; margin-left: 0.5rem;">Pending Approval</span>'
                    : approvalStatus === 'rejected'
                    ? '<span class="project-status status rejected" style="background: #7f1d1d; color: #f87171; margin-left: 0.5rem;">Rejected</span>'
                    : '';

                return `
                    <div class="project-card" id="project-${project.id}">
                        <div class="project-header">
                            <div style="display: flex; align-items: start; gap: 0.75rem; flex: 1;">
                                ${isAdmin() ? `
                                    <input type="checkbox" class="project-checkbox" data-project-id="${project.id}" onchange="updateBulkActionsToolbar()" style="margin-top: 0.25rem; cursor: pointer;">
                                ` : ''}
                                <div>
                                    <div class="project-title">${project.name}</div>
                                <span class="project-status status ${statusClass}">${statusClass}</span>
                                ${approvalBadge}
                            </div>
                            ${isAdmin() && approvalStatus === 'pending' ? `
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="approveProject('${project.id}')">Approve</button>
                                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="rejectProject('${project.id}')">Reject</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="project-description">${project.description || 'No description'}</div>
                        <div class="project-meta">
                            ${project.githubRepo ? `
                                <div class="project-meta-item">
                                    <span>🔗</span>
                                    <a href="https://github.com/${project.githubRepo}" target="_blank" style="color: var(--bitcoin-orange);">${project.githubRepo}</a>
                                </div>
                            ` : ''}
                            <div class="project-meta-item">
                                <span>👁️</span>
                                <span>${project.visibility || 'public'}</span>
                            </div>
                            <div class="project-meta-item">
                                <span>👥</span>
                                <span>${teamMembers.length} team member${teamMembers.length !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                        ${tags.length > 0 ? `
                            <div class="project-tags">
                                ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${teamMembers.length > 0 ? `
                            <div class="project-team">
                                <div class="team-title">Team Members</div>
                                ${teamMembers.map(memberId => 
                                    `<a href="/dashboard/members#${memberId}" class="team-member">Member ${memberId.substring(0, 8)}...</a>`
                                ).join('')}
                            </div>
                        ` : ''}
                        <div class="project-actions">
                            <button class="btn btn-small" onclick="viewProject('${project.id}')">View Details</button>
                            <button class="btn btn-small" onclick="donateToProject('${project.id}', '${project.name}')" style="background: var(--bitcoin-orange);">Donate</button>
                            ${isAdmin() ? `<button class="btn-secondary btn-small" onclick="editProject('${project.id}')">Edit</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function isAdmin() {
            const user = auth.getCurrentUser();
            return user && user.role === 'admin';
        }

        function showCreateProject() {
            document.getElementById('create-project-modal').classList.add('active');
        }
        
        // Expose to global scope for onclick handlers
        window.showCreateProject = showCreateProject;

        function closeCreateProject() {
            document.getElementById('create-project-modal').classList.remove('active');
            document.getElementById('create-project-form').reset();
        }

        let currentRejectProjectId = null;
        let currentBulkAction = null;
        let currentBulkActionType = null;
        let currentDonationProjectId = null;
        let currentDonationProjectName = null;

        async function viewProject(id) {
            try {
                const response = await api.get(`/api/projects/${id}`);
                if (response.success) {
                    const project = response.data;
                    document.getElementById('view-project-title').textContent = project.name;
                    const content = document.getElementById('view-project-content');
                    content.innerHTML = `
                        <div style="margin-bottom: 1rem;">
                            <strong style="color: var(--text-primary);">Description:</strong>
                            <p style="color: var(--text-secondary); margin-top: 0.5rem;">${project.description || 'No description'}</p>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <strong style="color: var(--text-primary);">Status:</strong>
                            <span class="project-status status ${project.status || 'idea'}" style="margin-left: 0.5rem;">${project.status || 'idea'}</span>
                        </div>
                        <div style="margin-bottom: 1rem;">
                            <strong style="color: var(--text-primary);">Team Members:</strong>
                            <span style="color: var(--text-secondary); margin-left: 0.5rem;">${(project.teamMembers || []).length} member${(project.teamMembers || []).length !== 1 ? 's' : ''}</span>
                        </div>
                        ${project.githubRepo ? `
                            <div style="margin-bottom: 1rem;">
                                <strong style="color: var(--text-primary);">GitHub:</strong>
                                <a href="https://github.com/${project.githubRepo}" target="_blank" style="color: var(--bitcoin-orange); margin-left: 0.5rem;">${project.githubRepo}</a>
                            </div>
                        ` : ''}
                        ${(project.tags || []).length > 0 ? `
                            <div style="margin-bottom: 1rem;">
                                <strong style="color: var(--text-primary);">Tags:</strong>
                                <div style="margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem;">
                                    ${(project.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                    `;
                    document.getElementById('view-project-modal').classList.add('active');
                } else {
                    toast.error('Failed to load project details');
                }
            } catch (error) {
                console.error('Error loading project:', error);
                toast.error('Error loading project');
            }
        }

        function closeViewProjectModal() {
            document.getElementById('view-project-modal').classList.remove('active');
        }
        
        function editProject(id) {
            toast.info('Edit functionality coming soon');
        }
        
        async function approveProject(id) {
            try {
                const response = await api.approveProject(id);
                if (response.success) {
                    toast.success('Project approved!');
                    await loadProjects();
                } else {
                    toast.error('Failed to approve project');
                }
            } catch (error) {
                console.error('Error approving project:', error);
                toast.error('Error approving project');
            }
        }

        function rejectProject(id) {
            currentRejectProjectId = id;
            document.getElementById('confirm-reject-modal').classList.add('active');
        }

        function closeConfirmRejectModal() {
            document.getElementById('confirm-reject-modal').classList.remove('active');
            currentRejectProjectId = null;
        }

        async function confirmRejectProject() {
            if (!currentRejectProjectId) return;
            const id = currentRejectProjectId;
            closeConfirmRejectModal();
            try {
                const response = await api.rejectProject(id);
                if (response.success) {
                    toast.success('Project rejected');
                    await loadProjects();
                } else {
                    toast.error('Failed to reject project');
                }
            } catch (error) {
                console.error('Error rejecting project:', error);
                toast.error('Error rejecting project');
            }
        }

        // Expose to global scope for onclick handlers
        window.viewProject = viewProject;
        window.editProject = editProject;
        window.donateToProject = donateToProject;
        window.approveProject = approveProject;
        window.rejectProject = rejectProject;
        window.closeViewProjectModal = closeViewProjectModal;
        window.closeConfirmRejectModal = closeConfirmRejectModal;
        window.closeConfirmBulkModal = closeConfirmBulkModal;
        window.closeDonationModal = closeDonationModal;
        window.closeInvoiceModal = closeInvoiceModal;
        window.copyInvoice = copyInvoice;

        // Bulk operations
        function getSelectedProjectIds() {
            return Array.from(document.querySelectorAll('.project-checkbox:checked')).map(cb => cb.dataset.projectId);
        }

        function updateBulkActionsToolbar() {
            const selected = getSelectedProjectIds();
            const toolbar = document.getElementById('bulk-actions-toolbar');
            const countSpan = document.getElementById('selected-count');
            
            if (selected.length > 0) {
                toolbar.style.display = 'flex';
                countSpan.textContent = `${selected.length} project${selected.length !== 1 ? 's' : ''} selected`;
            } else {
                toolbar.style.display = 'none';
            }
        }

        function toggleSelectAllProjects() {
            const selectAll = document.getElementById('select-all-projects');
            const checkboxes = document.querySelectorAll('.project-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateBulkActionsToolbar();
        }

        function clearSelection() {
            document.getElementById('select-all-projects').checked = false;
            document.querySelectorAll('.project-checkbox').forEach(cb => cb.checked = false);
            updateBulkActionsToolbar();
        }

        function bulkApproveProjects() {
            const selected = getSelectedProjectIds();
            if (selected.length === 0) {
                toast.error('Please select at least one project');
                return;
            }
            currentBulkAction = selected;
            currentBulkActionType = 'approve';
            document.getElementById('confirm-bulk-title').textContent = 'Confirm Approval';
            document.getElementById('confirm-bulk-message').textContent = `Approve ${selected.length} project${selected.length !== 1 ? 's' : ''}?`;
            const btn = document.getElementById('confirm-bulk-button');
            btn.textContent = 'Approve';
            btn.style.background = '#2d5016';
            btn.style.color = '#4ade80';
            document.getElementById('confirm-bulk-modal').classList.add('active');
        }

        function bulkRejectProjects() {
            const selected = getSelectedProjectIds();
            if (selected.length === 0) {
                toast.error('Please select at least one project');
                return;
            }
            currentBulkAction = selected;
            currentBulkActionType = 'reject';
            document.getElementById('confirm-bulk-title').textContent = 'Confirm Rejection';
            document.getElementById('confirm-bulk-message').textContent = `Reject ${selected.length} project${selected.length !== 1 ? 's' : ''}?`;
            const btn = document.getElementById('confirm-bulk-button');
            btn.textContent = 'Reject';
            btn.style.background = '#7f1d1d';
            btn.style.color = '#f87171';
            document.getElementById('confirm-bulk-modal').classList.add('active');
        }

        function closeConfirmBulkModal() {
            document.getElementById('confirm-bulk-modal').classList.remove('active');
            currentBulkAction = null;
            currentBulkActionType = null;
        }

        async function executeBulkAction() {
            if (!currentBulkAction || !currentBulkActionType) return;
            const selected = currentBulkAction;
            const action = currentBulkActionType;
            closeConfirmBulkModal();
            try {
                const response = await api.bulkProjects(selected, action);
                if (response.success) {
                    toast.success(response.data.message || `${action === 'approve' ? 'Approved' : 'Rejected'} ${selected.length} project${selected.length !== 1 ? 's' : ''}`);
                    clearSelection();
                    await loadProjects();
                } else {
                    toast.error(response.error || `Failed to ${action} projects`);
                }
            } catch (error) {
                console.error(`Error ${action}ing projects:`, error);
                toast.error(`Error ${action}ing projects`);
            }
        }

        window.updateBulkActionsToolbar = updateBulkActionsToolbar;
        window.toggleSelectAllProjects = toggleSelectAllProjects;
        window.clearSelection = clearSelection;
        window.bulkApproveProjects = bulkApproveProjects;
        window.bulkRejectProjects = bulkRejectProjects;

        document.getElementById('create-project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;
            const status = document.getElementById('project-status').value;
            const githubRepo = document.getElementById('project-github').value;
            const tags = document.getElementById('project-tags').value.split(',').map(t => t.trim()).filter(t => t);
            const visibility = document.getElementById('project-visibility').value;

            try {
                const response = await api.post('/api/projects', {
                    name,
                    description,
                    status,
                    githubRepo: githubRepo || undefined,
                    tags,
                    visibility
                });

                if (response.success) {
                    const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                    if (isAdmin) {
                        toast.success('Project created!');
                    } else {
                        toast.success('Project submitted for approval!');
                    }
                    closeCreateProject();
                    await loadProjects();
                } else {
                    toast.error('Failed to create project: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating project:', error);
                toast.error('Error creating project');
            }
        });

        // Search functionality with debouncing
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                
                // Clear existing timeout
                if (searchTimeout) {
                    clearTimeout(searchTimeout);
                }
                
                // Debounce search (wait 300ms after user stops typing)
                searchTimeout = setTimeout(() => {
                    applyFilters();
                }, 300);
            });
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Donate to project
        function donateToProject(projectId, projectName) {
            currentDonationProjectId = projectId;
            currentDonationProjectName = projectName;
            document.getElementById('donation-modal-title').textContent = `Donate to ${projectName}`;
            document.getElementById('donation-form').reset();
            document.getElementById('donation-modal').classList.add('active');
        }

        function closeDonationModal() {
            document.getElementById('donation-modal').classList.remove('active');
            currentDonationProjectId = null;
            currentDonationProjectName = null;
        }

        function closeInvoiceModal() {
            document.getElementById('invoice-modal').classList.remove('active');
        }

        function copyInvoice() {
            const invoiceText = document.getElementById('invoice-text').value;
            navigator.clipboard.writeText(invoiceText).then(() => {
                toast.success('Lightning invoice copied to clipboard');
            }).catch(() => {
                toast.error('Failed to copy invoice');
            });
        }

        document.getElementById('donation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseInt(document.getElementById('donation-amount').value);
            const donorName = document.getElementById('donation-name').value.trim();
            const donorEmail = document.getElementById('donation-email').value.trim();

            if (!amount || amount <= 0) {
                toast.error('Please enter a valid amount in sats');
                return;
            }

            closeDonationModal();

            try {
                const response = await api.post(`/api/projects/${currentDonationProjectId}/donate`, {
                    amount,
                    donorName: donorName || undefined,
                    donorEmail: donorEmail || undefined,
                });

                if (response.success && response.data) {
                    if (response.data.paymentUrl) {
                        // Redirect to OpenNode payment page
                        window.open(response.data.paymentUrl, '_blank');
                        toast.success(`Opening payment page for ${amount} sats donation to ${currentDonationProjectName}`);
                    } else if (response.data.lightningInvoice) {
                        // Show Lightning invoice
                        const invoice = response.data.lightningInvoice.payreq;
                        document.getElementById('invoice-text').value = invoice;
                        document.getElementById('invoice-modal').classList.add('active');
                    }
                } else {
                    toast.error('Failed to create donation: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating donation:', error);
                toast.error('Error creating donation');
            }
        });

        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('projects-content').style.display = 'block';
            await loadProjects();
        })();
    })();</script>
