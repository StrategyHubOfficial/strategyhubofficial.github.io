---
layout: default
title: Projects
---

<style>
.projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }
        .project-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .project-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .project-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.idea { background: #1e3a8a; color: #60a5fa; }
        .status.active { background: #2d5016; color: #4ade80; }
        .status.completed { background: #78350f; color: #fbbf24; }
        .status.archived { background: #7f1d1d; color: #f87171; }
        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .project-team {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .team-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-member {
            display: inline-block;
            color: var(--bitcoin-orange);
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .project-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .create-project-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .create-project-modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
</style>

<div class="container">
        <div class="projects-header">
            <h1>Projects</h1>
            <button class="btn" onclick="showCreateProject()">Create Project</button>
        </div>

        <div class="filters" style="margin-bottom: 2rem;">
            <button class="filter-btn active" data-filter="all">All Projects</button>
            <button class="filter-btn" data-filter="idea">Ideas</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="archived">Archived</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading projects...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="projects-content" style="display: none;">
            <div id="projects-list"></div>
            <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: var(--text-secondary);">
                <p>No projects found.</p>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" class="create-project-modal">
        <div class="modal-content">
            <h2>Create New Project</h2>
            <form id="create-project-form">
                <div class="form-group">
                    <label>Project Name:</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="project-description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="project-status" required>
                        <option value="idea">Idea</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>GitHub Repository (optional):</label>
                    <input type="text" id="project-github" placeholder="owner/repo">
                </div>
                <div class="form-group">
                    <label>Tags (comma-separated):</label>
                    <input type="text" id="project-tags" placeholder="bitcoin, infrastructure, tooling">
                </div>
                <div class="form-group">
                    <label>Visibility:</label>
                    <select id="project-visibility" required>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn">Create Project</button>
                    <button type="button" class="btn-secondary" onclick="closeCreateProject()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
