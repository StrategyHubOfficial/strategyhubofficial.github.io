---
layout: default
title: Projects
---

<style>
.projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }
        .project-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .project-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .project-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.idea { background: #1e3a8a; color: #60a5fa; }
        .status.active { background: #2d5016; color: #4ade80; }
        .status.completed { background: #78350f; color: #fbbf24; }
        .status.archived { background: #7f1d1d; color: #f87171; }
        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .project-team {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .team-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-member {
            display: inline-block;
            color: var(--bitcoin-orange);
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .project-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .create-project-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .create-project-modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
</style>

<!DOCTYPE html>
<html lang="en">

<body>
    
    
</body>
</html>

<script>
document.getElementById('mobile-menu-toggle')?.addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });

let allProjects = [];
        let filteredProjects = [];
        let currentFilter = 'all';

        async function loadProjects() {
            try {
                const response = await api.get('/api/projects');
                if (response.success) {
                    allProjects = response.data || [];
                    applyFilters();
                } else {
                    toast.error('Failed to load projects');
                    document.getElementById('error').textContent = 'Failed to load projects';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                toast.error('Error loading projects');
                document.getElementById('error').textContent = 'Error loading projects';
                document.getElementById('error').style.display = 'block';
            }
        }

        function applyFilters() {
            filteredProjects = allProjects.filter(project => {
                if (currentFilter !== 'all' && project.status !== currentFilter) {
                    return false;
                }
                return true;
            });

            renderProjects();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            const noResults = document.getElementById('no-results');

            if (filteredProjects.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = filteredProjects.map(project => {
                const statusClass = project.status || 'idea';
                const tags = project.tags || [];
                const teamMembers = project.teamMembers || [];

                return `
                    <div class="project-card" id="project-${project.id}">
                        <div class="project-header">
                            <div>
                                <div class="project-title">${project.name}</div>
                                <span class="project-status status ${statusClass}">${statusClass}</span>
                            </div>
                        </div>
                        <div class="project-description">${project.description || 'No description'}</div>
                        <div class="project-meta">
                            ${project.githubRepo ? `
                                <div class="project-meta-item">
                                    <span>🔗</span>
                                    <a href="https://github.com/${project.githubRepo}" target="_blank" style="color: var(--bitcoin-orange);">${project.githubRepo}</a>
                                </div>
                            ` : ''}
                            <div class="project-meta-item">
                                <span>👁️</span>
                                <span>${project.visibility || 'public'}</span>
                            </div>
                            <div class="project-meta-item">
                                <span>👥</span>
                                <span>${teamMembers.length} team member${teamMembers.length !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                        ${tags.length > 0 ? `
                            <div class="project-tags">
                                ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${teamMembers.length > 0 ? `
                            <div class="project-team">
                                <div class="team-title">Team Members</div>
                                ${teamMembers.map(memberId => 
                                    `<a href="/dashboard/members#${memberId}" class="team-member">Member ${memberId.substring(0, 8)}...</a>`
                                ).join('')}
                            </div>
                        ` : ''}
                        <div class="project-actions">
                            <button class="btn btn-small" onclick="viewProject('${project.id}')">View Details</button>
                            ${isAdmin() ? `<button class="btn-secondary btn-small" onclick="editProject('${project.id}')">Edit</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function isAdmin() {
            const user = auth.getCurrentUser();
            return user && user.role === 'admin';
        }

        function showCreateProject() {
            if (!isAdmin()) {
                toast.error('Only admins can create projects');
                return;
            }
            document.getElementById('create-project-modal').classList.add('active');
        }

        function closeCreateProject() {
            document.getElementById('create-project-modal').classList.remove('active');
            document.getElementById('create-project-form').reset();
        }

        async function viewProject(id) {
            try {
                const response = await api.get(`/api/projects/${id}`);
                if (response.success) {
                    const project = response.data;
                    alert(`Project: ${project.name}\n\n${project.description}\n\nStatus: ${project.status}\nTeam: ${project.teamMembers.length} members`);
                } else {
                    toast.error('Failed to load project details');
                }
            } catch (error) {
                console.error('Error loading project:', error);
                toast.error('Error loading project');
            }
        }

        function editProject(id) {
            toast.info('Edit functionality coming soon');
        }

        document.getElementById('create-project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;
            const status = document.getElementById('project-status').value;
            const githubRepo = document.getElementById('project-github').value;
            const tags = document.getElementById('project-tags').value.split(',').map(t => t.trim()).filter(t => t);
            const visibility = document.getElementById('project-visibility').value;

            try {
                const response = await api.post('/api/projects', {
                    name,
                    description,
                    status,
                    githubRepo: githubRepo || undefined,
                    tags,
                    visibility
                });

                if (response.success) {
                    toast.success('Project created!');
                    closeCreateProject();
                    await loadProjects();
                } else {
                    toast.error('Failed to create project: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating project:', error);
                toast.error('Error creating project');
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('projects-content').style.display = 'block';
            await loadProjects();
        })();

        document.getElementById('logout-link').addEventListener('click', async (e) => {
            e.preventDefault();
            await auth.logout();
        });
</script>
