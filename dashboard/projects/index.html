---
layout: default
title: Projects
---

<style>
.projects-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: var(--transition);
            margin-bottom: 1.5rem;
        }
        .project-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        .project-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .project-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status.idea { background: #1e3a8a; color: #60a5fa; }
        .status.active { background: #2d5016; color: #4ade80; }
        .status.completed { background: #78350f; color: #fbbf24; }
        .status.archived { background: #7f1d1d; color: #f87171; }
        .project-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .project-team {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .team-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .team-member {
            display: inline-block;
            color: var(--bitcoin-orange);
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .project-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .create-project-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .create-project-modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
</style>

<div class="container">
        <div class="projects-header">
            <h1>Projects</h1>
            <button class="btn" onclick="showCreateProject()">Create Project</button>
        </div>

        <div class="filters" style="margin-bottom: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button class="btn btn-primary filter-btn active" data-filter="all">All Projects</button>
            <button class="btn btn-secondary filter-btn" data-filter="idea">Ideas</button>
            <button class="btn btn-secondary filter-btn" data-filter="active">Active</button>
            <button class="btn btn-secondary filter-btn" data-filter="completed">Completed</button>
            <button class="btn btn-secondary filter-btn" data-filter="archived">Archived</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading projects...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="projects-content" style="display: none;">
            <div id="projects-list"></div>
            <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: var(--text-secondary);">
                <p>No projects found.</p>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" class="create-project-modal">
        <div class="modal-content">
            <h2>Create New Project</h2>
            <form id="create-project-form">
                <div class="form-group">
                    <label>Project Name:</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="project-description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="project-status" required>
                        <option value="idea">Idea</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>GitHub Repository (optional):</label>
                    <input type="text" id="project-github" placeholder="owner/repo">
                </div>
                <div class="form-group">
                    <label>Tags (comma-separated):</label>
                    <input type="text" id="project-tags" placeholder="bitcoin, infrastructure, tooling">
                </div>
                <div class="form-group">
                    <label>Skills Needed (comma-separated):</label>
                    <input type="text" id="project-skills-needed" placeholder="rust, lightning, ui/ux, typescript">
                </div>
                <div class="form-group">
                    <label>Visibility:</label>
                    <select id="project-visibility" required>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="project-looking-for-collaboration">
                        <span>Looking for collaboration</span>
                    </label>
                </div>
                <div class="form-group" id="collaboration-note-group" style="display: none;">
                    <label>Collaboration Note (optional):</label>
                    <textarea id="project-collaboration-note" rows="3" placeholder="What kind of collaboration are you looking for?"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="project-show-in-portfolio">
                        <span>Show my project in the hub portfolio</span>
                    </label>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn">Create Project</button>
                    <button type="button" class="btn-secondary" onclick="closeCreateProject()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }
        let allProjects = [];
        let filteredProjects = [];
        let currentFilter = 'all';

        async function loadProjects() {
            try {
                const response = await api.get('/api/projects');
                if (response.success) {
                    allProjects = response.data || [];
                    applyFilters();
                } else {
                    toast.error('Failed to load projects');
                    document.getElementById('error').textContent = 'Failed to load projects';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                toast.error('Error loading projects');
                document.getElementById('error').textContent = 'Error loading projects';
                document.getElementById('error').style.display = 'block';
            }
        }

        function applyFilters() {
            filteredProjects = allProjects.filter(project => {
                if (currentFilter !== 'all' && project.status !== currentFilter) {
                    return false;
                }
                return true;
            });

            renderProjects();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            const noResults = document.getElementById('no-results');

            if (filteredProjects.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = filteredProjects.map(project => {
                const statusClass = project.status || 'idea';
                const tags = project.tags || [];
                const teamMembers = project.teamMembers || [];

                const approvalStatus = project.approvalStatus || 'approved';
                const approvalBadge = approvalStatus === 'pending' 
                    ? '<span class="project-status status pending" style="background: #78350f; color: #fbbf24; margin-left: 0.5rem;">Pending Approval</span>'
                    : approvalStatus === 'rejected'
                    ? '<span class="project-status status rejected" style="background: #7f1d1d; color: #f87171; margin-left: 0.5rem;">Rejected</span>'
                    : '';

                return `
                    <div class="project-card" id="project-${project.id}">
                        <div class="project-header">
                            <div>
                                <div class="project-title">${project.name}</div>
                                <span class="project-status status ${statusClass}">${statusClass}</span>
                                ${approvalBadge}
                            </div>
                            ${isAdmin() && approvalStatus === 'pending' ? `
                                <div style="display: flex; gap: 0.5rem;">
                                    <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="approveProject('${project.id}')">Approve</button>
                                    <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="rejectProject('${project.id}')">Reject</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="project-description">${project.description || 'No description'}</div>
                        <div class="project-meta">
                            ${project.githubRepo ? `
                                <div class="project-meta-item">
                                    <span>🔗</span>
                                    <a href="https://github.com/${project.githubRepo}" target="_blank" style="color: var(--bitcoin-orange);">${project.githubRepo}</a>
                                </div>
                            ` : ''}
                            <div class="project-meta-item">
                                <span>👁️</span>
                                <span>${project.visibility || 'public'}</span>
                            </div>
                            <div class="project-meta-item">
                                <span>👥</span>
                                <span>${teamMembers.length} team member${teamMembers.length !== 1 ? 's' : ''}</span>
                            </div>
                        </div>
                        ${tags.length > 0 ? `
                            <div class="project-tags">
                                ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        ` : ''}
                        ${teamMembers.length > 0 ? `
                            <div class="project-team">
                                <div class="team-title">Team Members</div>
                                ${teamMembers.map(memberId => 
                                    `<a href="/dashboard/members#${memberId}" class="team-member">Member ${memberId.substring(0, 8)}...</a>`
                                ).join('')}
                            </div>
                        ` : ''}
                        <div class="project-actions">
                            <button class="btn btn-small" onclick="viewProject('${project.id}')">View Details</button>
                            <button class="btn btn-small" onclick="donateToProject('${project.id}', '${project.name}')" style="background: var(--bitcoin-orange);">Donate</button>
                            ${isAdmin() ? `<button class="btn-secondary btn-small" onclick="editProject('${project.id}')">Edit</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function isAdmin() {
            const user = auth.getCurrentUser();
            return user && user.role === 'admin';
        }

        function showCreateProject() {
            document.getElementById('create-project-modal').classList.add('active');
        }
        
        // Expose to global scope for onclick handlers
        window.showCreateProject = showCreateProject;

        function closeCreateProject() {
            document.getElementById('create-project-modal').classList.remove('active');
            document.getElementById('create-project-form').reset();
        }

        async function viewProject(id) {
            try {
                const response = await api.get(`/api/projects/${id}`);
                if (response.success) {
                    const project = response.data;
                    alert(`Project: ${project.name}\n\n${project.description}\n\nStatus: ${project.status}\nTeam: ${project.teamMembers.length} members`);
                } else {
                    toast.error('Failed to load project details');
                }
            } catch (error) {
                console.error('Error loading project:', error);
                toast.error('Error loading project');
            }
        }
        
        function editProject(id) {
            toast.info('Edit functionality coming soon');
        }
        
        async function approveProject(id) {
            try {
                const response = await api.approveProject(id);
                if (response.success) {
                    toast.success('Project approved!');
                    await loadProjects();
                } else {
                    toast.error('Failed to approve project');
                }
            } catch (error) {
                console.error('Error approving project:', error);
                toast.error('Error approving project');
            }
        }

        async function rejectProject(id) {
            if (!confirm('Are you sure you want to reject this project?')) {
                return;
            }
            try {
                const response = await api.rejectProject(id);
                if (response.success) {
                    toast.success('Project rejected');
                    await loadProjects();
                } else {
                    toast.error('Failed to reject project');
                }
            } catch (error) {
                console.error('Error rejecting project:', error);
                toast.error('Error rejecting project');
            }
        }

        // Expose to global scope for onclick handlers
        window.viewProject = viewProject;
        window.editProject = editProject;
        window.donateToProject = donateToProject;
        window.approveProject = approveProject;
        window.rejectProject = rejectProject;

        document.getElementById('create-project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;
            const status = document.getElementById('project-status').value;
            const githubRepo = document.getElementById('project-github').value;
            const tags = document.getElementById('project-tags').value.split(',').map(t => t.trim()).filter(t => t);
            const visibility = document.getElementById('project-visibility').value;

            try {
                const response = await api.post('/api/projects', {
                    name,
                    description,
                    status,
                    githubRepo: githubRepo || undefined,
                    tags,
                    visibility
                });

                if (response.success) {
                    const isAdmin = window.isAdmin || (auth.getCurrentUser()?.role === 'admin');
                    if (isAdmin) {
                        toast.success('Project created!');
                    } else {
                        toast.success('Project submitted for approval!');
                    }
                    closeCreateProject();
                    await loadProjects();
                } else {
                    toast.error('Failed to create project: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating project:', error);
                toast.error('Error creating project');
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Donate to project
        async function donateToProject(projectId, projectName) {
            const amount = prompt(`Enter donation amount in sats for "${projectName}":`);
            if (!amount || isNaN(parseInt(amount)) || parseInt(amount) <= 0) {
                if (amount !== null) {
                    toast.error('Please enter a valid amount in sats');
                }
                return;
            }

            try {
                const response = await api.post(`/api/projects/${projectId}/donate`, {
                    amount: parseInt(amount)
                });

                if (response.success && response.data) {
                    if (response.data.paymentUrl) {
                        // Redirect to OpenNode payment page
                        window.open(response.data.paymentUrl, '_blank');
                        toast.success(`Opening payment page for ${amount} sats donation to ${projectName}`);
                    } else if (response.data.lightningInvoice) {
                        // Show Lightning invoice
                        const invoice = response.data.lightningInvoice.payreq;
                        if (confirm(`Lightning Invoice:\n\n${invoice}\n\nCopy to clipboard?`)) {
                            navigator.clipboard.writeText(invoice);
                            toast.success('Lightning invoice copied to clipboard');
                        }
                    }
                } else {
                    toast.error('Failed to create donation: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating donation:', error);
                toast.error('Error creating donation');
            }
        }

        // Initialize
        (async () => {
            await auth.requireAuth();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('projects-content').style.display = 'block';
            await loadProjects();
        })();
    })();</script>
