---
layout: default
title: Members
---

<style>
.members-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.5rem;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        .search-bar::before {
            content: "🔍";
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
        }
        .member-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: var(--transition);
            display: flex;
            gap: 1.5rem;
            align-items: start;
        }
        .member-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bitcoin-orange) 0%, var(--bitcoin-orange-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--bg-darker);
            flex-shrink: 0;
        }
        .member-info {
            flex: 1;
        }
        .member-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        .member-email {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .member-bio {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        .member-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .skill-tag {
            background: rgba(247, 147, 26, 0.15);
            color: var(--bitcoin-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .member-projects {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .member-projects-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .project-link {
            display: inline-block;
            color: var(--bitcoin-orange);
            text-decoration: none;
            margin-right: 1rem;
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .project-link:hover {
            text-decoration: underline;
        }
        .member-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .status.active { background: #2d5016; color: #4ade80; }
        .status.inactive { background: #7f1d1d; color: #f87171; }
        .status.pending { background: #78350f; color: #fbbf24; }
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--bitcoin-orange);
            color: var(--bitcoin-orange);
            background: rgba(247, 147, 26, 0.1);
        }
</style>

<div class="container">
        <div class="members-header">
            <h1>Members Directory</h1>
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search members by name, email, or skills...">
                </div>
                <div id="admin-controls" style="display: none;">
                    <a href="/dashboard/admin/users.html" class="btn" style="background: var(--bitcoin-orange); text-decoration: none; white-space: nowrap;">Manage Users</a>
                    <a href="/dashboard/admin/invites.html" class="btn btn-secondary" style="text-decoration: none; white-space: nowrap;">Invite Users</a>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All Members</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading members...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="members-content" style="display: none;">
            <div id="members-grid" class="grid"></div>
            <div id="no-results" style="display: none; text-align: center; padding: 3rem; color: var(--text-secondary);">
                <p>No members found matching your search.</p>
            </div>
        </div>
    </div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }
        let allMembers = [];
        let filteredMembers = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function loadMembers() {
            try {
                const response = await api.get('/api/members');
                if (response.success) {
                    // Handle both array and object responses
                    allMembers = Array.isArray(response.data) 
                        ? response.data 
                        : (response.data?.members || response.data?.data || []);
                    if (!Array.isArray(allMembers)) {
                        allMembers = [];
                    }
                    applyFilters();
                } else {
                    toast.error('Failed to load members');
                    document.getElementById('error').textContent = 'Failed to load members';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading members:', error);
                toast.error('Error loading members');
                document.getElementById('error').textContent = 'Error loading members';
                document.getElementById('error').style.display = 'block';
            }
        }

        function applyFilters() {
            filteredMembers = allMembers.filter(member => {
                // Status filter
                if (currentFilter !== 'all' && member.status !== currentFilter) {
                    return false;
                }

                // Search filter
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const nameMatch = member.name?.toLowerCase().includes(query);
                    const emailMatch = member.email?.toLowerCase().includes(query);
                    const skillsMatch = member.skills?.some(skill => skill.toLowerCase().includes(query));
                    const bioMatch = member.bio?.toLowerCase().includes(query);
                    
                    if (!nameMatch && !emailMatch && !skillsMatch && !bioMatch) {
                        return false;
                    }
                }

                return true;
            });

            renderMembers();
        }

        function renderMembers() {
            const container = document.getElementById('members-grid');
            const noResults = document.getElementById('no-results');

            if (filteredMembers.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            container.innerHTML = filteredMembers.map(member => {
                const initials = member.name?.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) || '?';
                const statusClass = member.status || 'pending';

                const socials = member.socials || {};
                const socialLinks = [];
                if (socials.twitter) {socialLinks.push(`<a href="https://twitter.com/${socials.twitter.replace('@', '')}" target="_blank" style="color: var(--bitcoin-orange); text-decoration: none; margin-right: 0.75rem;">🐦 Twitter</a>`);}
                if (socials.github) {socialLinks.push(`<a href="https://github.com/${socials.github}" target="_blank" style="color: var(--bitcoin-orange); text-decoration: none; margin-right: 0.75rem;">💻 GitHub</a>`);}
                if (socials.linkedin) {socialLinks.push(`<a href="https://linkedin.com/in/${socials.linkedin}" target="_blank" style="color: var(--bitcoin-orange); text-decoration: none; margin-right: 0.75rem;">💼 LinkedIn</a>`);}
                if (socials.nostr) {socialLinks.push(`<a href="https://nostr.com/${socials.nostr}" target="_blank" style="color: var(--bitcoin-orange); text-decoration: none; margin-right: 0.75rem;">⚡ Nostr</a>`);}

                const avatarUrl = member.avatar 
                    ? (member.avatar.startsWith('http') ? member.avatar : `https://dashboard.securesovereigns.workers.dev${member.avatar}`)
                    : null;
                const avatarDisplay = avatarUrl 
                    ? `<img src="${avatarUrl}" alt="${member.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`
                    : initials;

                return `
                    <div class="member-card">
                        <div class="member-avatar">${avatarDisplay}</div>
                        <div class="member-info">
                            <div class="member-name">${member.name || 'Unknown'}</div>
                            ${member.company ? `<div style="color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.95rem;">🏢 ${member.company}</div>` : ''}
                            <div class="member-email">${member.email || ''}</div>
                            ${member.website ? `<div style="margin-bottom: 0.5rem;"><a href="${member.website}" target="_blank" style="color: var(--bitcoin-orange); text-decoration: none;">🌐 ${member.website}</a></div>` : ''}
                            ${member.lightningAddress ? `<div style="margin-bottom: 0.5rem; color: var(--bitcoin-orange);">⚡ ${member.lightningAddress}</div>` : ''}
                            ${member.bio ? `<div class="member-bio">${member.bio}</div>` : ''}
                            ${socialLinks.length > 0 ? `<div style="margin-bottom: 1rem; display: flex; flex-wrap: wrap; align-items: center;">${socialLinks.join('')}</div>` : ''}
                            ${member.skills && member.skills.length > 0 ? `
                                <div class="member-skills">
                                    ${member.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                                </div>
                            ` : ''}
                            ${member.projects && member.projects.length > 0 ? `
                                <div class="member-projects">
                                    <div class="member-projects-title">Projects</div>
                                    ${member.projects.map(projectId => 
                                        `<a href="/dashboard/projects#${projectId}" class="project-link">Project ${projectId.substring(0, 8)}...</a>`
                                    ).join('')}
                                </div>
                            ` : ''}
                            <span class="member-status status ${statusClass}">${statusClass}</span>
                            ${member.sponsorship && member.sponsorship.status === 'active' ? `
                                <span class="tier-badge badge-supporter" style="margin-top: 0.5rem; display: inline-block;">
                                    Supporter
                                </span>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search functionality
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            applyFilters();
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        // Initialize
        (async () => {
            await auth.requireAuth();
            
            // Show admin controls if user is admin
            const user = auth.getCurrentUser();
            if (user && user.role === 'admin') {
                const adminControls = document.getElementById('admin-controls');
                if (adminControls) {
                    adminControls.style.display = 'flex';
                }
            }
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('members-content').style.display = 'block';
            await loadMembers();
        })();
    })();</script>
