---
layout: default
title: User Management
---

<style>
.users-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.user-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: var(--transition);
}

.user-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
}

.user-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 1rem;
}

.user-info {
    flex: 1;
}

.user-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
}

.user-email {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.user-status {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.5rem;
}

.status.active {
    background: #2d5016;
    color: #4ade80;
}

.status.inactive {
    background: #7f1d1d;
    color: #f87171;
}

.status.pending {
    background: #78350f;
    color: #fbbf24;
}

.user-role {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-left: 0.5rem;
    background: rgba(247, 147, 26, 0.2);
    color: var(--bitcoin-orange);
}

.user-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
}
</style>

<div class="container">
    <div class="users-header">
        <h1>User Management</h1>
    </div>

    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>Loading users...</p>
    </div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="users-content" style="display: none;">
        <div id="users-list"></div>
    </div>
</div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        // Check admin access
        const currentUser = auth.getCurrentUser();
        if (!currentUser || currentUser.role !== 'admin') {
            window.location.href = '/dashboard';
            return;
        }

        let allRoles = [];
        let userRolesMap = {};

        async function loadRoles() {
            try {
                const response = await api.getRoles();
                if (response.success) {
                    allRoles = response.data || [];
                }
            } catch (error) {
                console.error('Error loading roles:', error);
            }
        }

        async function loadUserRoles() {
            userRolesMap = {};
            for (const user of users) {
                try {
                    const response = await api.getUserRoles(user.id);
                    if (response.success) {
                        userRolesMap[user.id] = response.data || [];
                    }
                } catch (error) {
                    console.error(`Error loading roles for user ${user.id}:`, error);
                }
            }
        }

        let users = [];

        async function loadUsers() {
            try {
                const response = await api.get('/api/users');
                if (response.success) {
                    users = response.data || [];
                    await loadUserRoles();
                    renderUsers(users);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('users-content').style.display = 'block';
                } else {
                    toast.error('Failed to load users');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = 'Failed to load users';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                toast.error('Error loading users');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Error loading users';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-list');
            
            if (users.length === 0) {
                container.innerHTML = '<p>No users found.</p>';
                return;
            }

            container.innerHTML = users.map(user => {
                const statusClass = user.status || 'pending';
                const roleBadge = user.role === 'admin' ? '<span class="user-role">Admin</span>' : '';
                const userRoles = userRolesMap[user.id] || [];
                const rolesBadges = userRoles.map(ur => 
                    `<span class="badge bg-info me-1">${escapeHtml(ur.role?.name || ur.roleId)}</span>`
                ).join('');

                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div class="user-info">
                                <div class="user-name">${user.name || 'Unnamed User'}</div>
                                <div class="user-email">${user.email}</div>
                                <div style="margin-top: 0.5rem;">
                                    <span class="user-status status ${statusClass}">${statusClass}</span>
                                    ${roleBadge}
                                    ${rolesBadges}
                                    <button class="btn btn-sm btn-outline-primary ms-2" onclick="manageUserRoles('${user.id}')" title="Manage Roles">
                                        <i class="bi bi-gear"></i> Roles
                                    </button>
                                </div>
                            </div>
                            <div class="user-actions">
                                ${user.status === 'active' 
                                    ? `<button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="disableUser('${user.id}')">Disable</button>`
                                    : `<button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="enableUser('${user.id}')">Enable</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function disableUser(userId) {
            if (!confirm('Are you sure you want to disable this user? They will not be able to log in.')) {
                return;
            }

            try {
                const response = await api.put(`/api/users/${userId}`, { status: 'inactive' });
                if (response.success) {
                    toast.success('User disabled');
                    await loadUsers();
                } else {
                    toast.error('Failed to disable user: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error disabling user:', error);
                toast.error('Error disabling user');
            }
        }

        async function enableUser(userId) {
            try {
                const response = await api.put(`/api/users/${userId}`, { status: 'active' });
                if (response.success) {
                    toast.success('User enabled');
                    await loadUsers();
                } else {
                    toast.error('Failed to enable user: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error enabling user:', error);
                toast.error('Error enabling user');
            }
        }

        window.manageUserRoles = async function(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            // Load roles if not already loaded
            if (allRoles.length === 0) {
                await loadRoles();
            }

            // Get current user roles
            const currentRoles = userRolesMap[userId] || [];
            const currentRoleIds = currentRoles.map(ur => ur.roleId);

            // Create modal content
            const modalHtml = `
                <div class="modal fade" id="user-roles-modal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content bg-dark text-light">
                            <div class="modal-header">
                                <h5 class="modal-title">Manage Roles for ${escapeHtml(user.name || user.email)}</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div id="user-roles-list">
                                    ${allRoles.map(role => `
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="user-role-${role.id}" 
                                                   value="${role.id}"
                                                   ${currentRoleIds.includes(role.id) ? 'checked' : ''}>
                                            <label class="form-check-label" for="user-role-${role.id}">
                                                <strong>${escapeHtml(role.name)}</strong>
                                                ${role.description ? `<br><small class="text-muted">${escapeHtml(role.description)}</small>` : ''}
                                            </label>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="saveUserRoles('${userId}')">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if any
            const existingModal = document.getElementById('user-roles-modal');
            if (existingModal) {
                existingModal.remove();
            }

            // Add modal to page
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            const modal = new bootstrap.Modal(document.getElementById('user-roles-modal'));
            modal.show();

            // Clean up on hide
            document.getElementById('user-roles-modal').addEventListener('hidden.bs.modal', function() {
                this.remove();
            });
        };

        window.saveUserRoles = async function(userId) {
            const checkboxes = document.querySelectorAll('#user-roles-list input[type="checkbox"]:checked');
            const selectedRoleIds = Array.from(checkboxes).map(cb => cb.value);
            const currentRoleIds = (userRolesMap[userId] || []).map(ur => ur.roleId);

            // Determine which roles to add and remove
            const toAdd = selectedRoleIds.filter(id => !currentRoleIds.includes(id));
            const toRemove = currentRoleIds.filter(id => !selectedRoleIds.includes(id));

            try {
                // Add new roles
                for (const roleId of toAdd) {
                    await api.assignRole(userId, roleId);
                }

                // Remove roles
                for (const roleId of toRemove) {
                    await api.removeRole(userId, roleId);
                }

                toast.success('User roles updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('user-roles-modal')).hide();
                await loadUsers();
            } catch (error) {
                console.error('Error updating user roles:', error);
                toast.error('Error updating user roles');
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Expose to global scope
        window.disableUser = disableUser;
        window.enableUser = enableUser;

        // Initialize
        await auth.requireAuth();
        await loadRoles();
        await loadUsers();
    })();
</script>
