---
layout: default
title: User Management
---

<style>
.users-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.user-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: var(--transition);
}

.user-card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
}

.user-header {
    display: flex;
    justify-content: space-between;
    align-items: start;
    margin-bottom: 1rem;
}

.user-info {
    flex: 1;
}

.user-name {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
}

.user-email {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.user-status {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.5rem;
}

.status.active {
    background: #2d5016;
    color: #4ade80;
}

.status.inactive {
    background: #7f1d1d;
    color: #f87171;
}

.status.pending {
    background: #78350f;
    color: #fbbf24;
}

.user-role {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-left: 0.5rem;
    background: rgba(247, 147, 26, 0.2);
    color: var(--bitcoin-orange);
}

.user-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
}
</style>

<div class="container">
    <div class="users-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <h1>User Management</h1>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
                <input type="checkbox" id="select-all-users" onchange="toggleSelectAllUsers()">
                <span style="font-size: 0.9rem;">Select All</span>
            </label>
        </div>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button class="btn" onclick="showCreateUserModal()" style="background: var(--bitcoin-orange);">+ Create User</button>
            <button class="btn btn-secondary" onclick="showCreateGuestEmployeeModal()">+ Create Guest Employee</button>
        </div>
    </div>

    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>Loading users...</p>
    </div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="users-content" style="display: none;">
        <!-- Bulk Actions Toolbar -->
        <div id="bulk-actions-toolbar" style="display: none; margin-bottom: 1rem; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
            <span id="selected-users-count" style="color: var(--text-primary); font-weight: 600;"></span>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="bulkActivateUsers()">Activate Selected</button>
                <button class="btn btn-small" style="background: #78350f; color: #fbbf24;" onclick="bulkDeactivateUsers()">Deactivate Selected</button>
                <button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="bulkDeleteUsers()">Delete Selected</button>
                <button class="btn btn-secondary btn-small" onclick="clearUserSelection()">Clear Selection</button>
            </div>
        </div>
        <div id="users-list"></div>
    </div>
</div>

<!-- Create User Modal -->
<div id="create-user-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="max-width: 500px; background: var(--bg-darker); border-radius: 16px; padding: 2rem; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Create User</h2>
            <button onclick="closeCreateUserModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
        </div>
        <form id="create-user-form" onsubmit="createUser(event); return false;">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Name *</label>
                <input type="text" id="user-name" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Email *</label>
                <input type="email" id="user-email" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Password *</label>
                <input type="password" id="user-password" required minlength="8" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
                <small style="color: var(--text-secondary); font-size: 0.85rem;">Minimum 8 characters</small>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Role *</label>
                <select id="user-role" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
                    <option value="member">Member</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn" style="background: var(--bitcoin-orange); flex: 1;">Create User</button>
                <button type="button" onclick="closeCreateUserModal()" class="btn btn-secondary" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Create Guest Employee Modal -->
<div id="guest-employee-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="max-width: 500px; background: var(--bg-darker); border-radius: 16px; padding: 2rem; border: 1px solid var(--border-color); max-height: 90vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2>Create Guest Employee</h2>
            <button onclick="closeGuestEmployeeModal()" style="background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer;">&times;</button>
        </div>
        <form id="guest-employee-form" onsubmit="createGuestEmployee(event); return false;">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Name *</label>
                <input type="text" id="guest-name" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Email *</label>
                <input type="email" id="guest-email" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Company</label>
                <input type="text" id="guest-company" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Bio</label>
                <textarea id="guest-bio" rows="3" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);"></textarea>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-primary);">Website</label>
                <input type="url" id="guest-website" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-darker); color: var(--text-primary);">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn" style="background: var(--bitcoin-orange); flex: 1;">Create</button>
                <button type="button" onclick="closeGuestEmployeeModal()" class="btn" style="background: var(--bg-card); flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        // Check admin access
        const currentUser = auth.getCurrentUser();
        if (!currentUser || currentUser.role !== 'admin') {
            window.location.href = '/dashboard';
            return;
        }

        let allRoles = [];
        let userRolesMap = {};

        async function loadRoles() {
            try {
                const response = await api.getRoles();
                if (response.success) {
                    allRoles = response.data || [];
                }
            } catch (error) {
                console.error('Error loading roles:', error);
            }
        }

        async function loadUserRoles() {
            userRolesMap = {};
            for (const user of users) {
                try {
                    const response = await api.getUserRoles(user.id);
                    if (response.success) {
                        userRolesMap[user.id] = response.data || [];
                    }
                } catch (error) {
                    console.error(`Error loading roles for user ${user.id}:`, error);
                }
            }
        }

        let users = [];

        async function loadUsers() {
            try {
                const response = await api.get('/api/users');
                if (response.success) {
                    users = response.data || [];
                    await loadUserRoles();
                    renderUsers(users);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('users-content').style.display = 'block';
                } else {
                    toast.error('Failed to load users');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = 'Failed to load users';
                    document.getElementById('error').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading users:', error);
                toast.error('Error loading users');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Error loading users';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-list');
            
            if (users.length === 0) {
                container.innerHTML = '<p>No users found.</p>';
                return;
            }

            container.innerHTML = users.map(user => {
                const statusClass = user.status || 'pending';
                const roleBadge = user.role === 'admin' ? '<span class="user-role">Admin</span>' : '';
                const userRoles = userRolesMap[user.id] || [];
                const rolesBadges = userRoles.map(ur => 
                    `<span class="badge bg-info me-1">${escapeHtml(ur.role?.name || ur.roleId)}</span>`
                ).join('');

                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div style="display: flex; align-items: start; gap: 0.75rem; flex: 1;">
                                <input type="checkbox" class="user-checkbox" data-user-id="${user.id}" onchange="updateBulkActionsToolbar()" style="margin-top: 0.25rem; cursor: pointer;">
                                <div class="user-info">
                                    <div class="user-name">${user.name || 'Unnamed User'}</div>
                                <div class="user-email">${user.email}</div>
                                <div style="margin-top: 0.5rem;">
                                    <span class="user-status status ${statusClass}">${statusClass}</span>
                                    ${roleBadge}
                                    ${rolesBadges}
                                    <button class="btn btn-sm btn-outline-primary ms-2" onclick="manageUserRoles('${user.id}')" title="Manage Roles">
                                        <i class="bi bi-gear"></i> Roles
                                    </button>
                                </div>
                            </div>
                            <div class="user-actions">
                                ${user.status === 'active' 
                                    ? `<button class="btn btn-small" style="background: #7f1d1d; color: #f87171;" onclick="disableUser('${user.id}')">Disable</button>`
                                    : `<button class="btn btn-small" style="background: #2d5016; color: #4ade80;" onclick="enableUser('${user.id}')">Enable</button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function disableUser(userId) {
            if (!confirm('Are you sure you want to disable this user? They will not be able to log in.')) {
                return;
            }

            try {
                const response = await api.put(`/api/users/${userId}`, { status: 'inactive' });
                if (response.success) {
                    toast.success('User disabled');
                    await loadUsers();
                } else {
                    toast.error('Failed to disable user: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error disabling user:', error);
                toast.error('Error disabling user');
            }
        }

        async function enableUser(userId) {
            try {
                const response = await api.put(`/api/users/${userId}`, { status: 'active' });
                if (response.success) {
                    toast.success('User enabled');
                    await loadUsers();
                } else {
                    toast.error('Failed to enable user: ' + (response.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error enabling user:', error);
                toast.error('Error enabling user');
            }
        }

        window.manageUserRoles = async function(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) {return;}

            // Load roles if not already loaded
            if (allRoles.length === 0) {
                await loadRoles();
            }

            // Get current user roles
            const currentRoles = userRolesMap[userId] || [];
            const currentRoleIds = currentRoles.map(ur => ur.roleId);

            // Create modal content
            const modalHtml = `
                <div class="modal fade" id="user-roles-modal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content bg-dark text-light">
                            <div class="modal-header">
                                <h5 class="modal-title">Manage Roles for ${escapeHtml(user.name || user.email)}</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div id="user-roles-list">
                                    ${allRoles.map(role => `
                                        <div class="form-check mb-2">
                                            <input class="form-check-input" type="checkbox" 
                                                   id="user-role-${role.id}" 
                                                   value="${role.id}"
                                                   ${currentRoleIds.includes(role.id) ? 'checked' : ''}>
                                            <label class="form-check-label" for="user-role-${role.id}">
                                                <strong>${escapeHtml(role.name)}</strong>
                                                ${role.description ? `<br><small class="text-muted">${escapeHtml(role.description)}</small>` : ''}
                                            </label>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="saveUserRoles('${userId}')">Save</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if any
            const existingModal = document.getElementById('user-roles-modal');
            if (existingModal) {
                existingModal.remove();
            }

            // Add modal to page
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            const modal = new bootstrap.Modal(document.getElementById('user-roles-modal'));
            modal.show();

            // Clean up on hide
            document.getElementById('user-roles-modal').addEventListener('hidden.bs.modal', function() {
                this.remove();
            });
        };

        window.saveUserRoles = async function(userId) {
            const checkboxes = document.querySelectorAll('#user-roles-list input[type="checkbox"]:checked');
            const selectedRoleIds = Array.from(checkboxes).map(cb => cb.value);
            const currentRoleIds = (userRolesMap[userId] || []).map(ur => ur.roleId);

            // Determine which roles to add and remove
            const toAdd = selectedRoleIds.filter(id => !currentRoleIds.includes(id));
            const toRemove = currentRoleIds.filter(id => !selectedRoleIds.includes(id));

            try {
                // Add new roles
                for (const roleId of toAdd) {
                    await api.assignRole(userId, roleId);
                }

                // Remove roles
                for (const roleId of toRemove) {
                    await api.removeRole(userId, roleId);
                }

                toast.success('User roles updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('user-roles-modal')).hide();
                await loadUsers();
            } catch (error) {
                console.error('Error updating user roles:', error);
                toast.error('Error updating user roles');
            }
        };

        function escapeHtml(text) {
            if (!text) {return '';}
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Expose to global scope
        window.disableUser = disableUser;
        window.enableUser = enableUser;

        // Create User Modal Functions
        function showCreateUserModal() {
            document.getElementById('create-user-modal').style.display = 'flex';
            document.getElementById('create-user-form').reset();
        }

        function closeCreateUserModal() {
            document.getElementById('create-user-modal').style.display = 'none';
        }

        async function createUser(event) {
            event.preventDefault();
            try {
                const data = {
                    name: document.getElementById('user-name').value.trim(),
                    email: document.getElementById('user-email').value.trim(),
                    password: document.getElementById('user-password').value,
                    role: document.getElementById('user-role').value
                };

                const response = await api.post('/api/users', data);
                if (response.success) {
                    toast.success('User created successfully');
                    closeCreateUserModal();
                    await loadUsers();
                } else {
                    toast.error(response.error || 'Failed to create user');
                }
            } catch (error) {
                console.error('Error creating user:', error);
                toast.error('Error creating user: ' + (error.message || 'Unknown error'));
            }
        }

        // Guest Employee Modal Functions
        function showCreateGuestEmployeeModal() {
            document.getElementById('guest-employee-modal').style.display = 'flex';
            document.getElementById('guest-employee-form').reset();
        }

        function closeGuestEmployeeModal() {
            document.getElementById('guest-employee-modal').style.display = 'none';
        }

        async function createGuestEmployee(event) {
            event.preventDefault();
            try {
                const data = {
                    name: document.getElementById('guest-name').value.trim(),
                    email: document.getElementById('guest-email').value.trim(),
                    company: document.getElementById('guest-company').value.trim() || undefined,
                    bio: document.getElementById('guest-bio').value.trim() || undefined,
                    website: document.getElementById('guest-website').value.trim() || undefined,
                };

                const response = await api.createGuestEmployee(data);
                if (response.success) {
                    toast.success('Guest employee account created successfully');
                    closeGuestEmployeeModal();
                    await loadUsers(); // Reload users to show new guest employee
                } else {
                    toast.error(response.error || 'Failed to create guest employee');
                }
            } catch (error) {
                console.error('Error creating guest employee:', error);
                toast.error('Error creating guest employee');
            }
        }

        // Bulk operations
        function getSelectedUserIds() {
            return Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.dataset.userId);
        }

        function updateBulkActionsToolbar() {
            const selected = getSelectedUserIds();
            const toolbar = document.getElementById('bulk-actions-toolbar');
            const countSpan = document.getElementById('selected-users-count');
            
            if (selected.length > 0) {
                toolbar.style.display = 'flex';
                countSpan.textContent = `${selected.length} user${selected.length !== 1 ? 's' : ''} selected`;
            } else {
                toolbar.style.display = 'none';
            }
        }

        function toggleSelectAllUsers() {
            const selectAll = document.getElementById('select-all-users');
            const checkboxes = document.querySelectorAll('.user-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateBulkActionsToolbar();
        }

        function clearUserSelection() {
            document.getElementById('select-all-users').checked = false;
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
            updateBulkActionsToolbar();
        }

        async function bulkActivateUsers() {
            const selected = getSelectedUserIds();
            if (selected.length === 0) {
                toast.error('Please select at least one user');
                return;
            }

            if (!confirm(`Activate ${selected.length} user${selected.length !== 1 ? 's' : ''}?`)) {
                return;
            }

            try {
                const response = await api.bulkUsers(selected, 'activate');
                if (response.success) {
                    toast.success(response.data.message || `Activated ${selected.length} user${selected.length !== 1 ? 's' : ''}`);
                    clearUserSelection();
                    await loadUsers();
                } else {
                    toast.error(response.error || 'Failed to activate users');
                }
            } catch (error) {
                console.error('Error activating users:', error);
                toast.error('Error activating users');
            }
        }

        async function bulkDeactivateUsers() {
            const selected = getSelectedUserIds();
            if (selected.length === 0) {
                toast.error('Please select at least one user');
                return;
            }

            if (!confirm(`Deactivate ${selected.length} user${selected.length !== 1 ? 's' : ''}?`)) {
                return;
            }

            try {
                const response = await api.bulkUsers(selected, 'deactivate');
                if (response.success) {
                    toast.success(response.data.message || `Deactivated ${selected.length} user${selected.length !== 1 ? 's' : ''}`);
                    clearUserSelection();
                    await loadUsers();
                } else {
                    toast.error(response.error || 'Failed to deactivate users');
                }
            } catch (error) {
                console.error('Error deactivating users:', error);
                toast.error('Error deactivating users');
            }
        }

        async function bulkDeleteUsers() {
            const selected = getSelectedUserIds();
            if (selected.length === 0) {
                toast.error('Please select at least one user');
                return;
            }

            if (!confirm(`⚠️ WARNING: This will permanently delete ${selected.length} user${selected.length !== 1 ? 's' : ''}. This action cannot be undone!\n\nAre you sure?`)) {
                return;
            }

            try {
                const response = await api.bulkUsers(selected, 'delete');
                if (response.success) {
                    toast.success(response.data.message || `Deleted ${selected.length} user${selected.length !== 1 ? 's' : ''}`);
                    clearUserSelection();
                    await loadUsers();
                } else {
                    toast.error(response.error || 'Failed to delete users');
                }
            } catch (error) {
                console.error('Error deleting users:', error);
                toast.error('Error deleting users');
            }
        }

        window.updateBulkActionsToolbar = updateBulkActionsToolbar;
        window.toggleSelectAllUsers = toggleSelectAllUsers;
        window.clearUserSelection = clearUserSelection;
        window.bulkActivateUsers = bulkActivateUsers;
        window.bulkDeactivateUsers = bulkDeactivateUsers;
        window.bulkDeleteUsers = bulkDeleteUsers;

        // Initialize
        await auth.requireAuth();
        await loadRoles();
        await loadUsers();
    })();
</script>
