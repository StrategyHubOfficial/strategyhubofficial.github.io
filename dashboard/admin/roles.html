---
layout: default
title: Role Management
---

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Role Management</h1>
        <button class="btn btn-primary" onclick="showCreateRoleModal()">Create Role</button>
    </div>

    <div id="error" class="alert alert-danger" style="display: none;"></div>
    <div id="success" class="alert alert-success" style="display: none;"></div>

    <div class="card">
        <div class="card-body">
            <div id="roles-list" class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Permissions</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roles-tbody">
                        <tr>
                            <td colspan="5" class="text-center">Loading roles...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Create/Edit Role Modal -->
<div class="modal fade" id="role-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header">
                <h5 class="modal-title" id="role-modal-title">Create Role</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="role-form">
                    <div class="mb-3">
                        <label for="role-name" class="form-label">Role Name</label>
                        <input type="text" class="form-control bg-dark text-light" id="role-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="role-description" class="form-label">Description</label>
                        <textarea class="form-control bg-dark text-light" id="role-description" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permissions</label>
                        <div id="permissions-list" class="border rounded p-3" style="max-height: 400px; overflow-y: auto;">
                            <div class="text-center">Loading permissions...</div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveRole()">Save Role</button>
            </div>
        </div>
    </div>
</div>

<script>
    (async function() {
        if (typeof auth === 'undefined' || typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        let allRoles = [];
        let allPermissions = [];
        let editingRoleId = null;

        async function loadRoles() {
            try {
                const response = await api.get('/api/roles');
                if (response.success) {
                    allRoles = response.data || [];
                    renderRoles();
                } else {
                    toast.error('Failed to load roles');
                }
            } catch (error) {
                console.error('Error loading roles:', error);
                toast.error('Error loading roles');
            }
        }

        async function loadPermissions() {
            try {
                const response = await api.get('/api/permissions');
                if (response.success) {
                    allPermissions = response.data || [];
                    renderPermissions();
                } else {
                    toast.error('Failed to load permissions');
                }
            } catch (error) {
                console.error('Error loading permissions:', error);
                toast.error('Error loading permissions');
            }
        }

        function renderRoles() {
            const tbody = document.getElementById('roles-tbody');
            if (allRoles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No roles found</td></tr>';
                return;
            }

            tbody.innerHTML = allRoles.map(role => `
                <tr>
                    <td><strong>${escapeHtml(role.name)}</strong></td>
                    <td>${escapeHtml(role.description || '')}</td>
                    <td>
                        <span class="badge bg-secondary">${role.permissions.length} permission(s)</span>
                        ${role.permissions.includes('*.*') ? '<span class="badge bg-danger ms-1">All Permissions</span>' : ''}
                    </td>
                    <td>
                        ${role.isSystem ? '<span class="badge bg-info">System</span>' : '<span class="badge bg-secondary">Custom</span>'}
                    </td>
                    <td>
                        <button class="btn btn-sm btn-primary me-1" onclick="editRole('${role.id}')">Edit</button>
                        ${!role.isSystem ? `<button class="btn btn-sm btn-danger" onclick="deleteRole('${role.id}')">Delete</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function renderPermissions() {
            const container = document.getElementById('permissions-list');
            if (allPermissions.length === 0) {
                container.innerHTML = '<div class="text-center">No permissions available</div>';
                return;
            }

            // Group permissions by resource
            const grouped = {};
            allPermissions.forEach(perm => {
                if (!grouped[perm.resource]) {
                    grouped[perm.resource] = [];
                }
                grouped[perm.resource].push(perm);
            });

            container.innerHTML = Object.entries(grouped).map(([resource, perms]) => `
                <div class="mb-3">
                    <strong>${escapeHtml(resource)}</strong>
                    <div class="ms-3 mt-2">
                        ${perms.map(perm => `
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       id="perm-${perm.id}" 
                                       value="${perm.id}"
                                       ${editingRoleId && allRoles.find(r => r.id === editingRoleId)?.permissions.includes(perm.id) ? 'checked' : ''}>
                                <label class="form-check-label" for="perm-${perm.id}">
                                    ${escapeHtml(perm.name)} ${perm.description ? `<small class="text-muted">- ${escapeHtml(perm.description)}</small>` : ''}
                                </label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.showCreateRoleModal = function() {
            editingRoleId = null;
            document.getElementById('role-modal-title').textContent = 'Create Role';
            document.getElementById('role-name').value = '';
            document.getElementById('role-description').value = '';
            renderPermissions();
            new bootstrap.Modal(document.getElementById('role-modal')).show();
        };

        window.editRole = function(roleId) {
            const role = allRoles.find(r => r.id === roleId);
            if (!role) return;

            editingRoleId = roleId;
            document.getElementById('role-modal-title').textContent = 'Edit Role';
            document.getElementById('role-name').value = role.name;
            document.getElementById('role-name').disabled = role.isSystem;
            document.getElementById('role-description').value = role.description || '';
            renderPermissions();
            new bootstrap.Modal(document.getElementById('role-modal')).show();
        };

        window.saveRole = async function() {
            const name = document.getElementById('role-name').value.trim();
            const description = document.getElementById('role-description').value.trim();
            const checkboxes = document.querySelectorAll('#permissions-list input[type="checkbox"]:checked');
            const permissions = Array.from(checkboxes).map(cb => cb.value);

            if (!name) {
                toast.error('Role name is required');
                return;
            }

            try {
                if (editingRoleId) {
                    // Update existing role
                    const response = await api.put(`/api/roles/${editingRoleId}`, {
                        description,
                    });
                    if (response.success) {
                        // Update permissions
                        const permResponse = await api.put(`/api/roles/${editingRoleId}/permissions`, {
                            permissions
                        });
                        if (permResponse.success) {
                            toast.success('Role updated successfully');
                            bootstrap.Modal.getInstance(document.getElementById('role-modal')).hide();
                            await loadRoles();
                        } else {
                            toast.error('Failed to update role permissions');
                        }
                    } else {
                        toast.error('Failed to update role');
                    }
                } else {
                    // Create new role
                    const response = await api.post('/api/roles', {
                        name,
                        description,
                        permissions
                    });
                    if (response.success) {
                        toast.success('Role created successfully');
                        bootstrap.Modal.getInstance(document.getElementById('role-modal')).hide();
                        await loadRoles();
                    } else {
                        toast.error(response.error || 'Failed to create role');
                    }
                }
            } catch (error) {
                console.error('Error saving role:', error);
                toast.error('Error saving role');
            }
        };

        window.deleteRole = async function(roleId) {
            if (!confirm('Are you sure you want to delete this role? Users with this role will lose access.')) {
                return;
            }

            try {
                const response = await api.delete(`/api/roles/${roleId}`);
                if (response.success) {
                    toast.success('Role deleted successfully');
                    await loadRoles();
                } else {
                    toast.error(response.error || 'Failed to delete role');
                }
            } catch (error) {
                console.error('Error deleting role:', error);
                toast.error('Error deleting role');
            }
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load data on page load
        await Promise.all([loadRoles(), loadPermissions()]);
    })();
</script>
