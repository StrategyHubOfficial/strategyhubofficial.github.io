---
layout: default
title: Equipment Check-in
---

<style>
.checkin-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1rem;
}

.checkin-header {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
}

.checkin-header h1 {
    margin: 0 0 1rem 0;
    color: #fff;
}

.checkin-stats {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    margin-top: 1rem;
}

.stat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.stat-label {
    color: #888;
    font-size: 0.85rem;
}

.stat-value {
    color: #fff;
    font-size: 1.5rem;
    font-weight: 600;
}

.checkin-main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
}

@media (max-width: 968px) {
    .checkin-main {
        grid-template-columns: 1fr;
    }

    #scanner-container {
        max-width: 100%;
    }

    .checkin-stats {
        gap: 1rem;
    }

    .stat-value {
        font-size: 1.25rem;
    }
}

.scanner-section {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 1.5rem;
}

.scanner-section h2 {
    margin: 0 0 1rem 0;
    color: #fff;
    font-size: 1.25rem;
}

#scanner-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #0a0a0a;
    border-radius: 8px;
    overflow: hidden;
    aspect-ratio: 1;
}

#scanner-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#scanner-container canvas {
    display: none;
}

.scanner-controls {
    margin-top: 1rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
}

.scanner-status {
    text-align: center;
    margin-top: 1rem;
    padding: 0.75rem;
    border-radius: 6px;
    font-weight: 600;
}

.scanner-status.scanning {
    background: #1e3a8a;
    color: #60a5fa;
}

.scanner-status.stopped {
    background: #7f1d1d;
    color: #f87171;
}

.scanned-items-section {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 1.5rem;
}

.scanned-items-section h2 {
    margin: 0 0 1rem 0;
    color: #fff;
    font-size: 1.25rem;
}

.scanned-list {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 1rem;
}

.scanned-item {
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.scanned-item.scanned {
    border-color: #4ade80;
    background: #1a2e1a;
}

.scanned-item-name {
    color: #fff;
    font-weight: 600;
}

.scanned-item-id {
    color: #888;
    font-size: 0.85rem;
    margin-top: 0.25rem;
}

.scanned-item-status {
    color: #4ade80;
    font-size: 0.9rem;
}

.expected-items-list {
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 1rem;
}

.expected-item {
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 0.75rem;
    margin-bottom: 0.5rem;
    color: #ccc;
    font-size: 0.9rem;
}

.expected-item.scanned {
    border-color: #4ade80;
    background: #1a2e1a;
    color: #4ade80;
}

.checkin-actions {
    margin-top: 1.5rem;
    display: flex;
    gap: 1rem;
}

.error-message {
    background: #7f1d1d;
    border: 1px solid #f87171;
    color: #f87171;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
}

.success-message {
    background: #2d5016;
    border: 1px solid #4ade80;
    color: #4ade80;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
}
</style>

<div class="container">
    <div class="checkin-container">
        <div class="checkin-header">
            <h1>Equipment Check-in</h1>
            <div class="checkin-stats">
                <div class="stat-item">
                    <span class="stat-label">Checked Out</span>
                    <span class="stat-value" id="total-checked-out">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Scanned</span>
                    <span class="stat-value" id="total-scanned">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Remaining</span>
                    <span class="stat-value" id="total-remaining">0</span>
                </div>
            </div>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>
        <div id="success" class="success-message" style="display: none;"></div>

        <div id="loading" class="skeleton-container">
            <div class="skeleton skeleton-card" style="height: 400px;"></div>
        </div>

        <div id="checkin-content" style="display: none;">
            <div class="checkin-main">
                <div class="scanner-section">
                    <h2>Scan QR Code</h2>
                    <div id="scanner-container"></div>
                    <div class="scanner-controls">
                        <button id="start-scanner-btn" class="btn">Start Scanner</button>
                        <button id="stop-scanner-btn" class="btn btn-secondary" style="display: none;">Stop Scanner</button>
                    </div>
                    <div id="scanner-status" class="scanner-status stopped">Scanner Stopped</div>
                    <div style="margin-top: 1rem; text-align: center;">
                        <button id="manual-entry-btn" class="btn btn-secondary">Manual Entry</button>
                    </div>
                </div>

                <div class="scanned-items-section">
                    <h2>Scanned Items</h2>
                    <div id="scanned-list" class="scanned-list"></div>
                    <div class="checkin-actions">
                        <button id="checkin-btn" class="btn" disabled>Check In Scanned Items</button>
                    </div>
                </div>
            </div>

            <div class="scanned-items-section" style="margin-top: 2rem;">
                <h2>Expected Items (Checked Out)</h2>
                <div id="expected-items-list" class="expected-items-list"></div>
            </div>
        </div>
    </div>
</div>

<!-- Manual Entry Modal -->
<div id="manual-entry-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <h2>Manual Entry</h2>
        <p>Enter equipment ID:</p>
        <input type="text" id="manual-equipment-id" class="form-input" placeholder="Equipment ID" />
        <div style="margin-top: 1rem; display: flex; gap: 1rem;">
            <button class="btn" onclick="processManualEntry()">Add</button>
            <button class="btn btn-secondary" onclick="closeManualEntry()">Cancel</button>
        </div>
    </div>
</div>

<!-- Load html5-qrcode library -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
let scanner = null;
let scannedEquipmentIds = new Set();
let checkedOutEquipment = [];
let html5Qrcode = null;

(async () => {
    // Wait for auth
    if (typeof auth === 'undefined' || typeof api === 'undefined') {
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    // Require admin access
    try {
        await auth.requireAuth();
        if (!window.isAdmin) {
            window.location.href = '/dashboard/';
            return;
        }
    } catch (error) {
        console.error('Auth error:', error);
        return;
    }

    // Initialize html5-qrcode
    if (typeof Html5Qrcode !== 'undefined') {
        html5Qrcode = new Html5Qrcode("scanner-container");
    }

    // Load checked-out equipment
    await loadCheckedOutEquipment();

    // Setup event listeners
    document.getElementById('start-scanner-btn').addEventListener('click', startScanner);
    document.getElementById('stop-scanner-btn').addEventListener('click', stopScanner);
    document.getElementById('checkin-btn').addEventListener('click', performCheckIn);
    document.getElementById('manual-entry-btn').addEventListener('click', () => {
        document.getElementById('manual-entry-modal').style.display = 'flex';
        document.getElementById('manual-equipment-id').focus();
    });

    document.getElementById('manual-equipment-id').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            processManualEntry();
        }
    });
})();

async function loadCheckedOutEquipment() {
    try {
        const response = await api.get('/api/equipment/check-in/checked-out');
        
        if (!response.success) {
            throw new Error(response.error || 'Failed to load checked-out equipment');
        }

        checkedOutEquipment = response.data.equipment || [];
        updateStats();
        displayExpectedItems();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('checkin-content').style.display = 'block';
    } catch (error) {
        console.error('Error loading checked-out equipment:', error);
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = error.message || 'Failed to load checked-out equipment';
        document.getElementById('loading').classList.add('hidden');
    }
}

function updateStats() {
    document.getElementById('total-checked-out').textContent = checkedOutEquipment.length;
    document.getElementById('total-scanned').textContent = scannedEquipmentIds.size;
    document.getElementById('total-remaining').textContent = checkedOutEquipment.length - scannedEquipmentIds.size;
}

function displayExpectedItems() {
    const list = document.getElementById('expected-items-list');
    if (checkedOutEquipment.length === 0) {
        list.innerHTML = '<p style="color: #888; text-align: center; padding: 2rem;">No equipment currently checked out</p>';
        return;
    }

    list.innerHTML = checkedOutEquipment.map(item => {
        const isScanned = scannedEquipmentIds.has(item.id);
        return `
            <div class="expected-item ${isScanned ? 'scanned' : ''}">
                ${item.name} (${item.category})
                ${isScanned ? ' ✓' : ''}
            </div>
        `;
    }).join('');
}

function displayScannedItems() {
    const list = document.getElementById('scanned-list');
    const scannedItems = Array.from(scannedEquipmentIds).map(id => {
        return checkedOutEquipment.find(e => e.id === id);
    }).filter(Boolean);

    if (scannedItems.length === 0) {
        list.innerHTML = '<p style="color: #888; text-align: center; padding: 2rem;">No items scanned yet</p>';
        document.getElementById('checkin-btn').disabled = true;
        return;
    }

    list.innerHTML = scannedItems.map(item => `
        <div class="scanned-item scanned">
            <div>
                <div class="scanned-item-name">${item.name}</div>
                <div class="scanned-item-id">${item.id}</div>
            </div>
            <div class="scanned-item-status">✓ Scanned</div>
        </div>
    `).join('');

    document.getElementById('checkin-btn').disabled = false;
}

async function startScanner() {
    if (!html5Qrcode) {
        showError('QR code scanner library not loaded');
        return;
    }

    try {
        // Detect mobile device
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const qrboxSize = isMobile ? 200 : 250;

        await html5Qrcode.start(
            { facingMode: "environment" }, // Use back camera on mobile
            {
                fps: 10,
                qrbox: { width: qrboxSize, height: qrboxSize },
                aspectRatio: 1.0
            },
            onScanSuccess,
            onScanError
        );

        document.getElementById('start-scanner-btn').style.display = 'none';
        document.getElementById('stop-scanner-btn').style.display = 'inline-block';
        document.getElementById('scanner-status').textContent = 'Scanning...';
        document.getElementById('scanner-status').className = 'scanner-status scanning';
    } catch (error) {
        console.error('Error starting scanner:', error);
        showError('Failed to start camera. Please check permissions.');
    }
}

async function stopScanner() {
    if (html5Qrcode) {
        try {
            await html5Qrcode.stop();
        } catch (error) {
            console.error('Error stopping scanner:', error);
        }
    }

    document.getElementById('start-scanner-btn').style.display = 'inline-block';
    document.getElementById('stop-scanner-btn').style.display = 'none';
    document.getElementById('scanner-status').textContent = 'Scanner Stopped';
    document.getElementById('scanner-status').className = 'scanner-status stopped';
}

function onScanSuccess(decodedText, decodedResult) {
    // Extract equipment ID from URL
    // URL format: /dashboard/equipment?id=:id
    let equipmentId = null;
    
    try {
        const url = new URL(decodedText);
        equipmentId = url.searchParams.get('id');
    } catch (e) {
        // If not a URL, try to use the text directly as equipment ID
        equipmentId = decodedText;
    }

    if (!equipmentId) {
        showError('Invalid QR code format');
        return;
    }

    processScannedEquipment(equipmentId);
}

function onScanError(errorMessage) {
    // Ignore scanning errors (they're frequent during scanning)
}

function processScannedEquipment(equipmentId) {
    // Check if equipment is in checked-out list
    const equipment = checkedOutEquipment.find(e => e.id === equipmentId);
    
    if (!equipment) {
        showError(`Equipment ${equipmentId.substring(0, 8)}... is not checked out`);
        return;
    }

    if (scannedEquipmentIds.has(equipmentId)) {
        showError(`${equipment.name} already scanned`);
        return;
    }

    // Add to scanned set
    scannedEquipmentIds.add(equipmentId);
    
    // Visual feedback
    if (typeof toast !== 'undefined') {
        toast.success(`Scanned: ${equipment.name}`);
    }

    // Update UI
    updateStats();
    displayScannedItems();
    displayExpectedItems();

    // Play beep sound (optional)
    playBeep();
}

function processManualEntry() {
    const equipmentId = document.getElementById('manual-equipment-id').value.trim();
    if (!equipmentId) {
        showError('Please enter an equipment ID');
        return;
    }

    processScannedEquipment(equipmentId);
    closeManualEntry();
}

function closeManualEntry() {
    document.getElementById('manual-entry-modal').style.display = 'none';
    document.getElementById('manual-equipment-id').value = '';
}

async function performCheckIn() {
    if (scannedEquipmentIds.size === 0) {
        showError('No items to check in');
        return;
    }

    const equipmentIds = Array.from(scannedEquipmentIds);
    
    try {
        document.getElementById('checkin-btn').disabled = true;
        document.getElementById('checkin-btn').textContent = 'Checking In...';

        const response = await api.post('/api/equipment/check-in/bulk', {
            equipmentIds: equipmentIds
        });

        if (!response.success) {
            throw new Error(response.error || 'Failed to check in equipment');
        }

        // Show success message
        document.getElementById('success').style.display = 'block';
        document.getElementById('success').textContent = `Successfully checked in ${response.data.checkedIn} item(s)`;

        if (typeof toast !== 'undefined') {
            toast.success(`Checked in ${response.data.checkedIn} item(s)`);
        }

        // Clear scanned items
        scannedEquipmentIds.clear();
        
        // Reload checked-out equipment
        await loadCheckedOutEquipment();
        displayScannedItems();

        // Stop scanner
        await stopScanner();

        // Hide success message after 3 seconds
        setTimeout(() => {
            document.getElementById('success').style.display = 'none';
        }, 3000);
    } catch (error) {
        console.error('Error checking in equipment:', error);
        showError(error.message || 'Failed to check in equipment');
        document.getElementById('checkin-btn').disabled = false;
        document.getElementById('checkin-btn').textContent = 'Check In Scanned Items';
    }
}

function showError(message) {
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = message;
    setTimeout(() => {
        document.getElementById('error').style.display = 'none';
    }, 3000);
    
    if (typeof toast !== 'undefined') {
        toast.error(message);
    }
}

function playBeep() {
    // Create a simple beep sound
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.frequency.value = 800;
    oscillator.type = 'sine';

    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.1);
}

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (html5Qrcode) {
        html5Qrcode.stop().catch(() => {});
    }
});
</script>
