---
layout: default
title: Manage Announcements
styles: |
    <style>
        .announcements-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-create {
            background: linear-gradient(135deg, var(--bitcoin-orange) 0%, var(--bitcoin-orange-light) 100%);
            color: var(--bg-darker);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .announcements-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .announcement-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .announcement-card:hover {
            border-color: var(--bitcoin-orange);
            box-shadow: var(--shadow);
        }

        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .announcement-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .announcement-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-public {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }

        .badge-members {
            background: rgba(247, 147, 26, 0.2);
            color: #f7931a;
        }

        .badge-published {
            background: rgba(0, 184, 148, 0.2);
            color: #00b894;
        }

        .badge-draft {
            background: rgba(116, 125, 140, 0.2);
            color: #748d8c;
        }

        .badge-high {
            background: rgba(214, 48, 49, 0.2);
            color: #d63031;
        }

        .badge-normal {
            background: rgba(116, 125, 140, 0.2);
            color: #748d8c;
        }

        .badge-low {
            background: rgba(116, 125, 140, 0.15);
            color: #999;
        }

        .announcement-content {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
            max-height: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .announcement-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-darker);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-small:hover {
            border-color: var(--bitcoin-orange);
            color: var(--bitcoin-orange);
        }

        .btn-danger {
            border-color: rgba(214, 48, 49, 0.5);
            color: #d63031;
        }

        .btn-danger:hover {
            border-color: #d63031;
            background: rgba(214, 48, 49, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-close:hover {
            background: var(--bg-darker);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--bitcoin-orange);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
    </style>
---

<div class="announcements-container">
    <div class="page-header">
        <h1>Manage Announcements</h1>
        <button class="btn-create" onclick="openCreateModal()">+ Create Announcement</button>
    </div>

    <div id="announcements-grid" class="announcements-grid">
        <div class="empty-state">Loading announcements...</div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="announcement-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">Create Announcement</h2>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="announcement-form">
            <input type="hidden" id="announcement-id">
            
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" required>
            </div>

            <div class="form-group">
                <label for="content">Content *</label>
                <textarea id="content" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="visibility">Visibility *</label>
                    <select id="visibility" required>
                        <option value="public">Public (visible to everyone)</option>
                        <option value="members">Members Only (logged-in users)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" required>
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="low">Low</option>
                        <option value="normal" selected>Normal</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expires-at">Expires At (optional)</label>
                    <input type="datetime-local" id="expires-at">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn-create" style="flex: 1;">Save</button>
                <button type="button" class="btn-small" onclick="closeModal()" style="flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
(async function initAnnouncementsPage() {
    while (typeof auth === 'undefined' || typeof api === 'undefined' || typeof toast === 'undefined') {
        await new Promise(function (r) { setTimeout(r, 50); });
    }

    let announcements = [];
    let editingId = null;

    async function loadAnnouncements() {
        try {
            const response = await api.get('/api/announcements?status=');
            if (response.success) {
                announcements = response.data.announcements || [];
                renderAnnouncements();
            } else {
                toast.error('Failed to load announcements');
            }
        } catch (error) {
            console.error('Error loading announcements:', error);
            toast.error('Error loading announcements');
        }
    }

    function renderAnnouncements() {
        const grid = document.getElementById('announcements-grid');
        
        if (announcements.length === 0) {
            grid.innerHTML = '<div class="empty-state">No announcements yet. Create one to get started!</div>';
            return;
        }

        grid.innerHTML = announcements.map(announcement => {
            const publishedDate = announcement.publishedAt 
                ? new Date(announcement.publishedAt).toLocaleDateString()
                : 'Not published';
            const expiresDate = announcement.expiresAt
                ? new Date(announcement.expiresAt).toLocaleDateString()
                : null;

            return `
                <div class="announcement-card">
                    <div class="announcement-header">
                        <div>
                            <div class="announcement-title">${escapeHtml(announcement.title)}</div>
                            <div class="announcement-meta">
                                <span class="badge badge-${announcement.visibility}">${announcement.visibility}</span>
                                <span class="badge badge-${announcement.status}">${announcement.status}</span>
                                <span class="badge badge-${announcement.priority || 'normal'}">${announcement.priority || 'normal'}</span>
                                <span>By ${escapeHtml(announcement.authorName)}</span>
                                <span>${publishedDate}</span>
                                ${expiresDate ? `<span>Expires: ${expiresDate}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="announcement-content">${escapeHtml(announcement.content)}</div>
                    <div class="announcement-actions">
                        <button class="btn-small" onclick="editAnnouncement('${announcement.id}')">Edit</button>
                        <button class="btn-small btn-danger" onclick="deleteAnnouncement('${announcement.id}')">Delete</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openCreateModal() {
        editingId = null;
        document.getElementById('modal-title').textContent = 'Create Announcement';
        document.getElementById('announcement-form').reset();
        document.getElementById('announcement-id').value = '';
        document.getElementById('status').value = 'draft';
        document.getElementById('priority').value = 'normal';
        document.getElementById('announcement-modal').classList.add('show');
    }

    function editAnnouncement(id) {
        const announcement = announcements.find(a => a.id === id);
        if (!announcement) {return;}

        editingId = id;
        document.getElementById('modal-title').textContent = 'Edit Announcement';
        document.getElementById('announcement-id').value = id;
        document.getElementById('title').value = announcement.title;
        document.getElementById('content').value = announcement.content;
        document.getElementById('visibility').value = announcement.visibility;
        document.getElementById('status').value = announcement.status;
        document.getElementById('priority').value = announcement.priority || 'normal';
        
        if (announcement.expiresAt) {
            const date = new Date(announcement.expiresAt);
            const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
            document.getElementById('expires-at').value = localDate.toISOString().slice(0, 16);
        } else {
            document.getElementById('expires-at').value = '';
        }

        document.getElementById('announcement-modal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('announcement-modal').classList.remove('show');
        editingId = null;
    }

    async function deleteAnnouncement(id) {
        if (!confirm('Are you sure you want to delete this announcement?')) {return;}

        try {
            const response = await api.delete(`/api/announcements/${id}`);
            if (response.success) {
                toast.success('Announcement deleted');
                await loadAnnouncements();
            } else {
                toast.error(response.error || 'Failed to delete announcement');
            }
        } catch (error) {
            console.error('Error deleting announcement:', error);
            toast.error('Error deleting announcement');
        }
    }

    document.getElementById('announcement-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('announcement-id').value;
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;
        const visibility = document.getElementById('visibility').value;
        const status = document.getElementById('status').value;
        const priority = document.getElementById('priority').value;
        const expiresAt = document.getElementById('expires-at').value;

        const data = {
            title,
            content,
            visibility,
            status,
            priority,
            expiresAt: expiresAt || undefined,
        };

        try {
            let response;
            if (id) {
                response = await api.put(`/api/announcements/${id}`, data);
            } else {
                response = await api.post('/api/announcements', data);
            }

            if (response.success) {
                toast.success(id ? 'Announcement updated' : 'Announcement created');
                closeModal();
                await loadAnnouncements();
            } else {
                toast.error(response.error || 'Failed to save announcement');
            }
        } catch (error) {
            console.error('Error saving announcement:', error);
            toast.error('Error saving announcement');
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Close modal on outside click
    document.getElementById('announcement-modal').addEventListener('click', (e) => {
        if (e.target.id === 'announcement-modal') {
            closeModal();
        }
    });

    window.openCreateModal = openCreateModal;
    window.closeModal = closeModal;
    window.editAnnouncement = editAnnouncement;
    window.deleteAnnouncement = deleteAnnouncement;

    await auth.requireAuth();
    await loadAnnouncements();
})();
</script>
