---
layout: default
title: Audit Logs
---

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Audit Logs</h1>
        <button class="btn btn-secondary" onclick="exportLogs()">Export CSV</button>
    </div>

    <div id="error" class="alert alert-danger" style="display: none;"></div>
    <div id="success" class="alert alert-success" style="display: none;"></div>

    <!-- Filters -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Filters</h5>
            <form id="filter-form" class="row g-3">
                <div class="col-md-3">
                    <label for="filter-action" class="form-label">Action</label>
                    <input type="text" class="form-control" id="filter-action" placeholder="e.g., create, update, delete">
                </div>
                <div class="col-md-3">
                    <label for="filter-resource" class="form-label">Resource Type</label>
                    <input type="text" class="form-control" id="filter-resource" placeholder="e.g., users, projects, events">
                </div>
                <div class="col-md-3">
                    <label for="filter-user" class="form-label">User ID</label>
                    <input type="text" class="form-control" id="filter-user" placeholder="User ID">
                </div>
                <div class="col-md-3">
                    <label for="filter-start-date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="filter-start-date">
                </div>
                <div class="col-md-3">
                    <label for="filter-end-date" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="filter-end-date">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="button" class="btn btn-primary me-2" onclick="applyFilters()">Apply Filters</button>
                    <button type="button" class="btn btn-secondary" onclick="clearFilters()">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Logs Table -->
    <div class="card">
        <div class="card-body">
            <div id="logs-list" class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Action</th>
                            <th>Resource</th>
                            <th>Resource ID</th>
                            <th>Details</th>
                            <th>IP Address</th>
                        </tr>
                    </thead>
                    <tbody id="logs-tbody">
                        <tr>
                            <td colspan="7" class="text-center">Loading audit logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div>
                    <span id="pagination-info">Loading...</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-secondary" id="prev-page" onclick="loadPage(-1)" disabled>Previous</button>
                    <span class="mx-2" id="page-info">Page 1</span>
                    <button class="btn btn-sm btn-secondary" id="next-page" onclick="loadPage(1)" disabled>Next</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const api = new HubAPI();
let currentPage = 0;
let pageSize = 50;
let totalLogs = 0;
let currentFilters = {};

async function loadLogs() {
    try {
        const filters = {
            ...currentFilters,
            limit: pageSize,
            offset: currentPage * pageSize
        };

        const response = await api.getAuditLogs(filters);
        if (response.success) {
            totalLogs = response.data.pagination.total;
            renderLogs(response.data.logs);
            updatePagination(response.data.pagination);
        } else {
            showError('Failed to load audit logs: ' + (response.error || 'Unknown error'));
        }
    } catch (error) {
        showError('Error loading audit logs: ' + error.message);
    }
}

function renderLogs(logs) {
    const tbody = document.getElementById('logs-tbody');
    
    if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No audit logs found</td></tr>';
        return;
    }

    tbody.innerHTML = logs.map(log => {
        const timestamp = new Date(log.timestamp).toLocaleString();
        const details = log.details ? JSON.stringify(log.details, null, 2) : '-';
        const resourceId = log.resourceId ? `<code>${log.resourceId.substring(0, 8)}...</code>` : '-';
        const ipAddress = log.ipAddress || '-';

        return `
            <tr>
                <td>${timestamp}</td>
                <td>
                    <div>${escapeHtml(log.userEmail)}</div>
                    <small class="text-muted">${log.userId.substring(0, 8)}...</small>
                </td>
                <td><span class="badge bg-info">${escapeHtml(log.action)}</span></td>
                <td><span class="badge bg-secondary">${escapeHtml(log.resourceType)}</span></td>
                <td>${resourceId}</td>
                <td>
                    ${details !== '-' ? `<pre class="small mb-0" style="max-width: 300px; overflow: auto;">${escapeHtml(details)}</pre>` : '-'}
                </td>
                <td><code>${ipAddress}</code></td>
            </tr>
        `;
    }).join('');
}

function updatePagination(pagination) {
    const totalPages = Math.ceil(pagination.total / pageSize);
    const currentPageNum = currentPage + 1;

    document.getElementById('page-info').textContent = `Page ${currentPageNum} of ${totalPages}`;
    document.getElementById('pagination-info').textContent = 
        `Showing ${pagination.offset + 1}-${Math.min(pagination.offset + pagination.limit, pagination.total)} of ${pagination.total} logs`;

    document.getElementById('prev-page').disabled = currentPage === 0;
    document.getElementById('next-page').disabled = !pagination.hasMore;
}

function loadPage(direction) {
    currentPage += direction;
    if (currentPage < 0) currentPage = 0;
    loadLogs();
}

function applyFilters() {
    currentFilters = {};
    
    const action = document.getElementById('filter-action').value.trim();
    const resource = document.getElementById('filter-resource').value.trim();
    const user = document.getElementById('filter-user').value.trim();
    const startDate = document.getElementById('filter-start-date').value;
    const endDate = document.getElementById('filter-end-date').value;

    if (action) currentFilters.action = action;
    if (resource) currentFilters.resourceType = resource;
    if (user) currentFilters.userId = user;
    if (startDate) currentFilters.startDate = startDate;
    if (endDate) currentFilters.endDate = endDate;

    currentPage = 0;
    loadLogs();
}

function clearFilters() {
    document.getElementById('filter-action').value = '';
    document.getElementById('filter-resource').value = '';
    document.getElementById('filter-user').value = '';
    document.getElementById('filter-start-date').value = '';
    document.getElementById('filter-end-date').value = '';
    currentFilters = {};
    currentPage = 0;
    loadLogs();
}

function exportLogs() {
    // Simple CSV export
    const filters = { ...currentFilters, limit: 10000, offset: 0 };
    
    api.getAuditLogs(filters).then(response => {
        if (response.success) {
            const logs = response.data.logs;
            const headers = ['Timestamp', 'User Email', 'User ID', 'Action', 'Resource Type', 'Resource ID', 'Details', 'IP Address'];
            const rows = logs.map(log => [
                log.timestamp,
                log.userEmail,
                log.userId,
                log.action,
                log.resourceType,
                log.resourceId || '',
                JSON.stringify(log.details || {}),
                log.ipAddress || ''
            ]);

            const csv = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `audit-logs-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    }).catch(error => {
        showError('Failed to export logs: ' + error.message);
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showError(message) {
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    setTimeout(() => {
        errorDiv.style.display = 'none';
    }, 5000);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadLogs();
});
</script>
