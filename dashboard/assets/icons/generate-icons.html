<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>StrategyHub Icon Generator</h1>
    <p>This page generates PWA icons from the SVG. Right-click and save the images below.</p>
    
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>
    
    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, size, size);
            
            // Bitcoin orange gradient overlay
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, 'rgba(247, 147, 26, 0.2)');
            gradient.addColorStop(1, 'rgba(247, 147, 26, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Bitcoin symbol - positioned higher to make room for HUB text
            ctx.fillStyle = '#f7931a';
            ctx.font = `bold ${Math.floor(size * 0.55)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('₿', size/2, size * 0.45);
            
            // HUB text at bottom
            ctx.fillStyle = '#f7931a';
            ctx.font = `bold ${Math.floor(size * 0.14)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('HUB', size/2, size * 0.82);
        }
        
        drawIcon(document.getElementById('icon192'), 192);
        drawIcon(document.getElementById('icon512'), 512);
        
        // Add download links
        document.getElementById('icon192').toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'icon-192x192.png';
            a.textContent = 'Download 192x192';
            a.style.display = 'block';
            a.style.margin = '10px';
            document.body.appendChild(a);
        });
        
        document.getElementById('icon512').toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'icon-512x512.png';
            a.textContent = 'Download 512x512';
            a.style.display = 'block';
            a.style.margin = '10px';
            document.body.appendChild(a);
        });
    </script>
</body>
</html>
