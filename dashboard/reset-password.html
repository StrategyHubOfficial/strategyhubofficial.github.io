---
layout: default
title: Reset Password
---

<style>
.reset-container {
    max-width: 500px;
    margin: 4rem auto;
    padding: 2rem;
}

.reset-form {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 2rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text-primary);
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.875rem;
    background: var(--bg-darker);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 1rem;
    font-family: inherit;
}

.form-group input:focus {
    outline: none;
    border-color: var(--bitcoin-orange);
    box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.1);
}

.help-text {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
}

.btn {
    flex: 1;
}
</style>

<div class="reset-container">
    <div class="reset-form">
        <h1>Reset Password</h1>
        <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Verifying token...</p>
        </div>
        <div id="error" class="error" style="display: none;"></div>
        <form id="reset-form" style="display: none;">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required minlength="8">
                <div class="help-text">Must be at least 8 characters</div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Reset Password</button>
            </div>
        </form>
    </div>
</div>

<script>
    (async function() {
        if (typeof toast === 'undefined' || typeof api === 'undefined') {
            setTimeout(arguments.callee, 50);
            return;
        }

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('error').textContent = 'Invalid reset link. Please request a new password reset.';
            document.getElementById('error').style.display = 'block';
            return;
        }

        // Verify token
        try {
            document.getElementById('loading').style.display = 'block';
            const response = await api.get(`/api/auth/reset-password/verify/${token}`);
            
            if (response.success && response.data.valid) {
                document.getElementById('email').value = response.data.email;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('reset-form').style.display = 'block';
            } else {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Invalid or expired reset token. Please request a new password reset.';
                document.getElementById('error').style.display = 'block';
            }
        } catch (error) {
            console.error('Error verifying token:', error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').textContent = 'Invalid or expired reset token. Please request a new password reset.';
            document.getElementById('error').style.display = 'block';
        }

        // Form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                toast.error('Passwords do not match');
                return;
            }

            if (password.length < 8) {
                toast.error('Password must be at least 8 characters');
                return;
            }

            try {
                const response = await api.post('/api/auth/reset-password', {
                    token: token,
                    password: password
                });

                if (response.success) {
                    toast.success('Password reset successfully! Redirecting to login...');
                    setTimeout(() => {
                        window.location.href = '/dashboard/login.html';
                    }, 2000);
                } else {
                    toast.error(response.error || 'Failed to reset password');
                }
            } catch (error) {
                console.error('Error resetting password:', error);
                toast.error('Error resetting password');
            }
        });
    })();
</script>
