name: Lint Frontend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: strategyhubofficial.github.io/package.json
    
    - name: Install dependencies
      working-directory: strategyhubofficial.github.io
      run: npm ci
    
    - name: Run ESLint
      working-directory: strategyhubofficial.github.io
      run: npm run lint

