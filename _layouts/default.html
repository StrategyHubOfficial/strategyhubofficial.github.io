<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}StrategyHub Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/dashboard/assets/css/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f7931a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StrategyHub">
    {% if page.styles %}{{ page.styles }}{% endif %}
</head>
<body>
    {% include navbar.html %}
    
    {{ content }}
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="/dashboard/assets/js/utils.js"></script>
    <script src="/dashboard/assets/js/config.js"></script>
    <script src="/dashboard/assets/js/api.js"></script>
    <script src="/dashboard/assets/js/auth.js"></script>
    {% unless page.url == '/dashboard/login.html' %}<script src="/dashboard/assets/js/protected-route.js"></script>{% endunless %}
    <script src="/dashboard/assets/js/toast.js"></script>
    <script src="/dashboard/assets/js/keyboard-shortcuts.js"></script>
    <script src="/dashboard/assets/js/form-validation.js"></script>
    <script src="/dashboard/assets/js/error-states.js"></script>
    
    <script>
        // Show admin menu if user is admin (do not call requireAuth here — protected-route.js
        // already verifies the session; a second requireAuth doubled /api/auth/me traffic and
        // contributed to spurious redirects on refresh.)
        (async function showAdminMenu() {
            const path = window.location.pathname || '';
            if (/login\.html$|login-2fa\.html$|forgot-password\.html$|register\.html$|reset-password\.html$/i.test(path)) {
                return;
            }
            let attempts = 0;
            while (typeof auth === 'undefined' && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            if (typeof auth === 'undefined') {
                return;
            }
            attempts = 0;
            while (typeof window.currentUser === 'undefined' && attempts < 80) {
                await new Promise((r) => setTimeout(r, 50));
                attempts++;
            }
            try {
                if (auth.isAdmin()) {
                    const adminMenu = document.getElementById('admin-menu');
                    if (adminMenu) {
                        adminMenu.classList.remove('d-none');
                    }
                }
            } catch (error) {
                console.debug('Admin menu check:', error.message || error);
            }
        })();

        // Logout handler
        const logoutLink = document.getElementById('logout-link');
        if (logoutLink && typeof auth !== 'undefined') {
            logoutLink.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    if (typeof toast !== 'undefined') {
                        toast.info('Logging out...');
                    }
                    await auth.logout();
                } catch (error) {
                    console.error('Logout failed:', error);
                    if (typeof auth !== 'undefined') {
                        auth.clearToken();
                    }
                    window.location.href = '/dashboard/login.html';
                }
            });
        }
    </script>
</body>
</html>
